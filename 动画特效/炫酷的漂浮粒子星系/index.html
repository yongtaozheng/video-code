<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>炫酷的漂浮粒子星系</title>
    <style>
      /*css样式*/
      body {
        margin: 0;
        overflow: hidden;
        background-color: #0c0c1e;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        min-height: 100vh;
      }

      #particle-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
    </style>
  </head>

  <body>
    <canvas id="particle-canvas"></canvas>
    <script>
      //js逻辑
      // 系统配置
      const config = {
        particleDensity: 9000,
        mouseRadius: 150,
        particleSize: {
          min: 1,
          max: 3,
        },
        particleSpeed: {
          min: -0.4,
          max: 0.4,
        }, // 稍微提高一点速度，让漂浮感更明显
        particleColor: "173, 216, 230",
        lineOpacityFactor: 20000,
        lineWidth: 0.5,
        connectionDistanceFactor: 7,
      };

      const canvas = document.getElementById("particle-canvas");
      const ctx = canvas.getContext("2d");
      let width, height, particlesArray, connectDistance;

      // 鼠标位置记录
      const mouse = {
        x: null,
        y: null,
        radius: config.mouseRadius,
      };

      // 鼠标事件监听
      window.addEventListener("mousemove", (event) => {
        mouse.x = event.x;
        mouse.y = event.y;
      });
      window.addEventListener("mouseout", () => {
        mouse.x = null;
        mouse.y = null;
      });

      window.addEventListener("resize", debounce(setupCanvas, 250));

      // 粒子类
      class Particle {
        constructor(x, y, directionX, directionY, size, color) {
          this.x = x;
          this.y = y;
          this.directionX = directionX;
          this.directionY = directionY;
          this.size = size;
          this.color = color;
          this.density = Math.random() * 30 + 10;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
          ctx.fillStyle = this.color;
          ctx.fill();
        }

        update() {
          // 与鼠标的交互
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < mouse.radius) {
            const forceDirectionX = dx / distance;
            const forceDirectionY = dy / distance;
            const maxDistance = mouse.radius;
            const force = (maxDistance - distance) / maxDistance;
            const directionX = forceDirectionX * force * this.density;
            const directionY = forceDirectionY * force * this.density;
            this.x -= directionX;
            this.y -= directionY;
          }

          this.x += this.directionX;
          this.y += this.directionY;

          // 边界碰撞检测
          if (this.x + this.size > width || this.x - this.size < 0) {
            this.directionX = -this.directionX;
          }
          if (this.y + this.size > height || this.y - this.size < 0) {
            this.directionY = -this.directionY;
          }

          this.draw();
        }
      }

      // 初始化
      function init() {
        particlesArray = [];
        const numberOfParticles = Math.floor(
          (width * height) / config.particleDensity
        );

        for (let i = 0; i < numberOfParticles; i++) {
          const size =
            Math.random() *
              (config.particleSize.max - config.particleSize.min) +
            config.particleSize.min;
          const x = Math.random() * (width - size * 2) + size;
          const y = Math.random() * (height - size * 2) + size;
          const directionX =
            Math.random() *
              (config.particleSpeed.max - config.particleSpeed.min) +
            config.particleSpeed.min;
          const directionY =
            Math.random() *
              (config.particleSpeed.max - config.particleSpeed.min) +
            config.particleSpeed.min;
          const color = `rgba(${config.particleColor}, ${
            Math.random() * 0.5 + 0.3
          })`;

          particlesArray.push(
            new Particle(x, y, directionX, directionY, size, color)
          );
        }
      }

      // 连接粒子
      function connect() {
        let opacityValue;
        for (let a = 0; a < particlesArray.length; a++) {
          for (let b = a; b < particlesArray.length; b++) {
            let distance =
              (particlesArray[a].x - particlesArray[b].x) ** 2 +
              (particlesArray[a].y - particlesArray[b].y) ** 2;

            if (distance < connectDistance) {
              opacityValue = 1 - distance / config.lineOpacityFactor;
              ctx.strokeStyle = `rgba(${config.particleColor}, ${opacityValue})`;
              ctx.lineWidth = config.lineWidth;
              ctx.beginPath();
              ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
              ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
              ctx.stroke();
            }
          }
        }
      }

      // 动画循环
      function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, width, height);

        for (const element of particlesArray) {
          element.update();
        }

        connect();
      }

      function debounce(func, delay) {
        let timeout;
        return function (...args) {
          clearTimeout(timeout);
          timeout = setTimeout(() => func.apply(this, args), delay);
        };
      }

      function setupCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        connectDistance =
          (width / config.connectionDistanceFactor) *
          (height / config.connectionDistanceFactor);
        init();
      }

      setupCanvas();
      animate();
    </script>
  </body>
</html>
