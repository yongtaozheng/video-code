<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 照片球</title>
    <style>
      :root {
        --tag-bg-color: #2c3e50;
        --tag-text-color: #ecf0f1;
        --tag-hover-bg-color: #3498db;
        --tag-hover-text-color: #ffffff;
        --bg-color: #1a1a1a;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: var(--bg-color);
        color: var(--tag-text-color);
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        text-align: center;
      }

      .tagcloud-wrapper {
        position: relative;
        width: 80vh;
        height: 80vh;
        max-width: 100vw;
        perspective: 1000px;
        cursor: grab;
      }

      .tagcloud {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform-origin: center center;
        will-change: transform;
        transform: translate(-50%, -50%);
      }

      .tagcloud__item {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        font-size: 1.85vmin;
        font-weight: 500;
        white-space: nowrap;
        user-select: none;
        will-change: transform;
        transform-style: preserve-3d;
        transform-origin: 0 0;
        transition:
          opacity 0.2s ease,
          z-index 0s;
      }

      .tagcloud__item.tagcloud__item--back {
        opacity: 0.4;
        pointer-events: none;
      }

      .tagcloud__item img {
        display: inline-block;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        backface-visibility: visible;
        border: 2px solid rgba(255, 255, 255, 0.1);
        -webkit-user-drag: none;
        user-select: none;
        cursor: pointer;
      }

      .tagcloud__item:hover {
        opacity: 1 !important;
        z-index: 100;
      }

      .tagcloud__item:hover img {
        transform: translate(-50%, -50%) scale(1.2);
        box-shadow: 0 8px 25px rgba(52, 152, 219, 0.5);
        border-color: var(--tag-hover-bg-color);
      }

      .info-panel {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.3);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        z-index: 100;
      }

      .info-panel p {
        margin: 0;
      }

      /* 图片放大查看模态框 */
      .image-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10000;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
      }

      .image-modal.show {
        display: flex;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .image-modal-content {
        position: relative;
        max-width: 90%;
        max-height: 90%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .image-modal-content img {
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        animation: zoomIn 0.3s ease;
      }

      @keyframes zoomIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .image-modal-close {
        position: absolute;
        top: 20px;
        right: 30px;
        color: #fff;
        font-size: 40px;
        font-weight: bold;
        cursor: pointer;
        z-index: 10001;
        width: 50px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        transition: background 0.3s ease;
      }

      .image-modal-close:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="tagcloud-wrapper">
      <div class="tagcloud"></div>
    </div>

    <!-- 图片放大查看模态框 -->
    <div class="image-modal" id="imageModal">
      <div class="image-modal-close" id="closeModal">&times;</div>
      <div class="image-modal-content">
        <img id="modalImage" src="" alt="放大图片" />
      </div>
    </div>

    <script>
      // js 代码
      const tagCloud = document.querySelector(".tagcloud");
      const wrapper = document.querySelector(".tagcloud-wrapper");

      // 图片URL数组 - 可以替换为自己的图片链接
      const tagsData = [
        "http://5b0988e595225.cdn.sohucs.com/images/20180130/24aecf0d680546ccbf6480badce389dc.jpeg",
        "https://pic3.zhimg.com/v2-f1159536dc58af663e3955e774a7a13a_r.jpg",
        "http://qqpublic.qpic.cn/qq_public_cover/0/0-2083471255-1DB77954D274653D98B57D000A686040_vsmcut/0",
        "https://nimg.ws.126.net/?url=http%3A%2F%2Fdingyue.ws.126.net%2F2022%2F1101%2F9be4344ej00rkno8n00y7d200u000g6g00zk00j5.jpg",
        "http://5b0988e595225.cdn.sohucs.com/images/20180824/781646fe72fc4788b7dfc24c112b5bbb.png",
        "http://p6.itc.cn/q_70/images03/20210106/6cd651a28f9a46268205410dcc5cad4d.jpeg",
        "https://wenhui.whb.cn/u/cms/www/201907/04234229c951.jpg",
        "https://i02piccdn.sogoucdn.com/51c83a39d119bd95",
        "https://i02piccdn.sogoucdn.com/cbbaca491a22d9a6",
        "https://i02piccdn.sogoucdn.com/797f0f9379b0488f",
        "https://i02piccdn.sogoucdn.com/e8b82aecb27dc774",
        "https://i02piccdn.sogoucdn.com/c740426f11129260",
        "https://i03piccdn.sogoucdn.com/c3edcbfd041b55dd",
        "https://i02piccdn.sogoucdn.com/e6d2d37c98b5afc0",
        "https://i02piccdn.sogoucdn.com/3bc0e88a300aa596",
        "https://i04piccdn.sogoucdn.com/12f550d2b11ae48e",
        "https://i02piccdn.sogoucdn.com/04b7666f6af4bade",
        "https://i02piccdn.sogoucdn.com/c09d5ff39af7b34a",
        "https://i01piccdn.sogoucdn.com/812b5e0c54829db0",
        "https://i02piccdn.sogoucdn.com/be2b4d57b0755789",
        "https://i02piccdn.sogoucdn.com/86442b99c1edd4e3",
        "https://i04piccdn.sogoucdn.com/a9d58b23cb24359a",
        "https://i03piccdn.sogoucdn.com/c5b5bd9e235ad67e",
        "https://i02piccdn.sogoucdn.com/ac22d1a123368929",
        "https://i01piccdn.sogoucdn.com/02d7be0c66ee7eae",
      ];

      const uniqueTags = [...new Set(tagsData)];
      const MAX_TAGS = 36;
      let radius = Math.min(wrapper.offsetWidth, wrapper.offsetHeight) / 2.4;

      let angleX = 0,
        angleY = 0;
      let velX = 0,
        velY = 0.05;
      let isDragging = false;
      /** 拖拽起点（按下时的坐标偏移量），仅 mousedown 时写入 */
      let dragStartX, dragStartY;
      /** 按下时的角度，用于计算相对旋转 */
      let angleXAtDragStart, angleYAtDragStart;
      /** 上一帧鼠标位置，用于 mousemove 时算位移 */
      let lastMouseX, lastMouseY;
      const friction = 0.98;
      /** 用户有过拖拽/点击后不再自动恢复旋转 */
      let userHasInteracted = false;
      /** 仅当本帧位移超过该像素数才写入速度，避免点击或微动就转 */
      const DRAG_THRESHOLD_PX = 4;
      /** 相对按下点移动超过该像素数才开始旋转，确保「按下不转、移动才转」 */
      const MOVE_THRESHOLD_PX = 2;

      /** 直接映射：屏幕位移 → 角度增量。背面时对上下方向做符号翻转，不引入雅可比，避免闪动 */
      function screenDeltaToAngleDelta(dx, dy) {
        const sensitivity = 0.08;
        const ay = (angleY * Math.PI) / 180;
        const cosY = Math.cos(ay);
        // 背面（cosY < 0）时上下方向反转，使「鼠标向下 → 球向下」在背面也成立
        const signY = cosY >= 0 ? 1 : -1;
        return {
          dAngleX: dy * sensitivity * signY,
          dAngleY: dx * sensitivity,
        };
      }

      const tagElements = [];
      let clickStartX, clickStartY;
      let hasDragged = false;

      function createTags() {
        tagCloud.innerHTML = "";
        tagElements.length = 0;
        const totalTags = Math.min(MAX_TAGS, uniqueTags.length);
        /* 黄金角弧度，使经度方向均匀分散 */
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < totalTags; i++) {
          const imageUrl = uniqueTags[i];
          const tagEl = document.createElement("div");
          tagEl.className = "tagcloud__item";

          const imgEl = document.createElement("img");
          imgEl.src = imageUrl;
          imgEl.alt = `图片 ${i + 1}`;
          imgEl.loading = "lazy";
          imgEl.draggable = false;
          imgEl.ondragstart = () => false;
          // 添加点击事件，放大查看图片
          imgEl.addEventListener("mousedown", (e) => {
            e.stopPropagation();
            clickStartX = e.clientX;
            clickStartY = e.clientY;
            hasDragged = false;
          });

          imgEl.addEventListener("mousemove", (e) => {
            if (clickStartX !== undefined && clickStartY !== undefined) {
              const dx = Math.abs(e.clientX - clickStartX);
              const dy = Math.abs(e.clientY - clickStartY);
              if (dx > 5 || dy > 5) {
                hasDragged = true;
              }
            }
          });

          imgEl.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!hasDragged) {
              openImageModal(imageUrl);
            }
            hasDragged = false;
          });
          tagEl.appendChild(imgEl);

          /* 对称 Fibonacci 球面：高度用 (i+0.5)/n 避免两极过密，分布更均匀 */
          const y = 1 - (2 * (i + 0.5)) / totalTags;
          const radiusAtY = Math.sqrt(Math.max(1 - y * y, 0.01));
          const theta = goldenAngle * i;
          const x = Math.cos(theta) * radiusAtY;
          const z = Math.sin(theta) * radiusAtY;

          const finalX = x * radius;
          const finalY = y * radius;
          const finalZ = z * radius;

          const yaw = Math.atan2(x, z);
          const pitch = Math.atan2(y, Math.sqrt(x * x + z * z));
          const yaw_deg = (yaw * 180) / Math.PI;
          const pitch_deg = (pitch * 180) / Math.PI;
          const transform = `translate3d(${finalX}px, ${finalY}px, ${finalZ}px) rotateY(${yaw_deg}deg) rotateX(${-pitch_deg}deg)`;
          tagEl.style.transform = transform;

          tagEl.dataset.x = String(x);
          tagEl.dataset.y = String(y);
          tagEl.dataset.z = String(z);
          tagElements.push(tagEl);
          tagCloud.appendChild(tagEl);
        }
      }

      /* 背面判断：CSS 3D 中正 Z 指向观察者，背面为 viewZ < 0；与 MDN rotateX 矩阵一致 */
      function updateBackfaceVisibility() {
        const ax = (-angleX * Math.PI) / 180;
        const ay = (angleY * Math.PI) / 180;
        const cosX = Math.cos(ax),
          sinX = Math.sin(ax);
        const cosY = Math.cos(ay),
          sinY = Math.sin(ay);
        tagElements.forEach((el) => {
          const x = parseFloat(el.dataset.x);
          const y = parseFloat(el.dataset.y);
          const z = parseFloat(el.dataset.z);
          /* 先 rotateX(-angleX)：z' = y*sin(ax)+z*cos(ax)；再 rotateY(angleY)：viewZ = -x*sin(ay)+z'*cos(ay) */
          const zAfterX = y * sinX + z * cosX;
          const viewZ = -x * sinY + zAfterX * cosY;
          el.classList.toggle("tagcloud__item--back", viewZ < 0);
        });
      }

      function animate() {
        if (!isDragging) {
          angleY += velY;
          angleX += velX;
          velY *= friction;
          velX *= friction;
          // 仅在没有用户交互过时恢复缓慢自动转（初次进入页面）
          if (
            !userHasInteracted &&
            Math.abs(velX) < 0.0001 &&
            Math.abs(velY) < 0.0001
          ) {
            velY = 0.05 * (Math.random() > 0.5 ? 1 : -1);
          }
        }

        const rotateXTransform = `rotateX(${-angleX}deg)`;
        const rotateYTransform = `rotateY(${angleY}deg)`;
        // 先居中，再旋转，确保球心固定在容器中心
        tagCloud.style.transform = `translate(-50%, -50%) ${rotateYTransform} ${rotateXTransform}`;
        updateBackfaceVisibility();

        requestAnimationFrame(animate);
      }

      function setupEventListeners() {
        wrapper.addEventListener("mousedown", (e) => {
          if (e.target.tagName === "IMG") return;
          // 按下时只计算并记录坐标偏移量和当前角度，不旋转小球
          isDragging = true;
          userHasInteracted = true;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          angleXAtDragStart = angleX;
          angleYAtDragStart = angleY;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          wrapper.style.cursor = "grabbing";
          velX = 0;
          velY = 0;
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastMouseX;
          const dy = e.clientY - lastMouseY;
          const totalMove = Math.sqrt(
            (e.clientX - dragStartX) ** 2 + (e.clientY - dragStartY) ** 2
          );
          // 只有移动超过阈值后才旋转，且用本帧位移增量严格跟随，避免闪动
          if (totalMove >= MOVE_THRESHOLD_PX) {
            const { dAngleX, dAngleY } = screenDeltaToAngleDelta(dx, dy);
            angleX += dAngleX;
            angleY += dAngleY;
            const velocityBlend = 0.4; // 适度惯性
            velX = velX * (1 - velocityBlend) + dAngleX * velocityBlend;
            velY = velY * (1 - velocityBlend) + dAngleY * velocityBlend;
          }
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        });

        const stopDragging = () => {
          if (isDragging) {
            isDragging = false;
            wrapper.style.cursor = "grab";
            // 保持当前速度，让球继续惯性旋转
          }
        };
        window.addEventListener("mouseup", stopDragging);
        wrapper.addEventListener("mouseleave", stopDragging);

        wrapper.addEventListener(
          "touchstart",
          (e) => {
            // 按下时只记录坐标偏移量和当前角度，不旋转
            isDragging = true;
            userHasInteracted = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            angleXAtDragStart = angleX;
            angleYAtDragStart = angleY;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
            velX = 0;
            velY = 0;
          },
          { passive: true },
        );

        window.addEventListener(
          "touchmove",
          (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - lastMouseX;
            const dy = e.touches[0].clientY - lastMouseY;
            const totalMove = Math.sqrt(
              (e.touches[0].clientX - dragStartX) ** 2 +
                (e.touches[0].clientY - dragStartY) ** 2
            );
            if (totalMove >= MOVE_THRESHOLD_PX) {
              const { dAngleX, dAngleY } = screenDeltaToAngleDelta(dx, dy);
              angleX += dAngleX;
              angleY += dAngleY;
              const velocityBlend = 0.4;
              velX = velX * (1 - velocityBlend) + dAngleX * velocityBlend;
              velY = velY * (1 - velocityBlend) + dAngleY * velocityBlend;
            }
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
          },
          { passive: false },
        );

        window.addEventListener("touchend", () => {
          if (isDragging) {
            isDragging = false;
            // 保持当前速度，让球继续惯性旋转
          }
        });

        let resizeTimeout;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            radius = Math.min(wrapper.offsetWidth, wrapper.offsetHeight) / 2.4;
            createTags();
          }, 200);
        });
      }

      // 图片放大查看功能
      const imageModal = document.getElementById("imageModal");
      const modalImage = document.getElementById("modalImage");
      const closeModal = document.getElementById("closeModal");

      function openImageModal(imageSrc) {
        modalImage.src = imageSrc;
        imageModal.classList.add("show");
        // 阻止背景滚动
        document.body.style.overflow = "hidden";
      }

      function closeImageModal() {
        imageModal.classList.remove("show");
        // 恢复背景滚动
        document.body.style.overflow = "";
      }

      // 关闭按钮点击事件
      closeModal.addEventListener("click", closeImageModal);

      // 点击背景关闭模态框
      imageModal.addEventListener("click", (e) => {
        if (e.target === imageModal) {
          closeImageModal();
        }
      });

      // ESC键关闭模态框
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && imageModal.classList.contains("show")) {
          closeImageModal();
        }
      });

      createTags();
      animate();
      setupEventListeners();
    </script>
  </body>
</html>
