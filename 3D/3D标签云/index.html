<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Tag Cloud</title>
    <style>
        :root {
            --tag-bg-color: #2c3e50;
            --tag-text-color: #ecf0f1;
            --tag-hover-bg-color: #3498db;
            --tag-hover-text-color: #ffffff;
            --bg-color: #1a1a1a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--tag-text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .tagcloud-wrapper {
            position: relative;
            width: 80vmin;
            height: 80vmin;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tagcloud {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
            /* The rotation will be set by JS */
        }

        .tagcloud__item {
            position: absolute;
            top: 50%;
            left: 50%;
            /* Centering is done in JS now */
            margin: -20px -50px; /* Rough estimate to center, adjust if needed */

            font-size: 2.5vmin;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            
            will-change: transform;
            /* Individual transform is now set by JS for initial positioning */
        }
        
        .tagcloud__item span {
            display: inline-block;
            background-color: var(--tag-bg-color);
            color: var(--tag-text-color);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
        }

        .tagcloud__item:hover span {
            background-color: var(--tag-hover-bg-color);
            color: var(--tag-hover-text-color);
            transform: scale(1.15); /* Slightly lift the tag on hover */
        }

        .info-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            z-index: 100;
        }
        .info-panel p {
            margin: 0;
        }

    </style>
</head>
<body>

    <div class="tagcloud-wrapper">
        <div class="info-panel">
            <p><strong>3D Tag Cloud</strong></p>
            <p>Click and drag to rotate.</p>
        </div>
        <div class="tagcloud">
            <!-- Tags will be dynamically generated by JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tagCloud = document.querySelector('.tagcloud');
            const wrapper = document.querySelector('.tagcloud-wrapper');

            const tagsData = [
                'HTML5', 'CSS3', 'JavaScript', 'React', 'Vue.js', 'Angular',
                'Node.js', 'Express', 'Python', 'Django', 'Flask', 'SQL',
                'MongoDB', 'Git', 'Docker', 'Kubernetes', 'AWS', 'Azure',
                'GCP', 'CI/CD', 'Jest', 'Cypress', 'Webpack', 'Vite',
                'SASS', 'TypeScript', 'GraphQL', 'REST API', 'Figma', 'UI/UX'
            ];

            const radius = Math.min(wrapper.offsetWidth, wrapper.offsetHeight) / 2.5;
            const totalTags = tagsData.length;
            
            // State variables
            let angleX = 0; // Rotation around X-axis (vertical drag)
            let angleY = 0; // Rotation around Y-axis (horizontal drag)
            
            // Velocity for inertia
            let velX = 0;
            let velY = 0.05; // Start with a slow auto-rotation

            let isDragging = false;
            let lastMouseX, lastMouseY;
            const friction = 0.98; // How quickly the rotation slows down

            function createTags() {
                tagCloud.innerHTML = ''; // Clear existing tags
                tagsData.forEach((text, i) => {
                    const tagEl = document.createElement('div');
                    tagEl.className = 'tagcloud__item';
                    
                    const spanEl = document.createElement('span');
                    spanEl.innerText = text;
                    tagEl.appendChild(spanEl);

                    // Distribute tags evenly on a sphere using Fibonacci lattice
                    const phi = Math.acos(-1 + (2 * i + 1) / totalTags);
                    const theta = Math.sqrt(totalTags * Math.PI) * phi;
                    
                    const x = radius * Math.cos(theta) * Math.sin(phi);
                    const y = radius * Math.sin(theta) * Math.sin(phi);
                    const z = radius * Math.cos(phi);
                    
                    // Set the initial 3D position of the tag
                    tagEl.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
                    
                    tagCloud.appendChild(tagEl);
                });
            }

            function animate() {
                if (!isDragging) {
                    // Apply velocity for inertia and auto-rotation
                    angleY += velY;
                    angleX += velX;

                    // Apply friction
                    velY *= friction;
                    velX *= friction;

                    // If it slows down too much, give it a tiny push to keep it moving
                    if (Math.abs(velY) < 0.0001) velY = 0.01 * (Math.random() > 0.5 ? 1 : -1);
                    if (Math.abs(velX) < 0.0001) velX = 0;
                }
                
                // Apply the rotation to the whole cloud
                const rotateX = `rotateX(${angleX}deg)`;
                const rotateY = `rotateY(${angleY}deg)`;
                tagCloud.style.transform = `${rotateY} ${rotateX}`;

                requestAnimationFrame(animate);
            }

            // Mouse event handlers
            wrapper.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                wrapper.style.cursor = 'grabbing';
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                
                // Update angles directly based on mouse movement
                angleY += dx * 0.2; // horizontal drag rotates around Y-axis
                angleX -= dy * 0.2; // vertical drag rotates around X-axis
                
                // Update velocities for inertia
                velY = dx * 0.2;
                velX = -dy * 0.2;

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                wrapper.style.cursor = 'grab';
            });
            
             wrapper.addEventListener('mouseleave', () => {
                isDragging = false;
                wrapper.style.cursor = 'grab';
            });

            // Touch event handlers for mobile
            wrapper.addEventListener('touchstart', (e) => {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, { passive: true });
            
            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                
                const dx = e.touches[0].clientX - lastMouseX;
                const dy = e.touches[0].clientY - lastMouseY;
                
                angleY += dx * 0.2;
                angleX -= dy * 0.2;

                velY = dx * 0.2;
                velX = -dy * 0.2;
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }, { passive: true });

            window.addEventListener('touchend', () => {
                isDragging = false;
            });

            // Initialization
            createTags();
            animate();

            // Handle window resize
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    // Recalculate radius and re-create tags
                    const newRadius = Math.min(wrapper.offsetWidth, wrapper.offsetHeight) / 2.5;
                    // You might need a more sophisticated update logic if you want to preserve rotation
                    location.reload(); // Simple solution: just reload the page
                }, 200);
            });
        });
    </script>
</body>
</html>
