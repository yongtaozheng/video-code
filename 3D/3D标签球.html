<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 标签球</title>
    <style>
      :root {
        --tag-bg-color: #2c3e50;
        --tag-text-color: #ecf0f1;
        --tag-hover-bg-color: #3498db;
        --tag-hover-text-color: #ffffff;
        --bg-color: #1a1a1a;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background-color: var(--bg-color);
        color: var(--tag-text-color);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        text-align: center;
      }

      .tagcloud-wrapper {
        position: relative;
        width: 80vmin;
        height: 80vmin;
        perspective: 1000px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: grab;
      }

      .tagcloud {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .tagcloud__item {
        position: absolute;
        top: 50%;
        left: 50%;
        margin: 0;
        font-size: 2.5vmin;
        font-weight: 500;
        white-space: nowrap;
        user-select: none;
        will-change: transform;
        transform-style: preserve-3d;
      }

      .tagcloud__item span {
        display: block;
        transform: translate(-50%, -50%);
        padding: 8px 16px;
        background-color: var(--tag-bg-color);
        color: var(--tag-text-color);
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        transition:
          background-color 0.3s ease,
          color 0.3s ease,
          transform 0.3s ease;
        backface-visibility: hidden;
      }

      .tagcloud__item:hover span {
        background-color: var(--tag-hover-bg-color);
        color: var(--tag-hover-text-color);
        transform: translate(-50%, -50%) scale(1.1);
      }

      .info-panel {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.3);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        z-index: 100;
      }
      .info-panel p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="tagcloud-wrapper">
      <div class="tagcloud"></div>
    </div>

    <script>
      const tagCloud = document.querySelector(".tagcloud");
      const wrapper = document.querySelector(".tagcloud-wrapper");

      const tagsData = [
        "HTML5",
        "CSS3",
        "JavaScript",
        "React",
        "Vue.js",
        "Angular",
        "Node.js",
        "Express",
        "Python",
        "Django",
        "Flask",
        "SQL",
        "MongoDB",
        "Git",
        "Docker",
        "Kubernetes",
        "AWS",
        "Azure",
        "GCP",
        "CI/CD",
        "Jest",
        "Cypress",
        "Webpack",
        "Vite",
        "SASS",
        "TypeScript",
        "GraphQL",
        "REST API",
        "Figma",
        "UI/UX",
        "Tailwind CSS",
        "Bootstrap",
        "Material UI",
        "Ant Design",
        "Chakra UI",
        "Redux",
        "React Router",
        "React Hook Form",
        "React Native",
        "Expo",
        "Firebase",
        "Supabase",
        "PostgreSQL",
        "MySQL",
        "SQLite",
        "Redis",
        "Elasticsearch",
        "Kibana",
        "Logstash",
        "Kubernetes",
        "Docker",
        "Git",
        "GitHub",
        "GitLab",
        "Bitbucket",
        "Jira",
        "Trello",
        "Asana",
        "Notion",
        "Microsoft 365",
        "Figma",
        "Sketch",
        "Photoshop",
        "Illustrator",
        "InDesign",
        "Premiere Pro",
        "After Effects",
        "Lightroom",
        "Audition",
      ];

      let radius = Math.min(wrapper.offsetWidth, wrapper.offsetHeight) / 2.5;

      let angleX = 0,
        angleY = 0;
      let velX = 0,
        velY = 0.05;
      let isDragging = false;
      let lastMouseX, lastMouseY;
      const friction = 0.98;

      function createTags() {
        tagCloud.innerHTML = "";
        const totalTags = tagsData.length;
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        tagsData.forEach((text, i) => {
          const tagEl = document.createElement("div");
          tagEl.className = "tagcloud__item";

          const spanEl = document.createElement("span");
          spanEl.innerText = text;
          tagEl.appendChild(spanEl);
          const y = 1 - (2 * i) / (totalTags - 1);
          const radiusAtY = Math.sqrt(1 - y * y);
          const theta = goldenAngle * i;
          const x = Math.cos(theta) * radiusAtY;
          const z = Math.sin(theta) * radiusAtY;

          const finalX = x * radius;
          const finalY = y * radius;
          const finalZ = z * radius;

          const yaw = Math.atan2(x, z);
          const pitch = Math.atan2(y, Math.sqrt(x * x + z * z));

          const yaw_deg = (yaw * 180) / Math.PI;
          const pitch_deg = (pitch * 180) / Math.PI;
          const transform = `translate3d(${finalX}px, ${finalY}px, ${finalZ}px) rotateY(${yaw_deg}deg) rotateX(${-pitch_deg}deg)`;

          tagEl.style.transform = transform;

          tagCloud.appendChild(tagEl);
        });
      }

      function animate() {
        if (!isDragging) {
          angleY += velY;
          angleX += velX;
          velY *= friction;
          velX *= friction;
          if (Math.abs(velX) < 0.0001 && Math.abs(velY) < 0.0001) {
            velY = 0.05 * (Math.random() > 0.5 ? 1 : -1);
          }
        }

        const rotateXTransform = `rotateX(${-angleX}deg)`;
        const rotateYTransform = `rotateY(${angleY}deg)`;
        tagCloud.style.transform = `${rotateYTransform} ${rotateXTransform}`;

        requestAnimationFrame(animate);
      }

      function setupEventListeners() {
        wrapper.addEventListener("mousedown", (e) => {
          isDragging = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          wrapper.style.cursor = "grabbing";
          velX = 0;
          velY = 0;
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastMouseX;
          const dy = e.clientY - lastMouseY;
          angleY += dx * 0.2;
          angleX += dy * 0.2;
          velY = dx * 0.2;
          velX = dy * 0.2;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        });

        const stopDragging = () => {
          if (isDragging) {
            isDragging = false;
            wrapper.style.cursor = "grab";
          }
        };
        window.addEventListener("mouseup", stopDragging);
        wrapper.addEventListener("mouseleave", stopDragging);

        wrapper.addEventListener(
          "touchstart",
          (e) => {
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
            velX = 0;
            velY = 0;
          },
          { passive: true },
        );

        window.addEventListener(
          "touchmove",
          (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - lastMouseX;
            const dy = e.touches[0].clientY - lastMouseY;
            angleY += dx * 0.2;
            angleX += dy * 0.2;
            velY = dx * 0.2;
            velX = dy * 0.2;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
          },
          { passive: false },
        );

        window.addEventListener("touchend", () => {
          isDragging = false;
        });

        let resizeTimeout;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimeout);
          resizeTimeout = setTimeout(() => {
            radius = Math.min(wrapper.offsetWidth, wrapper.offsetHeight) / 2.5;
            createTags();
          }, 200);
        });
      }

      createTags();
      animate();
      setupEventListeners();
    </script>
  </body>
</html>
