    <title>Cat Follows Mouse</title>
    <style>
      /* 设置页面样式，让小猫居中显示 */
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background-color: #e0e0e0;
        overflow: hidden; /* 隐藏滚动条 */
      }

      /* 设置SVG容器大小 */
      .cat-container {
        width: 300px;
        /* 新增：轻微的过渡效果，让姿态变化更平滑（如果未来有动态变化） */
        transition: transform 0.3s ease-in-out;
      }

      /*
       * 新增：调整小猫的姿态
       * 1. rotate(-10deg): 将整个SVG逆时针旋转10度，使其“坐直”。
       * 2. translateY(15px): 轻微下移，以补偿旋转后视觉上的位置偏移。
      */
      .cat-container svg {
        transform: rotate(-10deg) translateY(15px);
      }
    </style>

    <script>
      // 获取需要操作的DOM元素
      const leftPupil = document.getElementById("pupil-left");
      const rightPupil = document.getElementById("pupil-right");
      const leftEyeSocket = document.getElementById("eye-socket-left");
      const rightEyeSocket = document.getElementById("eye-socket-right");

      // 定义瞳孔在眼眶内可以移动的最大半径
      const maxRadius = 2.5;

      /**
       * 移动单个眼睛的函数
       * @param {MouseEvent} event - 鼠标移动事件
       * @param {SVGElement} eyeSocket - 眼眶元素
       * @param {SVGElement} pupil - 瞳孔组元素
       */
      function moveEye(event, eyeSocket, pupil) {
        // 获取眼眶在屏幕上的位置和尺寸
        const eyeRect = eyeSocket.getBoundingClientRect();
        // 计算眼眶的中心点坐标
        const eyeCenterX = eyeRect.left + eyeRect.width / 2;
        const eyeCenterY = eyeRect.top + eyeRect.height / 2;

        // 获取鼠标的当前坐标
        const mouseX = event.clientX;
        const mouseY = event.clientY;

        // 计算从眼心到鼠标的向量
        const deltaX = mouseX - eyeCenterX;
        const deltaY = mouseY - eyeCenterY;

        // 使用 atan2 计算角度
        const angle = Math.atan2(deltaY, deltaX);

        // 使用三角函数计算瞳孔应该移动到的新位置
        // 这个位置是相对于瞳孔原始位置的偏移量
        const moveX = Math.cos(angle) * maxRadius;
        const moveY = Math.sin(angle) * maxRadius;

        // 应用 transform 样式来移动瞳孔
        pupil.style.transform = `translate(${moveX}px, ${moveY}px)`;
      }

      // 添加全局鼠标移动事件监听器
      window.addEventListener("mousemove", (event) => {
        // 当鼠标移动时，同时更新两只眼睛的位置
        moveEye(event, leftEyeSocket, leftPupil);
        moveEye(event, rightEyeSocket, rightPupil);
      });
    </script>
