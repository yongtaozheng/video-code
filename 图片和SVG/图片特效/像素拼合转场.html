<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素拼合转场</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      body.idle {
        cursor: none;
      }

      .stage {
        position: fixed;
        inset: 0;
      }

      .stage .bg-img {
        position: absolute;
        inset: 0;
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
      }

      .pixel-grid {
        position: absolute;
        inset: 0;
        display: grid;
        z-index: 10;
      }
      .pixel-cell {
        position: relative;
        overflow: hidden;
        opacity: 0;
        transform: scale(0) rotate(var(--rot, 0deg));
        filter: brightness(2) blur(4px);
      }
      .pixel-cell.show {
        opacity: 1;
        transform: scale(1) rotate(0deg);
        filter: brightness(1) blur(0);
        transition:
          opacity var(--cell-dur) cubic-bezier(0.34, 1.56, 0.64, 1),
          transform var(--cell-dur) cubic-bezier(0.34, 1.56, 0.64, 1),
          filter var(--cell-dur) ease;
      }
      .pixel-cell .cell-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="bg-img" id="bgImg"></div>
    </div>

    <script>
      (() => {
        const stage = document.getElementById("stage");
        const bgImg = document.getElementById("bgImg");

        const images = [
          "../../images/20220829143113_709aa.jpeg",
          "../../images/20220915224545_c2170.jpeg",
          "../../images/20230327231735_a195d.jpg",
          "../../images/7392069948318558889.png",
          "../images/IMG_6589.JPG",
        ];

        let current = 0;
        let transitioning = false;
        let autoTimer = null;
        const AUTO_INTERVAL = 4000;

        const COLS = 12;
        const ROWS = 8;
        const CELL_DUR = "0.45s";
        const STAGGER = 18;

        showImage(0);
        startAuto();

        function showImage(index) {
          bgImg.style.backgroundImage = `url(${images[index]})`;
        }

        async function pixelTransitionTo(nextIndex) {
          if (transitioning || images.length < 2) return;
          transitioning = true;

          const url = images[nextIndex];

          const grid = document.createElement("div");
          grid.className = "pixel-grid";
          grid.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
          grid.style.gridTemplateRows = `repeat(${ROWS}, 1fr)`;
          grid.style.setProperty("--cell-dur", CELL_DUR);

          const cells = [];
          const cellW = window.innerWidth / COLS;
          const cellH = window.innerHeight / ROWS;

          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const cell = document.createElement("div");
              cell.className = "pixel-cell";
              cell.style.setProperty(
                "--rot",
                `${(Math.random() - 0.5) * 20}deg`,
              );

              const img = document.createElement("div");
              img.className = "cell-img";
              img.style.backgroundImage = `url(${url})`;
              img.style.backgroundSize = "contain";
              img.style.backgroundPosition = "center";
              img.style.backgroundRepeat = "no-repeat";
              img.style.backgroundColor = "#000";
              img.style.left = `${-c * cellW}px`;
              img.style.top = `${-r * cellH}px`;
              img.style.width = "100vw";
              img.style.height = "100vh";

              cell.appendChild(img);
              grid.appendChild(cell);
              cells.push({ el: cell, r, c });
            }
          }

          stage.appendChild(grid);

          const centerR = (ROWS - 1) / 2;
          const centerC = (COLS - 1) / 2;
          cells.sort((a, b) => {
            const distA = Math.hypot(a.r - centerR, a.c - centerC);
            const distB = Math.hypot(b.r - centerR, b.c - centerC);
            return distA - distB + (Math.random() - 0.5) * 1.5;
          });

          await sleep(30);
          cells.forEach((cell, i) => {
            setTimeout(() => cell.el.classList.add("show"), i * STAGGER);
          });

          const totalWait =
            cells.length * STAGGER + parseFloat(CELL_DUR) * 1000 + 100;
          await sleep(totalWait);

          current = nextIndex;
          showImage(current);
          grid.remove();

          transitioning = false;
        }

        function startAuto() {
          stopAuto();
          if (images.length < 2) return;
          autoTimer = setInterval(() => {
            const next = (current + 1) % images.length;
            pixelTransitionTo(next);
          }, AUTO_INTERVAL);
        }
        function stopAuto() {
          clearInterval(autoTimer);
          autoTimer = null;
        }

        function goNext() {
          if (images.length < 2 || transitioning) return;
          stopAuto();
          const next = (current + 1) % images.length;
          pixelTransitionTo(next).then(startAuto);
        }
        function goPrev() {
          if (images.length < 2 || transitioning) return;
          stopAuto();
          const prev = (current - 1 + images.length) % images.length;
          pixelTransitionTo(prev).then(startAuto);
        }

        document.addEventListener("click", goNext);
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight" || e.key === " ") {
            e.preventDefault();
            goNext();
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            goPrev();
          }
        });

        let cursorTimer;
        document.addEventListener("mousemove", () => {
          document.body.classList.remove("idle");
          clearTimeout(cursorTimer);
          cursorTimer = setTimeout(
            () => document.body.classList.add("idle"),
            2000,
          );
        });

        function sleep(ms) {
          return new Promise((r) => setTimeout(r, ms));
        }
      })();
    </script>
  </body>
</html>
