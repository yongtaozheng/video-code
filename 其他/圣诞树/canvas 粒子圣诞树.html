<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>canvas 粒子圣诞树</title>
    <style>
      /* css样式 */
      body {
        margin: 0;
        overflow: hidden;
        background-color: #0d1b2a;
      }
      canvas {
        display: block;
      }
      .info {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.8);
        font-size: 2rem;
        text-shadow: 0 0 10px #00b4d8, 0 0 20px #00b4d8;
        pointer-events: none;
        text-align: center;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="info">Merry Christmas</div>
    <canvas id="particleCanvas"></canvas>

    <script>
      //js逻辑
      const canvas = document.getElementById("particleCanvas");
      const ctx = canvas.getContext("2d");

      let particles = [];
      let snowflakes = [];

      const mouse = {
        x: null,
        y: null,
        radius: 100,
      };

      const PARTICLE_COUNT = 3500;
      const SNOWFLAKE_COUNT = 150;
      const TREE_COLORS = [
        "#1a535c",
        "#4ecdc4",
        "#f7fff7",
        "#ff6b6b",
        "#ffe66d",
      ];
      const STAR_COLOR = "#ffd700";

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
      });

      window.addEventListener("mousemove", (event) => {
        mouse.x = event.x;
        mouse.y = event.y;
      });

      window.addEventListener("mouseout", () => {
        mouse.x = null;
        mouse.y = null;
      });

      class Particle {
        constructor(targetX, targetY, color, isStar = false) {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.targetX = targetX;
          this.targetY = targetY;
          this.color = color;
          this.size = isStar ? Math.random() * 3 + 2 : Math.random() * 2 + 1;
          this.baseSize = this.size;
          this.density = Math.random() * 30 + 1;
          this.isStar = isStar;

          this.shimmerSpeed = Math.random() * 0.1 + 0.05;
          this.shimmerOffset = Math.random() * Math.PI * 2;
        }

        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
        }

        update() {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          let forceDirectionX = dx / distance;
          let forceDirectionY = dy / distance;
          let maxDistance = mouse.radius;
          let force = (maxDistance - distance) / maxDistance;

          let directionX = 0;
          let directionY = 0;

          if (distance < mouse.radius) {
            directionX -= forceDirectionX * force * this.density;
            directionY -= forceDirectionY * force * this.density;
          } else {
            directionX = (this.targetX - this.x) / 15;
            directionY = (this.targetY - this.y) / 15;
          }

          this.x += directionX;
          this.y += directionY;

          const shimmer =
            Math.sin(
              Date.now() * 0.001 * this.shimmerSpeed + this.shimmerOffset
            ) *
              0.5 +
            0.5;
          this.size = this.baseSize * (shimmer + 0.5);

          if (this.isStar) {
            this.size = this.baseSize * (shimmer * 1.5 + 0.8);
          }
        }
      }

      class Snowflake {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 2.5 + 1;
          this.speed = Math.random() * 1.5 + 0.5;
          this.opacity = Math.random() * 0.5 + 0.3;
          this.wobble = Math.random() * 0.02;
        }

        draw() {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
        }

        update() {
          this.y += this.speed;
          this.x += Math.sin(this.y * this.wobble);

          if (this.y > canvas.height) {
            this.y = -this.size;
            this.x = Math.random() * canvas.width;
          }
        }
      }

      function getPointInTriangle(p1, p2, p3) {
        let s = Math.random();
        let t = Math.random();
        if (s + t > 1) {
          s = 1 - s;
          t = 1 - t;
        }
        let a = 1 - s - t;
        let x = a * p1.x + s * p2.x + t * p3.x;
        let y = a * p1.y + s * p2.y + t * p3.y;
        return { x, y };
      }

      function getPointInRectangle(x, y, width, height) {
        let pointX = x + Math.random() * width;
        let pointY = y + Math.random() * height;
        return { x: pointX, y: pointY };
      }

      function init() {
        particles = [];
        snowflakes = [];

        const centerX = canvas.width / 2;
        const treeHeight = canvas.height * 0.7;
        const treeBottom = canvas.height * 0.9;

        const layer1 = {
          p1: { x: centerX, y: treeBottom - treeHeight },
          p2: { x: centerX - 60, y: treeBottom - treeHeight * 0.6 },
          p3: { x: centerX + 60, y: treeBottom - treeHeight * 0.6 },
        };
        const layer2 = {
          p1: { x: centerX, y: treeBottom - treeHeight * 0.8 },
          p2: { x: centerX - 120, y: treeBottom - treeHeight * 0.3 },
          p3: { x: centerX + 120, y: treeBottom - treeHeight * 0.3 },
        };
        const layer3 = {
          p1: { x: centerX, y: treeBottom - treeHeight * 0.5 },
          p2: { x: centerX - 180, y: treeBottom },
          p3: { x: centerX + 180, y: treeBottom },
        };

        const trunkWidth = 50;
        const trunkHeight = 60;
        const trunk = {
          x: centerX - trunkWidth / 2,
          y: treeBottom,
          width: trunkWidth,
          height: trunkHeight,
        };

        const starCenter = { x: centerX, y: treeBottom - treeHeight - 20 };

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          let r = Math.random();
          let point;
          let color;

          if (r < 0.2) {
            point = getPointInTriangle(layer1.p1, layer1.p2, layer1.p3);
          } else if (r < 0.5) {
            point = getPointInTriangle(layer2.p1, layer2.p2, layer2.p3);
          } else if (r < 0.9) {
            point = getPointInTriangle(layer3.p1, layer3.p2, layer3.p3);
          } else {
            point = getPointInRectangle(
              trunk.x,
              trunk.y,
              trunk.width,
              trunk.height
            );
          }

          color = TREE_COLORS[Math.floor(Math.random() * TREE_COLORS.length)];
          particles.push(new Particle(point.x, point.y, color));
        }

        for (let i = 0; i < 50; i++) {
          let angle = Math.random() * Math.PI * 2;
          let radius = Math.random() * 25;
          let x = starCenter.x + Math.cos(angle) * radius;
          let y = starCenter.y + Math.sin(angle) * radius;
          particles.push(new Particle(x, y, STAR_COLOR, true));
        }

        for (let i = 0; i < SNOWFLAKE_COUNT; i++) {
          snowflakes.push(new Snowflake());
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const flake of snowflakes) {
          flake.update();
          flake.draw();
        }

        for (const particle of particles) {
          particle.update();
          particle.draw();
        }

        requestAnimationFrame(animate);
      }

      init();
      animate();
    </script>
  </body>
</html>
