<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>波纹涟漪轮播图</title>
    <style>
      /*css样式*/
      :root {
        --image-width: 60%;
        --image-height: 60%;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        background: #080818;
      }

      .container {
        width: var(--image-width);
        height: var(--image-height);
      }

      .carousel-container {
        position: relative;
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 10px 40px -5px rgba(0, 100, 200, 0.2);
      }

      .carousel {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      /* 控制按钮 */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(100, 180, 255, 0.2);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .nav-btn:hover {
        background: rgba(40, 100, 200, 0.2);
        border-color: rgba(100, 180, 255, 0.5);
        box-shadow: 0 0 20px rgba(60, 140, 255, 0.2);
      }

      .nav-btn.prev { left: 16px; }
      .nav-btn.next { right: 16px; }

      /* 指示器 */
      .indicators {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
      }

      .indicator.active {
        background: rgba(100, 180, 255, 0.9);
        box-shadow: 0 0 8px rgba(60, 140, 255, 0.5);
        width: 24px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="carousel-container">
        <div class="carousel" id="carousel">
          <canvas id="canvas"></canvas>
        </div>
        <button class="nav-btn prev" id="prevBtn">◂</button>
        <button class="nav-btn next" id="nextBtn">▸</button>
        <div class="indicators" id="indicators"></div>
      </div>
    </div>

    <script>
      //js逻辑
      const images = [
        {
          src: "http://5b0988e595225.cdn.sohucs.com/images/20180130/24aecf0d680546ccbf6480badce389dc.jpeg",
          alt: "千与千寻",
        },
        {
          src: "https://pic3.zhimg.com/v2-f1159536dc58af663e3955e774a7a13a_r.jpg",
          alt: "龙猫",
        },
        {
          src: "http://qqpublic.qpic.cn/qq_public_cover/0/0-2083471255-1DB77954D274653D98B57D000A686040_vsmcut/0",
          alt: "天空之城",
        },
        {
          src: "http://5b0988e595225.cdn.sohucs.com/images/20180824/781646fe72fc4788b7dfc24c112b5bbb.png",
          alt: "悬崖上的金鱼姬",
        },
        {
          src: "http://p6.itc.cn/q_70/images03/20210106/6cd651a28f9a46268205410dcc5cad4d.jpeg",
          alt: "魔女宅急便",
        },
        {
          src: "https://x0.ifengimg.com/ucms/2024_13/88635184EFC2FFE43710A5DF199B7067DF336C0F_size489_w1000_h1423.jpg",
          alt: "你想活出怎样的人生",
        },
      ];

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const indicatorsEl = document.getElementById("indicators");

      let currentIndex = 0;
      let isTransitioning = false;
      let autoPlayTimer = null;
      let animationFrame = null;
      const loadedImages = [];

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        if (!isTransitioning && loadedImages[currentIndex]) {
          drawImageCover(loadedImages[currentIndex]);
        }
      }

      function drawImageCover(img, targetCtx, targetCanvas) {
        const c = targetCtx || ctx;
        const cvs = targetCanvas || canvas;
        const cw = cvs.width / devicePixelRatio;
        const ch = cvs.height / devicePixelRatio;
        const imgW = img.naturalWidth || img.width;
        const imgH = img.naturalHeight || img.height;
        const imgRatio = imgW / imgH;
        const canvasRatio = cw / ch;
        let sx, sy, sw, sh;

        if (imgRatio > canvasRatio) {
          sh = imgH;
          sw = sh * canvasRatio;
          sx = (imgW - sw) / 2;
          sy = 0;
        } else {
          sw = imgW;
          sh = sw / canvasRatio;
          sx = 0;
          sy = (imgH - sh) / 2;
        }

        c.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      }

      // 以 cover 模式绘制到指定尺寸（不受 DPR 影响，用于离屏 canvas）
      function drawCoverRaw(img, targetCtx, w, h) {
        const imgW = img.naturalWidth || img.width;
        const imgH = img.naturalHeight || img.height;
        const imgRatio = imgW / imgH;
        const canvasRatio = w / h;
        let sx, sy, sw, sh;
        if (imgRatio > canvasRatio) {
          sh = imgH; sw = sh * canvasRatio;
          sx = (imgW - sw) / 2; sy = 0;
        } else {
          sw = imgW; sh = sw / canvasRatio;
          sx = 0; sy = (imgH - sh) / 2;
        }
        targetCtx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      }

      // 波纹涟漪过渡效果
      function rippleTransition(fromImg, toImg, callback) {
        const cw = canvas.width / devicePixelRatio;
        const ch = canvas.height / devicePixelRatio;
        // 像素操作的工作尺寸（取整避免浮点误差）
        const pw = Math.floor(cw);
        const ph = Math.floor(ch);

        // 波纹中心 - 随机偏移，避免太边缘
        const cx = pw * (0.3 + Math.random() * 0.4);
        const cy = ph * (0.3 + Math.random() * 0.4);
        const maxDist = Math.sqrt(
          Math.max(cx, pw - cx) ** 2 + Math.max(cy, ph - cy) ** 2
        );

        // 离屏 canvas 以逻辑像素尺寸渲染（不带 DPR）
        const fromCanvas = document.createElement("canvas");
        fromCanvas.width = pw;
        fromCanvas.height = ph;
        const fromCtx = fromCanvas.getContext("2d");
        drawCoverRaw(fromImg, fromCtx, pw, ph);
        const fromData = fromCtx.getImageData(0, 0, pw, ph);

        const toCanvas = document.createElement("canvas");
        toCanvas.width = pw;
        toCanvas.height = ph;
        const toCtx = toCanvas.getContext("2d");
        drawCoverRaw(toImg, toCtx, pw, ph);
        const toData = toCtx.getImageData(0, 0, pw, ph);

        // 输出用离屏 canvas（避免 putImageData 无视 transform 的问题）
        const outputCanvas = document.createElement("canvas");
        outputCanvas.width = pw;
        outputCanvas.height = ph;
        const outputCtx = outputCanvas.getContext("2d");
        const outputData = outputCtx.createImageData(pw, ph);

        const duration = 2200;
        const startTime = performance.now();

        // 波纹参数
        const waveCount = 3;         // 同时存在的波纹数
        const waveWidth = 60;        // 每个波纹的宽度
        const waveAmplitude = 20;    // 位移幅度
        // 采样步长
        const step = 2;

        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);

          // easeInOutCubic
          const eased = progress < 0.5
            ? 4 * progress * progress * progress
            : 1 - Math.pow(-2 * progress + 2, 3) / 2;

          // 波纹前沿距离
          const waveFront = eased * (maxDist + waveWidth * waveCount);

          const out = outputData.data;

          for (let y = 0; y < ph; y += step) {
            for (let x = 0; x < pw; x += step) {
              const dx = x - cx;
              const dy = y - cy;
              const dist = Math.sqrt(dx * dx + dy * dy);

              // 该点到波纹前沿的距离
              const relDist = waveFront - dist;

              let srcX = x;
              let srcY = y;
              let useNewImage = false;

              if (relDist > waveWidth * waveCount) {
                // 波纹已完全经过 → 显示新图（无位移）
                useNewImage = true;
              } else if (relDist > 0) {
                // 在波纹影响区域内
                const wavePhase = (relDist / waveWidth) * Math.PI * 2;
                const amplitude = waveAmplitude * Math.sin(wavePhase)
                  * Math.exp(-relDist / (waveWidth * waveCount) * 2);

                // 径向位移
                const angle = Math.atan2(dy, dx);
                srcX = x + Math.cos(angle) * amplitude;
                srcY = y + Math.sin(angle) * amplitude;

                // 波纹内圈显示新图
                useNewImage = relDist > waveWidth;
              }

              // 边界钳制
              srcX = Math.max(0, Math.min(pw - 1, Math.round(srcX)));
              srcY = Math.max(0, Math.min(ph - 1, Math.round(srcY)));

              const srcIdx = (srcY * pw + srcX) * 4;
              const srcData = useNewImage ? toData : fromData;

              // 填充 step x step 区域
              for (let dy2 = 0; dy2 < step && y + dy2 < ph; dy2++) {
                for (let dx2 = 0; dx2 < step && x + dx2 < pw; dx2++) {
                  const outIdx = ((y + dy2) * pw + (x + dx2)) * 4;
                  out[outIdx] = srcData.data[srcIdx];
                  out[outIdx + 1] = srcData.data[srcIdx + 1];
                  out[outIdx + 2] = srcData.data[srcIdx + 2];
                  out[outIdx + 3] = 255;
                }
              }
            }
          }

          // 写入离屏 canvas，再通过 drawImage 绘制到主 canvas（正确处理 DPR）
          outputCtx.putImageData(outputData, 0, 0);
          ctx.clearRect(0, 0, cw, ch);
          ctx.drawImage(outputCanvas, 0, 0, cw, ch);

          // 绘制波纹高光线
          if (progress > 0.02 && progress < 0.95) {
            ctx.save();
            ctx.globalAlpha = 0.25 * (1 - Math.abs(progress - 0.4));

            for (let w = 0; w < waveCount; w++) {
              const ringDist = waveFront - w * waveWidth;
              if (ringDist > 0 && ringDist < maxDist) {
                ctx.beginPath();
                ctx.arc(cx, cy, ringDist, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(150, 200, 255, ${0.3 - w * 0.1})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
              }
            }

            ctx.restore();
          }

          if (progress < 1) {
            animationFrame = requestAnimationFrame(animate);
          } else {
            ctx.clearRect(0, 0, cw, ch);
            drawImageCover(toImg);
            callback();
          }
        }

        animationFrame = requestAnimationFrame(animate);
      }

      function goTo(targetIndex) {
        if (isTransitioning || targetIndex === currentIndex) return;
        isTransitioning = true;

        const dots = indicatorsEl.querySelectorAll(".indicator");
        dots[currentIndex].classList.remove("active");
        dots[targetIndex].classList.add("active");

        rippleTransition(loadedImages[currentIndex], loadedImages[targetIndex], () => {
          currentIndex = targetIndex;
          isTransitioning = false;
        });
      }

      function next() {
        goTo((currentIndex + 1) % images.length);
      }

      function prev() {
        goTo((currentIndex - 1 + images.length) % images.length);
      }

      function startAutoPlay() {
        stopAutoPlay();
        autoPlayTimer = setInterval(next, 4500);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) {
          clearInterval(autoPlayTimer);
          autoPlayTimer = null;
        }
      }

      function preloadImages() {
        let loaded = 0;
        return new Promise((resolve) => {
          images.forEach((imgData, index) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
              loadedImages[index] = img;
              loaded++;
              if (loaded === images.length) resolve();
            };
            img.onerror = () => {
              const placeholder = document.createElement("canvas");
              placeholder.width = 1920;
              placeholder.height = 1080;
              const pCtx = placeholder.getContext("2d");
              const gradient = pCtx.createLinearGradient(0, 0, 1920, 1080);
              gradient.addColorStop(0, `hsl(${200 + index * 20}, 60%, 20%)`);
              gradient.addColorStop(1, `hsl(${200 + index * 20}, 60%, 10%)`);
              pCtx.fillStyle = gradient;
              pCtx.fillRect(0, 0, 1920, 1080);
              pCtx.fillStyle = "#fff";
              pCtx.font = "48px sans-serif";
              pCtx.textAlign = "center";
              pCtx.fillText(imgData.alt, 960, 540);
              loadedImages[index] = placeholder;
              loaded++;
              if (loaded === images.length) resolve();
            };
            img.src = imgData.src;
          });
        });
      }

      async function init() {
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        images.forEach((_, index) => {
          const dot = document.createElement("button");
          dot.className = `indicator ${index === 0 ? "active" : ""}`;
          dot.addEventListener("click", () => goTo(index));
          indicatorsEl.appendChild(dot);
        });

        await preloadImages();
        drawImageCover(loadedImages[0]);
        startAutoPlay();
      }

      document.getElementById("prevBtn").addEventListener("click", () => {
        prev();
        startAutoPlay();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        next();
        startAutoPlay();
      });

      document.querySelector(".carousel-container").addEventListener("mouseenter", stopAutoPlay);
      document.querySelector(".carousel-container").addEventListener("mouseleave", startAutoPlay);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") { prev(); startAutoPlay(); }
        if (e.key === "ArrowRight") { next(); startAutoPlay(); }
      });

      document.addEventListener("visibilitychange", () => {
        document.hidden ? stopAutoPlay() : startAutoPlay();
      });

      init();
    </script>
  </body>
</html>
