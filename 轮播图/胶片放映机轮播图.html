<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>胶片放映机轮播图</title>
    <style>
      :root {
        --paper: #f8edd8;
        --ink: #2d2118;
        --brown: #6d3f24;
        --amber: #f2b45b;
        --shadow: rgba(49, 30, 17, 0.36);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Georgia, "Songti SC", "SimSun", serif;
        background:
          linear-gradient(rgba(58, 35, 18, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(58, 35, 18, 0.06) 1px, transparent 1px),
          radial-gradient(circle at 20% 10%, #fff2c7, transparent 30%),
          #d5a66d;
        background-size: 28px 28px, 28px 28px, auto;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          radial-gradient(circle at 20% 30%, rgba(82, 48, 24, 0.16) 0 1px, transparent 1.7px),
          radial-gradient(circle at 70% 60%, rgba(82, 48, 24, 0.12) 0 1px, transparent 1.8px);
        background-size: 11px 17px, 19px 13px;
        mix-blend-mode: multiply;
      }

      .cinema {
        position: relative;
        width: min(1040px, calc(100vw - 32px));
        display: grid;
        place-items: center;
      }

      .viewer {
        position: relative;
        width: min(88vw, 920px);
      }

      .screen {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        border: 12px solid #2b1c13;
        border-radius: 8px;
        overflow: hidden;
        background: #120d0a;
        box-shadow:
          0 30px 60px var(--shadow),
          inset 0 0 0 1px rgba(255, 245, 204, 0.2);
      }

      .screen::before,
      .screen::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      .screen::before {
        opacity: 0.2;
        background-image:
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          radial-gradient(circle, rgba(255, 245, 217, 0.9) 0 1px, transparent 1.4px);
        background-size: 3px 100%, 19px 17px;
        mix-blend-mode: screen;
        animation: flicker 0.24s steps(2, end) infinite;
      }

      .screen::after {
        background: radial-gradient(circle at 50% 44%, transparent 44%, rgba(31, 14, 5, 0.45));
      }

      @keyframes flicker {
        50% {
          opacity: 0.32;
        }
      }

      .frame {
        position: absolute;
        inset: 0;
        background-image: var(--image);
        background-size: cover;
        background-position: center;
        filter: sepia(0.22) contrast(1.08) saturate(0.9);
        transform: translateY(0);
      }

      .screen.running .frame {
        animation: filmPull 760ms cubic-bezier(0.3, 0.82, 0.34, 1);
      }

      @keyframes filmPull {
        0% {
          transform: translateY(-110%) rotate(-1.5deg);
          filter: sepia(0.5) contrast(1.4) blur(3px);
        }
        54% {
          transform: translateY(8%) rotate(0.8deg);
        }
        72% {
          transform: translateY(-4%);
        }
        100% {
          transform: translateY(0);
          filter: sepia(0.22) contrast(1.08) saturate(0.9);
        }
      }

      .film-strip {
        position: absolute;
        left: 14px;
        top: 0;
        bottom: 0;
        width: 82px;
        z-index: 5;
        background:
          repeating-linear-gradient(
            0deg,
            transparent 0 10px,
            rgba(255, 198, 93, 0.28) 10px 22px,
            transparent 22px 54px
          ),
          rgba(13, 9, 7, 0.68);
        background-size: 100% 54px, auto;
        box-shadow: 6px 0 18px rgba(0, 0, 0, 0.18);
        opacity: 0.62;
        animation: filmRoll 0.9s linear infinite;
      }

      .film-strip::before,
      .film-strip::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 12px;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.52) 0 10px,
            transparent 10px 27px
          );
        background-size: 100% 54px;
        border-radius: 999px;
        animation: filmRoll 0.9s linear infinite;
      }

      .film-strip::before {
        left: 9px;
      }

      .film-strip::after {
        right: 9px;
      }

      @keyframes filmRoll {
        to {
          background-position-y: 54px;
        }
      }

      button {
        width: 54px;
        height: 54px;
        border: 1px solid rgba(255, 245, 204, 0.28);
        border-radius: 50%;
        color: #fff7df;
        cursor: pointer;
        font: inherit;
        font-size: 30px;
        line-height: 1;
        background: rgba(42, 26, 17, 0.62);
        backdrop-filter: blur(8px);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      button:hover {
        background: rgba(88, 51, 20, 0.78);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.34);
      }

      .nav-btn {
        position: absolute;
        top: 50%;
        z-index: 8;
        transform: translateY(-50%);
      }

      .nav-btn:hover {
        transform: translateY(-50%) scale(1.04);
      }

      .nav-btn.prev {
        left: clamp(12px, 2.5vw, 26px);
      }

      .nav-btn.next {
        right: clamp(12px, 2.5vw, 26px);
      }

      .dots {
        position: absolute;
        left: 50%;
        bottom: 18px;
        z-index: 8;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        transform: translateX(-50%);
      }

      .dot {
        width: 12px;
        height: 12px;
        min-width: 0;
        padding: 0;
        border-radius: 999px;
        border: 0;
        background: rgba(255, 245, 204, 0.38);
        box-shadow: none;
      }

      .dot.active {
        width: 40px;
        background: #f2b45b;
      }

      @media (max-width: 920px) {
        body {
          overflow: auto;
        }

        .cinema {
          padding: 22px 0;
        }

        .viewer {
          width: min(94vw, 680px);
        }

        .screen {
          border-width: 8px;
        }

        button {
          width: 46px;
          height: 46px;
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main class="cinema" aria-label="胶片放映机轮播图">
      <section class="viewer">
        <div class="screen" id="screen">
          <div class="frame" id="frame"></div>
          <div class="film-strip" aria-hidden="true"></div>
        </div>
        <button type="button" class="nav-btn prev" id="prev" aria-label="上一张">‹</button>
        <button type="button" class="nav-btn next" id="next" aria-label="下一张">›</button>
        <div class="dots" id="dots" aria-label="轮播指示器"></div>
      </section>
    </main>

    <script>
      const slides = [
        {
          src: "../images/宫崎骏/红猪.jpg",
        },
        {
          src: "../images/宫崎骏/起风了.jpg",
        },
        {
          src: "../images/宫崎骏/哈尔的移动城堡.jpg",
        },
        {
          src: "../images/宫崎骏/风之谷.jpg",
        },
      ];

      const frame = document.getElementById("frame");
      const screen = document.getElementById("screen");
      const dots = document.getElementById("dots");
      let index = 0;
      let timer = 0;
      let runningTimer = 0;

      function buildDots() {
        slides.forEach((_, dotIndex) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "dot";
          dot.setAttribute("aria-label", `切换到第 ${dotIndex + 1} 张`);
          dot.addEventListener("click", () => show(dotIndex));
          dots.appendChild(dot);
        });
      }

      function show(nextIndex) {
        index = (nextIndex + slides.length) % slides.length;
        const slide = slides[index];
        screen.classList.remove("running");
        void screen.offsetWidth;
        screen.classList.add("running");
        window.clearTimeout(runningTimer);
        runningTimer = window.setTimeout(() => {
          screen.classList.remove("running");
        }, 820);
        frame.style.setProperty("--image", `url("${slide.src}")`);
        [...dots.children].forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === index);
        });
        restart();
      }

      function restart() {
        window.clearInterval(timer);
        timer = window.setInterval(() => show(index + 1), 4200);
      }

      document.getElementById("prev").addEventListener("click", () => show(index - 1));
      document.getElementById("next").addEventListener("click", () => show(index + 1));
      screen.addEventListener("pointerenter", () => window.clearInterval(timer));
      screen.addEventListener("pointerleave", restart);

      buildDots();
      show(0);
    </script>
  </body>
</html>
