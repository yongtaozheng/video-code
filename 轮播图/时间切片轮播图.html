<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时间切片轮播图</title>
    <style>
      /*css样式*/
      :root {
        --image-width: 60%;
        --image-height: 60%;
        --slice-count: 12;
        --transition-duration: 1.2s;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      .container {
        width: var(--image-width);
        height: var(--image-height);
      }

      .carousel-container {
        position: relative;
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 10px 40px -5px rgba(0, 0, 0, 0.5);
      }

      .carousel {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
      }

      /* 切片层 - 当前图片被分割成水平条 */
      .slice-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .slice {
        position: absolute;
        left: 0;
        width: 100%;
        overflow: hidden;
        will-change: transform, opacity;
      }

      .slice img {
        position: absolute;
        left: 0;
        width: 100%;
        object-fit: cover;
      }

      /* 底层（新图片）*/
      .base-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
      }

      .base-layer img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 扫描线效果 */
      .scanline {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .scanline.active {
        opacity: 1;
      }

      .scanline::before {
        content: "";
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg,
          transparent 0%,
          rgba(0, 255, 255, 0.6) 20%,
          rgba(255, 255, 255, 0.9) 50%,
          rgba(0, 255, 255, 0.6) 80%,
          transparent 100%
        );
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), 0 0 30px rgba(0, 255, 255, 0.2);
        animation: scanMove linear forwards;
        animation-duration: var(--transition-duration);
      }

      @keyframes scanMove {
        from { top: 0; }
        to { top: 100%; }
      }

      /* 控制按钮 */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .nav-btn:hover {
        background: rgba(0, 0, 0, 0.55);
        border-color: rgba(0, 255, 255, 0.4);
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
      }

      .nav-btn.prev { left: 16px; }
      .nav-btn.next { right: 16px; }

      /* 指示器 */
      .indicators {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
      }

      .indicator.active {
        background: rgba(0, 255, 255, 0.9);
        box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        width: 24px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="carousel-container">
        <div class="carousel" id="carousel">
          <div class="base-layer" id="baseLayer">
            <img id="baseImage" />
          </div>
          <div class="slice-layer" id="sliceLayer"></div>
          <div class="scanline" id="scanline"></div>
        </div>
        <button class="nav-btn prev" id="prevBtn">◂</button>
        <button class="nav-btn next" id="nextBtn">▸</button>
        <div class="indicators" id="indicators"></div>
      </div>
    </div>

    <script>
      //js逻辑
      const images = [
        {
          src: "http://5b0988e595225.cdn.sohucs.com/images/20180130/24aecf0d680546ccbf6480badce389dc.jpeg",
          alt: "千与千寻",
        },
        {
          src: "https://pic3.zhimg.com/v2-f1159536dc58af663e3955e774a7a13a_r.jpg",
          alt: "龙猫",
        },
        {
          src: "http://qqpublic.qpic.cn/qq_public_cover/0/0-2083471255-1DB77954D274653D98B57D000A686040_vsmcut/0",
          alt: "天空之城",
        },
        {
          src: "http://5b0988e595225.cdn.sohucs.com/images/20180824/781646fe72fc4788b7dfc24c112b5bbb.png",
          alt: "悬崖上的金鱼姬",
        },
        {
          src: "http://p6.itc.cn/q_70/images03/20210106/6cd651a28f9a46268205410dcc5cad4d.jpeg",
          alt: "魔女宅急便",
        },
        {
          src: "https://x0.ifengimg.com/ucms/2024_13/88635184EFC2FFE43710A5DF199B7067DF336C0F_size489_w1000_h1423.jpg",
          alt: "你想活出怎样的人生",
        },
      ];

      const SLICE_COUNT = 12;
      let currentIndex = 0;
      let isTransitioning = false;
      let autoPlayTimer = null;

      const sliceLayer = document.getElementById("sliceLayer");
      const baseImage = document.getElementById("baseImage");
      const scanline = document.getElementById("scanline");
      const indicatorsEl = document.getElementById("indicators");

      function init() {
        // 设置初始图片
        baseImage.src = images[0].src;
        baseImage.alt = images[0].alt;

        // 创建指示器
        images.forEach((_, index) => {
          const dot = document.createElement("button");
          dot.className = `indicator ${index === 0 ? "active" : ""}`;
          dot.addEventListener("click", () => goTo(index));
          indicatorsEl.appendChild(dot);
        });

        startAutoPlay();
      }

      // 创建切片
      function createSlices(imageSrc, containerHeight) {
        sliceLayer.innerHTML = "";
        const sliceHeight = containerHeight / SLICE_COUNT;

        for (let i = 0; i < SLICE_COUNT; i++) {
          const slice = document.createElement("div");
          slice.className = "slice";
          slice.style.top = `${i * sliceHeight}px`;
          slice.style.height = `${sliceHeight + 1}px`; // +1 避免缝隙

          const img = document.createElement("img");
          img.src = imageSrc;
          img.style.top = `-${i * sliceHeight}px`;
          img.style.height = `${containerHeight}px`;

          slice.appendChild(img);
          sliceLayer.appendChild(slice);
        }
      }

      // 时间切片过渡效果
      function timeSliceTransition(direction, callback) {
        const carousel = document.getElementById("carousel");
        const containerHeight = carousel.offsetHeight;

        // 1. 用切片重建当前图片
        createSlices(images[currentIndex].src, containerHeight);

        // 2. 显示扫描线
        scanline.classList.add("active");

        // 3. 逐条切片飞出 - 扫描线经过后才开始
        const slices = sliceLayer.querySelectorAll(".slice");
        const totalDuration = 1200;
        const staggerDelay = totalDuration / (SLICE_COUNT * 1.5);

        slices.forEach((slice, i) => {
          const delay = i * staggerDelay;

          // 根据方向决定飞出方向 - 奇偶交替
          const xDirection = (i % 2 === 0 ? 1 : -1) * (direction === "next" ? 1 : -1);
          const translateX = xDirection * (120 + Math.random() * 80);
          const rotation = xDirection * (5 + Math.random() * 15);
          const skewX = xDirection * (3 + Math.random() * 7);

          setTimeout(() => {
            slice.style.transition = `transform 0.6s cubic-bezier(0.55, 0.06, 0.68, 0.19), opacity 0.5s ease-out`;
            slice.style.transform = `translateX(${translateX}%) rotate(${rotation}deg) skewX(${skewX}deg)`;
            slice.style.opacity = "0";
          }, delay);
        });

        // 4. 动画结束后清理
        setTimeout(() => {
          sliceLayer.innerHTML = "";
          scanline.classList.remove("active");
          callback();
        }, totalDuration + 200);
      }

      function goTo(targetIndex) {
        if (isTransitioning || targetIndex === currentIndex) return;
        isTransitioning = true;

        const direction = targetIndex > currentIndex ? "next" : "prev";

        // 更新指示器
        const dots = indicatorsEl.querySelectorAll(".indicator");
        dots[currentIndex].classList.remove("active");
        dots[targetIndex].classList.add("active");

        // 先把底层设置为新图
        baseImage.src = images[targetIndex].src;
        baseImage.alt = images[targetIndex].alt;

        // 执行时间切片过渡
        timeSliceTransition(direction, () => {
          currentIndex = targetIndex;
          isTransitioning = false;
        });
      }

      function next() {
        goTo((currentIndex + 1) % images.length);
      }

      function prev() {
        goTo((currentIndex - 1 + images.length) % images.length);
      }

      function startAutoPlay() {
        stopAutoPlay();
        autoPlayTimer = setInterval(next, 4500);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) clearInterval(autoPlayTimer);
      }

      // 事件绑定
      document.getElementById("prevBtn").addEventListener("click", () => {
        prev();
        startAutoPlay();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        next();
        startAutoPlay();
      });

      document.querySelector(".carousel-container").addEventListener("mouseenter", stopAutoPlay);
      document.querySelector(".carousel-container").addEventListener("mouseleave", startAutoPlay);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") { prev(); startAutoPlay(); }
        if (e.key === "ArrowRight") { next(); startAutoPlay(); }
      });

      document.addEventListener("visibilitychange", () => {
        document.hidden ? stopAutoPlay() : startAutoPlay();
      });

      init();
    </script>
  </body>
</html>
