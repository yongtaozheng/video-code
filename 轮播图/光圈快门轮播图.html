<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>光圈快门轮播图</title>
    <style>
      :root {
        --bg: #111417;
        --panel: #e9e5d8;
        --ink: #f4f1e8;
        --dark-ink: #1f2528;
        --accent: #ffcb47;
        --green: #5dd39e;
      }

      @property --blade-sweep {
        syntax: "<angle>";
        inherits: true;
        initial-value: 4deg;
      }

      @property --blade-twist {
        syntax: "<angle>";
        inherits: true;
        initial-value: -28deg;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--ink);
        font-family: Optima, "PingFang SC", "Microsoft YaHei", sans-serif;
        background:
          linear-gradient(120deg, rgba(255, 203, 71, 0.08), transparent 36%),
          radial-gradient(circle at 80% 18%, rgba(93, 211, 158, 0.15), transparent 30%),
          #111417;
      }

      .camera {
        width: min(860px, calc(100vw - 32px));
        display: grid;
        place-items: center;
      }

      button {
        width: 54px;
        height: 54px;
        border: 1px solid rgba(255, 203, 71, 0.24);
        border-radius: 50%;
        color: #fff4d4;
        cursor: pointer;
        font: inherit;
        font-size: 30px;
        line-height: 1;
        background: rgba(13, 17, 20, 0.62);
        backdrop-filter: blur(8px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.32);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      button:hover {
        background: rgba(20, 25, 28, 0.86);
        border-color: rgba(255, 203, 71, 0.56);
      }

      .lens-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: min(78vw, 620px);
        min-height: auto;
      }

      .lens {
        position: relative;
        z-index: 2;
        --aperture: 100%;
        --blade-opacity: 0;
        --blade-sweep: 4deg;
        --blade-twist: -28deg;
        --blade-edge: rgba(255, 203, 71, 0.18);
        width: min(78vw, 620px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background:
          radial-gradient(circle at 46% 42%, rgba(255, 255, 255, 0.14) 0 4%, transparent 5%),
          radial-gradient(circle, #0b0f12 0 45%, #20282d 46% 58%, #0d1114 59% 64%, #30383c 65% 72%, #101417 73%);
        box-shadow:
          0 0 0 14px #15191c,
          0 0 0 28px #33393d,
          0 28px 70px rgba(0, 0, 0, 0.46),
          inset 0 0 34px rgba(255, 255, 255, 0.04);
        overflow: hidden;
      }

      .lens.closing,
      .lens.closed {
        --aperture: 0%;
        --blade-opacity: 1;
        --blade-sweep: 54deg;
        --blade-twist: 0deg;
        --blade-edge: rgba(255, 203, 71, 0.34);
      }

      .lens.opening {
        --aperture: 100%;
        --blade-opacity: 1;
        --blade-sweep: 4deg;
        --blade-twist: -28deg;
        --blade-edge: rgba(255, 203, 71, 0.24);
      }

      .photo {
        position: absolute;
        inset: 15%;
        z-index: 1;
        border-radius: 50%;
        overflow: hidden;
        background-image: var(--image);
        background-size: cover;
        background-position: center;
        clip-path: none;
        transform: scale(1.02);
        transition:
          clip-path 760ms cubic-bezier(0.2, 0.82, 0.2, 1),
          transform 900ms cubic-bezier(0.19, 1, 0.22, 1),
          filter 900ms ease;
      }

      .lens.closing .photo,
      .lens.closed .photo {
        clip-path: circle(var(--aperture) at 50% 50%);
        transform: scale(1.15) rotate(1.2deg);
        filter: blur(2px) brightness(1.18);
      }

      .aperture-shadow {
        position: absolute;
        inset: 15%;
        z-index: 3;
        border-radius: 50%;
        pointer-events: none;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.12),
          inset 0 0 36px rgba(0, 0, 0, 0.58),
          0 0 0 999px rgba(5, 8, 10, 0.1);
        opacity: var(--blade-opacity);
        clip-path: circle(var(--aperture) at 50% 50%);
        transition:
          clip-path 760ms cubic-bezier(0.2, 0.82, 0.2, 1),
          opacity 240ms ease;
      }

      .blade {
        position: absolute;
        inset: 15%;
        z-index: 3;
        border-radius: 50%;
        background:
          conic-gradient(
            from calc(var(--i) * 51.428deg + var(--blade-twist)),
            transparent 0deg,
            var(--blade-edge) 0.8deg,
            #4c5d64 2.4deg,
            #243137 calc(var(--blade-sweep) - 8deg),
            #080c0f var(--blade-sweep),
            transparent var(--blade-sweep),
            transparent 360deg
          );
        transform-origin: 50% 50%;
        transform:
          rotate(0deg);
        opacity: var(--blade-opacity);
        clip-path: circle(50% at 50% 50%);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          inset 0 0 28px rgba(0, 0, 0, 0.48);
        will-change: transform, opacity;
        transition:
          --blade-sweep 780ms cubic-bezier(0.2, 0.82, 0.2, 1),
          --blade-twist 780ms cubic-bezier(0.2, 0.82, 0.2, 1),
          opacity 240ms ease;
      }

      .ring-mark {
        position: absolute;
        inset: 7%;
        z-index: 5;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 255, 0.22);
        animation: roll 10s linear infinite;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      @keyframes roll {
        to {
          transform: rotate(1turn);
        }
      }

      .focus {
        position: absolute;
        inset: 23%;
        z-index: 5;
        border-radius: 50%;
        border: 2px solid rgba(255, 203, 71, 0.78);
        box-shadow: 0 0 36px rgba(255, 203, 71, 0.24);
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .lens.closing .ring-mark,
      .lens.closed .ring-mark,
      .lens.opening .ring-mark {
        opacity: 0.12;
      }

      .lens.closing .focus,
      .lens.closed .focus,
      .lens.opening .focus {
        opacity: 0.1;
      }

      .dots {
        position: absolute;
        bottom: clamp(22px, 5vw, 42px);
        left: 50%;
        z-index: 8;
        display: flex;
        gap: 8px;
        transform: translateX(-50%);
      }

      .dot {
        width: 12px;
        height: 12px;
        min-width: 0;
        padding: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
      }

      .dot.active {
        width: 38px;
        border-radius: 999px;
        background: var(--accent);
      }

      .nav-btn {
        position: absolute;
        top: 50%;
        z-index: 8;
        transform: translateY(-50%);
      }

      .nav-btn:hover {
        transform: translateY(-50%) scale(1.04);
      }

      .nav-btn.prev {
        left: clamp(12px, 3vw, 28px);
      }

      .nav-btn.next {
        right: clamp(12px, 3vw, 28px);
      }

      @media (max-width: 900px) {
        body {
          overflow: auto;
        }

        .camera {
          padding: 22px 0;
        }

        .lens-wrap {
          width: min(92vw, 520px);
        }

        .lens {
          width: min(92vw, 520px);
        }

        button {
          width: 46px;
          height: 46px;
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <main class="camera" aria-label="光圈快门轮播图">
      <section class="lens-wrap">
        <div class="lens" id="lens">
          <div class="photo" id="photo"></div>
          <span class="aperture-shadow"></span>
          <span class="blade" style="--i: 0"></span>
          <span class="blade" style="--i: 1"></span>
          <span class="blade" style="--i: 2"></span>
          <span class="blade" style="--i: 3"></span>
          <span class="blade" style="--i: 4"></span>
          <span class="blade" style="--i: 5"></span>
          <span class="blade" style="--i: 6"></span>
          <span class="ring-mark"></span>
          <span class="focus"></span>
        </div>
        <button type="button" class="nav-btn prev" id="prev" aria-label="上一张">‹</button>
        <button type="button" class="nav-btn next" id="next" aria-label="下一张">›</button>
        <div class="dots" id="dots"></div>
      </section>
    </main>

    <script>
      const slides = [
        {
          src: "../images/火影忍者/鸣人.png",
        },
        {
          src: "../images/火影忍者/佐助.png",
        },
        {
          src: "../images/火影忍者/小樱.png",
        },
        {
          src: "../images/火影忍者/鹿丸.png",
        },
        {
          src: "../images/火影忍者/雏田.png",
        },
      ];

      const lens = document.getElementById("lens");
      const photo = document.getElementById("photo");
      const dots = document.getElementById("dots");
      let index = 0;
      let timer = 0;

      slides.forEach((_, dotIndex) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot";
        dot.setAttribute("aria-label", `切换到第 ${dotIndex + 1} 张`);
        dot.addEventListener("click", () => show(dotIndex));
        dots.appendChild(dot);
      });

      function renderSlide(slide) {
        photo.style.setProperty("--image", `url("${slide.src}")`);
        [...dots.children].forEach((dot, dotIndex) => {
          dot.classList.toggle("active", dotIndex === index);
        });
      }

      function show(nextIndex) {
        index = (nextIndex + slides.length) % slides.length;
        const slide = slides[index];
        if (!photo.style.getPropertyValue("--image")) {
          renderSlide(slide);
          restart();
          return;
        }
        lens.classList.remove("closing", "closed", "opening");
        lens.classList.add("closing");
        window.clearTimeout(lens._swap);
        window.clearTimeout(lens._open);
        window.clearTimeout(lens._done);
        lens._swap = window.setTimeout(() => {
          lens.classList.remove("closing");
          lens.classList.add("closed");
          renderSlide(slide);
        }, 780);
        lens._open = window.setTimeout(() => {
          lens.classList.remove("closed");
          lens.classList.add("opening");
        }, 980);
        lens._done = window.setTimeout(() => {
          lens.classList.remove("opening");
        }, 1760);
        restart();
      }

      function restart() {
        window.clearInterval(timer);
        timer = window.setInterval(() => show(index + 1), 3800);
      }

      document.getElementById("prev").addEventListener("click", () => show(index - 1));
      document.getElementById("next").addEventListener("click", () => show(index + 1));
      lens.addEventListener("pointerenter", () => window.clearInterval(timer));
      lens.addEventListener("pointerleave", restart);

      show(0);
    </script>
  </body>
</html>
