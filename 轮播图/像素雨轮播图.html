<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>像素雨轮播图</title>
    <style>
      :root {
        --image-width: 60%;
        --image-height: 60%;
      }

      body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        overflow: hidden;
        background: #0c0c14;
      }

      .container {
        width: var(--image-width);
        height: var(--image-height);
      }

      .carousel-container {
        position: relative;
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 10px 40px -5px rgba(0, 0, 0, 0.5);
      }

      .carousel {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(0, 200, 150, 0.2);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }

      .nav-btn:hover {
        background: rgba(0, 200, 150, 0.15);
        border-color: rgba(0, 200, 150, 0.5);
        box-shadow: 0 0 20px rgba(0, 200, 150, 0.2);
      }

      .nav-btn.prev {
        left: 16px;
      }
      .nav-btn.next {
        right: 16px;
      }

      .indicators {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
      }

      .indicator.active {
        background: rgba(0, 220, 160, 0.9);
        box-shadow: 0 0 8px rgba(0, 200, 150, 0.5);
        width: 24px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="carousel-container">
        <div class="carousel" id="carousel">
          <canvas id="canvas"></canvas>
        </div>
        <button class="nav-btn prev" id="prevBtn">◂</button>
        <button class="nav-btn next" id="nextBtn">▸</button>
        <div class="indicators" id="indicators"></div>
      </div>
    </div>

    <script>
      const images = [
        {
          src: "http://5b0988e595225.cdn.sohucs.com/images/20180130/24aecf0d680546ccbf6480badce389dc.jpeg",
          alt: "千与千寻",
        },
        {
          src: "https://pic3.zhimg.com/v2-f1159536dc58af663e3955e774a7a13a_r.jpg",
          alt: "龙猫",
        },
        {
          src: "http://qqpublic.qpic.cn/qq_public_cover/0/0-2083471255-1DB77954D274653D98B57D000A686040_vsmcut/0",
          alt: "天空之城",
        },
        {
          src: "http://5b0988e595225.cdn.sohucs.com/images/20180824/781646fe72fc4788b7dfc24c112b5bbb.png",
          alt: "悬崖上的金鱼姬",
        },
        {
          src: "http://p6.itc.cn/q_70/images03/20210106/6cd651a28f9a46268205410dcc5cad4d.jpeg",
          alt: "魔女宅急便",
        },
        {
          src: "https://x0.ifengimg.com/ucms/2024_13/88635184EFC2FFE43710A5DF199B7067DF336C0F_size489_w1000_h1423.jpg",
          alt: "你想活出怎样的人生",
        },
      ];

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const indicatorsEl = document.getElementById("indicators");

      let currentIndex = 0;
      let isTransitioning = false;
      let autoPlayTimer = null;
      let animationFrame = null;
      const loadedImages = [];

      const PIXEL_SIZE = 6;

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        if (!isTransitioning && loadedImages[currentIndex]) {
          drawImageCover(loadedImages[currentIndex]);
        }
      }

      function drawImageCover(img, targetCtx) {
        const c = targetCtx || ctx;
        const cw = canvas.width / devicePixelRatio;
        const ch = canvas.height / devicePixelRatio;
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const canvasRatio = cw / ch;
        let sx, sy, sw, sh;

        if (imgRatio > canvasRatio) {
          sh = img.naturalHeight;
          sw = sh * canvasRatio;
          sx = (img.naturalWidth - sw) / 2;
          sy = 0;
        } else {
          sw = img.naturalWidth;
          sh = sw / canvasRatio;
          sx = 0;
          sy = (img.naturalHeight - sh) / 2;
        }

        c.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      }

      function getImagePixels(img) {
        const cw = canvas.width / devicePixelRatio;
        const ch = canvas.height / devicePixelRatio;
        const offscreen = document.createElement("canvas");
        offscreen.width = cw;
        offscreen.height = ch;
        const offCtx = offscreen.getContext("2d");

        const imgRatio = img.naturalWidth / img.naturalHeight;
        const canvasRatio = cw / ch;
        let sx, sy, sw, sh;

        if (imgRatio > canvasRatio) {
          sh = img.naturalHeight;
          sw = sh * canvasRatio;
          sx = (img.naturalWidth - sw) / 2;
          sy = 0;
        } else {
          sw = img.naturalWidth;
          sh = sw / canvasRatio;
          sx = 0;
          sy = (img.naturalHeight - sh) / 2;
        }

        offCtx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
        return offCtx.getImageData(0, 0, cw, ch);
      }

      function pixelRainTransition(fromImg, toImg, callback) {
        const cw = canvas.width / devicePixelRatio;
        const ch = canvas.height / devicePixelRatio;
        const cols = Math.ceil(cw / PIXEL_SIZE);
        const rows = Math.ceil(ch / PIXEL_SIZE);

        const fromPixels = getImagePixels(fromImg);

        const columnConfigs = [];
        for (let col = 0; col < cols; col++) {
          const centerDist = Math.abs(col - cols / 2) / (cols / 2);
          const waveDelay = centerDist * 0.3 + Math.random() * 0.15;
          columnConfigs.push({
            delay: waveDelay,
            speed: 0.8 + Math.random() * 0.6, // 速度差异
            trail: 3 + Math.floor(Math.random() * 5), // 拖尾长度
          });
        }

        const pixelStates = [];
        for (let row = 0; row < rows; row++) {
          pixelStates[row] = [];
          for (let col = 0; col < cols; col++) {
            const sx = Math.min(col * PIXEL_SIZE + PIXEL_SIZE / 2, cw - 1);
            const sy = Math.min(row * PIXEL_SIZE + PIXEL_SIZE / 2, ch - 1);
            const idx = (Math.floor(sy) * Math.floor(cw) + Math.floor(sx)) * 4;

            pixelStates[row][col] = {
              r: fromPixels.data[idx] || 0,
              g: fromPixels.data[idx + 1] || 0,
              b: fromPixels.data[idx + 2] || 0,
              fallen: false,
              y: row * PIXEL_SIZE,
              vy: 0,
              opacity: 1,
            };
          }
        }

        const duration = 2200;
        const startTime = performance.now();

        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          ctx.clearRect(0, 0, cw, ch);
          ctx.globalAlpha = Math.min(1, progress * 2);
          drawImageCover(toImg);
          ctx.globalAlpha = 1;
          let allFallen = true;
          for (let col = 0; col < cols; col++) {
            const config = columnConfigs[col];
            const colProgress = Math.max(
              0,
              (progress - config.delay) / (1 - config.delay),
            );
            const dissolveFront = colProgress * (rows + config.trail);

            for (let row = 0; row < rows; row++) {
              const pixel = pixelStates[row][col];
              if (row < dissolveFront && !pixel.fallen) {
                pixel.fallen = true;
                pixel.vy = config.speed * 2;
              }
              if (pixel.fallen) {
                pixel.vy += 0.35 * config.speed;
                pixel.y += pixel.vy;
                const fallDist = pixel.y - row * PIXEL_SIZE;
                pixel.opacity = Math.max(0, 1 - fallDist / (ch * 0.7));
                if (pixel.y < ch + PIXEL_SIZE && pixel.opacity > 0.01) {
                  allFallen = false;
                  ctx.globalAlpha = pixel.opacity;
                  ctx.fillStyle = `rgb(${pixel.r}, ${pixel.g}, ${pixel.b})`;
                  ctx.fillRect(
                    col * PIXEL_SIZE,
                    pixel.y,
                    PIXEL_SIZE - 0.5,
                    PIXEL_SIZE - 0.5,
                  );
                  if (pixel.opacity > 0.3 && pixel.vy > 3) {
                    const trailAlpha = pixel.opacity * 0.2;
                    ctx.globalAlpha = trailAlpha;
                    ctx.fillStyle = `rgb(${Math.min(255, pixel.r + 80)}, ${Math.min(255, pixel.g + 80)}, ${Math.min(255, pixel.b + 80)})`;
                    for (let t = 1; t <= 2; t++) {
                      ctx.fillRect(
                        col * PIXEL_SIZE,
                        pixel.y - t * PIXEL_SIZE * 0.8,
                        PIXEL_SIZE - 0.5,
                        PIXEL_SIZE - 0.5,
                      );
                    }
                  }
                }
              } else {
                allFallen = false;
                ctx.globalAlpha = 1;
                ctx.fillStyle = `rgb(${pixel.r}, ${pixel.g}, ${pixel.b})`;
                ctx.fillRect(
                  col * PIXEL_SIZE,
                  pixel.y,
                  PIXEL_SIZE - 0.5,
                  PIXEL_SIZE - 0.5,
                );
              }
            }
          }

          ctx.globalAlpha = 1;

          if (progress < 1 || !allFallen) {
            animationFrame = requestAnimationFrame(animate);
          } else {
            ctx.clearRect(0, 0, cw, ch);
            drawImageCover(toImg);
            callback();
          }
        }

        animationFrame = requestAnimationFrame(animate);
      }

      function goTo(targetIndex) {
        if (isTransitioning || targetIndex === currentIndex) return;
        isTransitioning = true;

        const dots = indicatorsEl.querySelectorAll(".indicator");
        dots[currentIndex].classList.remove("active");
        dots[targetIndex].classList.add("active");

        pixelRainTransition(
          loadedImages[currentIndex],
          loadedImages[targetIndex],
          () => {
            currentIndex = targetIndex;
            isTransitioning = false;
          },
        );
      }

      function next() {
        goTo((currentIndex + 1) % images.length);
      }

      function prev() {
        goTo((currentIndex - 1 + images.length) % images.length);
      }

      function startAutoPlay() {
        stopAutoPlay();
        autoPlayTimer = setInterval(next, 4500);
      }

      function stopAutoPlay() {
        if (autoPlayTimer) {
          clearInterval(autoPlayTimer);
          autoPlayTimer = null;
        }
      }

      function preloadImages() {
        let loaded = 0;
        return new Promise((resolve) => {
          images.forEach((imgData, index) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
              loadedImages[index] = img;
              loaded++;
              if (loaded === images.length) resolve();
            };
            img.onerror = () => {
              const placeholder = document.createElement("canvas");
              placeholder.width = 1920;
              placeholder.height = 1080;
              const pCtx = placeholder.getContext("2d");
              const gradient = pCtx.createLinearGradient(0, 0, 1920, 1080);
              gradient.addColorStop(0, `hsl(${index * 60 + 140}, 50%, 25%)`);
              gradient.addColorStop(1, `hsl(${index * 60 + 170}, 50%, 15%)`);
              pCtx.fillStyle = gradient;
              pCtx.fillRect(0, 0, 1920, 1080);
              pCtx.fillStyle = "#fff";
              pCtx.font = "48px sans-serif";
              pCtx.textAlign = "center";
              pCtx.fillText(imgData.alt, 960, 540);
              loadedImages[index] = placeholder;
              loaded++;
              if (loaded === images.length) resolve();
            };
            img.src = imgData.src;
          });
        });
      }

      async function init() {
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        images.forEach((_, index) => {
          const dot = document.createElement("button");
          dot.className = `indicator ${index === 0 ? "active" : ""}`;
          dot.addEventListener("click", () => goTo(index));
          indicatorsEl.appendChild(dot);
        });

        await preloadImages();
        drawImageCover(loadedImages[0]);
        startAutoPlay();
      }

      document.getElementById("prevBtn").addEventListener("click", () => {
        prev();
        startAutoPlay();
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        next();
        startAutoPlay();
      });

      document
        .querySelector(".carousel-container")
        .addEventListener("mouseenter", stopAutoPlay);
      document
        .querySelector(".carousel-container")
        .addEventListener("mouseleave", startAutoPlay);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          prev();
          startAutoPlay();
        }
        if (e.key === "ArrowRight") {
          next();
          startAutoPlay();
        }
      });

      document.addEventListener("visibilitychange", () => {
        document.hidden ? stopAutoPlay() : startAutoPlay();
      });

      init();
    </script>
  </body>
</html>
