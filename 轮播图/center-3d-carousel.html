<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中心位立体卡片轮播</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f5;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      .carousel {
        width: 980px;
        height: 640px;
        padding: 24px 16px 18px;
      }

      .title {
        margin: 0;
        text-align: center;
        font-size: clamp(20px, 2.6vw, 30px);
        font-weight: 600;
      }

      .subtitle {
        margin: 10px 0 20px;
        text-align: center;
        color: #6b7280;
      }

      .viewport {
        position: relative;
        width: 100%;
        height: 500px;
        perspective: 1200px;
        overflow: visible;
        transform-style: preserve-3d;
      }

      .slide {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 300px;
        height: 380px;
        transition:
          transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity 0.32s ease;
        opacity: 0;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }

      .card-stage {
        width: 100%;
        height: 100%;
        perspective: 1000px;
        transform-style: preserve-3d;
      }

      .card-container {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1);
        will-change: transform;
      }

      .card-bg {
        width: 100%;
        height: 100%;
        position: absolute;
        border-radius: 16px;
        border: 1px solid #d1d5db;
        background: transparent;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        transform-style: preserve-3d;
        transition:
          transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1),
          box-shadow 0.32s ease;
        transform: translateZ(0);
        backface-visibility: hidden;
        overflow: hidden;
      }

      .card-bg::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 58%;
        width: 78%;
        height: 52%;
        transform: translate(-50%, -50%) scale(1);
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(15, 23, 42, 0.16) 0%,
          rgba(15, 23, 42, 0.08) 45%,
          rgba(15, 23, 42, 0) 72%
        );
        filter: blur(8px);
        opacity: 0;
        transition:
          transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity 0.32s ease;
        pointer-events: none;
      }

      .card-img {
        width: 86%;
        height: 72%;
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        margin: 0 auto;
        transform: translateY(-50%) translateZ(40px);
        border-radius: 12px;
        overflow: hidden;
        transform-style: preserve-3d;
        transform-origin: center center;
        transition: transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1);
        z-index: 2;
        backface-visibility: hidden;
      }

      .card-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center center;
        background: transparent;
        display: block;
      }

      .inverted-image {
        height: 75%;
        transform: skewX(328deg);
        position: relative;
        left: 22%;
        top: 8%;
        visibility: hidden;
        opacity: 0;
        filter: grayscale(100%) blur(15px);
        pointer-events: none;
      }

      .slide.center {
        z-index: 200;
      }

      .slide.center .card-container {
        transform: translateY(0);
      }

      .slide.center .card-bg {
        transform: rotateX(42deg) rotateY(8deg) rotateZ(1.5deg) translateZ(0)
          translateY(-30px);
        box-shadow: 0 30px 38px rgba(0, 0, 0, 0.2);
      }

      .slide.center .card-img {
        transform: translate3d(0, -60%, 92px) scale(1.2);
        top: 40%;
      }

      .slide:not(.center) .card-img {
        left: 0;
        right: 0;
        margin: 0 auto;
        transform: translate3d(0, -50%, 40px) scale(1);
      }

      .slide.center .card-bg::after {
        opacity: 0.18;
        transform: translate(-50%, -45%) scale(1.02);
      }

      .slide.center .inverted-image {
        animation: showImg 0.2s ease forwards 0.2s;
      }

      .slide:not(.center) .inverted-image {
        visibility: hidden;
        opacity: 0;
        animation: none;
      }

      @keyframes showImg {
        0% {
          opacity: 0;
          visibility: hidden;
        }
        100% {
          opacity: 0.5;
          visibility: visible;
        }
      }

      .controls {
        margin-top: 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
      }

      .btn {
        border: none;
        background: #ffffff;
        color: #111827;
        border-radius: 12px;
        width: 42px;
        height: 42px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(15, 23, 42, 0.12);
      }

      .dots {
        display: flex;
        gap: 8px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border: none;
        border-radius: 999px;
        background: #cbd5e1;
        padding: 0;
        cursor: pointer;
        transition: all 0.22s ease;
      }

      .dot.active {
        width: 24px;
        background: #6b7280;
      }
    </style>
  </head>
  <body>
    <section class="carousel" aria-label="中心位立体卡片轮播">
      <div class="viewport" id="viewport"></div>
      <div class="controls">
        <button class="btn" id="prevBtn" aria-label="上一张">&#x276E;</button>
        <div class="dots" id="dots"></div>
        <button class="btn" id="nextBtn" aria-label="下一张">&#x276F;</button>
      </div>
    </section>

    <script>
      const cardsData = [
        { src: "../images/七龙珠/1.png" },
        { src: "../images/七龙珠/2.png" },
        { src: "../images/七龙珠/3.png" },
        { src: "../images/七龙珠/4.png" },
        { src: "../images/七龙珠/5.png" },
        { src: "../images/七龙珠/6.png" },
      ];

      const viewport = document.getElementById("viewport");
      const dots = document.getElementById("dots");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let current = 0;
      let timer = null;

      const slides = cardsData.map((item, index) => {
        const slide = document.createElement("article");
        slide.className = "slide";
        slide.innerHTML = `
          <div class="card-stage">
            <div class="card-container">
              <div class="card-bg">
                <img src="${item.src}" alt="" class="inverted-image" />
              </div>
              <div class="card-img">
                <img src="${item.src}" alt="轮播图 ${index + 1}" />
              </div>
            </div>
          </div>
        `;
        viewport.appendChild(slide);

        const dot = document.createElement("button");
        dot.className = "dot";
        dot.setAttribute("aria-label", `切换到第 ${index + 1} 张`);
        dot.addEventListener("click", () => {
          current = index;
          update();
          restartAuto();
        });
        dots.appendChild(dot);

        return slide;
      });

      function normalizeOffset(offset, n) {
        if (offset > n / 2) return offset - n;
        if (offset < -n / 2) return offset + n;
        return offset;
      }

      function update() {
        const n = slides.length;

        slides.forEach((slide, i) => {
          let offset = i - current;
          offset = normalizeOffset(offset, n);
          const abs = Math.abs(offset);

          if (abs > 2) {
            slide.style.opacity = "0";
            slide.style.transform =
              "translate3d(-50%, -50%, -260px) scale(0.56)";
            slide.classList.remove("center");
            return;
          }

          const x = offset * 360;
          const y = 0;
          const scale = abs === 0 ? 1 : abs === 1 ? 0.7 : 0.52;

          slide.style.transform = `translate3d(calc(-50% + ${x}px), calc(-50% + ${y}px), 0) scale(${scale})`;
          slide.style.opacity = abs === 2 ? "0.45" : "1";
          slide.style.zIndex = String(10 - abs);

          if (abs === 0) slide.classList.add("center");
          else slide.classList.remove("center");
        });

        [...dots.children].forEach((dot, idx) => {
          dot.classList.toggle("active", idx === current);
        });
      }

      function go(step) {
        const n = slides.length;
        current = (current + step + n) % n;
        update();
      }

      function startAuto() {
        timer = setInterval(() => go(1), 2600);
      }

      function restartAuto() {
        clearInterval(timer);
        startAuto();
      }

      prevBtn.addEventListener("click", () => {
        go(-1);
        restartAuto();
      });

      nextBtn.addEventListener("click", () => {
        go(1);
        restartAuto();
      });

      viewport.addEventListener("mouseenter", () => clearInterval(timer));
      viewport.addEventListener("mouseleave", startAuto);

      update();
      startAuto();
    </script>
  </body>
</html>
