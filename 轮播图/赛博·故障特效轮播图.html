<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赛博·故障特效轮播图</title>
    <style>
      /*css样式*/
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        margin: 0;
        flex-direction: column;
        padding: 20px;
      }

      .glitch-container {
        width: 100%;
        max-width: 600px;
        height: 400px;
        position: relative;
        background-color: #000;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.3),
          0 0 30px rgba(255, 0, 255, 0.3);
        border: 1px solid rgba(204, 204, 204, 0.2);
        overflow: hidden;
        border-radius: 4px;
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .controls button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 10;

        width: 45px;
        height: 45px;
        border-radius: 50%;
        background-color: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.4);
        cursor: pointer;

        opacity: 0;
        transition: all 0.3s ease;
      }

      .glitch-container:hover .controls button {
        opacity: 1;
      }

      .controls button:hover {
        background-color: rgba(0, 0, 0, 0.7);
        border-color: rgba(255, 255, 255, 0.8);
        transform: translateY(-50%) scale(1.05);
      }

      .controls .prev {
        left: 20px;
      }

      .controls .next {
        right: 20px;
      }

      .controls button::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
      }

      .controls .prev::after {
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-right: 10px solid #fff;
        transform: translate(-50%, -50%) translateX(-2px);
      }

      .controls .next::after {
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 10px solid #fff;
        transform: translate(-50%, -50%) translateX(2px);
      }

      .autoplay-control {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 8px 16px;
        background-color: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        opacity: 0.8;
      }

      .autoplay-control:hover {
        background-color: rgba(0, 0, 0, 0.8);
        border-color: rgba(255, 255, 255, 0.8);
        opacity: 1;
      }

      .loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.7);
        font-size: 1rem;
        z-index: 5;
      }

      @media (max-width: 600px) {
        .glitch-container {
          height: 300px;
        }
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="glitch-container">
      <div class="loading">加载中...</div>
      <canvas id="glitchCanvas"></canvas>

      <div class="controls">
        <button id="prevBtn" class="prev" disabled></button>
        <button id="nextBtn" class="next" disabled></button>
      </div>

      <button class="autoplay-control" id="autoplayControl">
        暂停自动轮播
      </button>
    </div>

    <script>
      //js逻辑
      // ===================== 统一配置管理 =====================
      const glitchConfig = {
        // 轮播基础配置
        carousel: {
          autoplayDelay: 3000, // 自动轮播间隔(ms)
          transitionDuration: 800, // 故障切换动画时长(ms)
          isAutoplay: true, // 是否默认开启自动轮播
        },
        // RGB分离特效配置
        rgbSplit: {
          offsetBase: 20, // RGB通道最大偏移量基数
          triggerProbability: 0.7, // 触发概率(0-1，值越大越难触发)
        },
        // 切片偏移特效配置
        slicing: {
          count: 10, // 切片数量
          minHeight: 5, // 切片最小高度(px)
          maxHeight: 20, // 切片最大高度(px)
          offsetBase: 50, // 切片最大水平偏移基数
          triggerProbability: 0.5, // 触发概率(0-1，值越大越难触发)
        },
        // 区块打乱特效配置
        blockScramble: {
          count: 10, // 打乱区块数量
          minWidth: 20, // 区块最小宽度(px)
          maxWidth: 50, // 区块最大宽度(px)
          minHeight: 5, // 区块最小高度(px)
          maxHeight: 20, // 区块最大高度(px)
          triggerProbability: 0.8, // 触发概率(0-1，值越大越难触发)
        },
        // 扫描线特效配置
        scanLine: {
          spacing: 3, // 扫描线间距(px)
          opacity: 0.1, // 扫描线透明度(0-1)
        },
        // 图片列表
        images: [
          "http://5b0988e595225.cdn.sohucs.com/images/20180130/24aecf0d680546ccbf6480badce389dc.jpeg",
          "https://pic3.zhimg.com/v2-f1159536dc58af663e3955e774a7a13a_r.jpg",
          "http://qqpublic.qpic.cn/qq_public_cover/0/0-2083471255-1DB77954D274653D98B57D000A686040_vsmcut/0",
          "http://p6.itc.cn/q_70/images03/20210106/6cd651a28f9a46268205410dcc5cad4d.jpeg",
          "http://5b0988e595225.cdn.sohucs.com/images/20180824/781646fe72fc4788b7dfc24c112b5bbb.png",
          "http://5b0988e595225.cdn.sohucs.com/images/20171122/c839ec116c7e4853ac9d34a7abf8b4cc.jpeg",
          "https://pic3.zhimg.com/v2-d0590fa634c9aae77339e820e185b75b_1440w.jpg?source=172ae18b",
        ],
        // 兜底图片(Base64)
        fallbackImage: `data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzAwMCIvPjx0ZXh0IHg9IjUwIiB5PSI1MCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjciIGZvbnQtZmFtaWx5PSJBcmlhbCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMCwgNTApIj7nlLXopoHvvIg8L3RleHQ+PC9zdmc+`,
      };

      glitchConfig.rgbSplit.offsetBase = 12; // 降低RGB分离强度
      glitchConfig.slicing.offsetBase = 30; // 降低切片偏移强度
      glitchConfig.blockScramble.count = 6; // 减少打乱区块数量
      glitchConfig.scanLine.opacity = 0.08; // 降低扫描线透明度
      glitchConfig.rgbSplit.triggerProbability = 0.8; // 减少RGB分离触发频率
      glitchConfig.carousel.transitionDuration = 1000; // 延长动画时长，更平缓

      // ===================== 全局变量 =====================
      const canvas = document.getElementById("glitchCanvas");
      const ctx = canvas.getContext("2d");
      const container = document.querySelector(".glitch-container");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const autoplayControl = document.getElementById("autoplayControl");
      const loadingIndicator = document.querySelector(".loading");

      let currentIndex = 0;
      let isAnimating = false;
      let autoplayInterval = null;
      const loadedImages = [];

      // ===================== 工具函数 =====================
      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      // ===================== 图片预加载 =====================
      function preloadImages() {
        let loadedCount = 0;
        let errorCount = 0;

        glitchConfig.images.forEach((src, index) => {
          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.src = src;

          img.onload = () => {
            loadedCount++;
            loadedImages[index] = img;
            checkAllLoaded();
          };

          img.onerror = () => {
            errorCount++;
            const fallbackImg = new Image();
            fallbackImg.src = glitchConfig.fallbackImage;
            loadedImages[index] = fallbackImg;
            checkAllLoaded();
          };
        });

        function checkAllLoaded() {
          if (loadedCount + errorCount === glitchConfig.images.length) {
            loadingIndicator.style.display = "none";
            init();
          }
        }
      }

      // ===================== 初始化 =====================
      function init() {
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;

        if (loadedImages[currentIndex]) {
          ctx.drawImage(
            loadedImages[currentIndex],
            0,
            0,
            canvas.width,
            canvas.height
          );
        }

        prevBtn.disabled = false;
        nextBtn.disabled = false;

        if (glitchConfig.carousel.isAutoplay) {
          startAutoplay();
        } else {
          autoplayControl.textContent = "开启自动轮播";
        }

        document.addEventListener("visibilitychange", handleVisibilityChange);
      }

      // ===================== 故障特效函数 =====================
      /**
       * RGB色彩分离特效
       * @param {ImageData} imageData - 画布像素数据
       * @param {number} intensity - 特效强度
       */
      function applyRGBSplit(imageData, intensity) {
        const data = imageData.data;
        const offset = intensity * glitchConfig.rgbSplit.offsetBase;

        for (let i = 0; i < data.length; i += 4) {
          const r_offset = getRandomInt(-offset, offset) * 4;
          const b_offset = getRandomInt(-offset, offset) * 4;

          const rIndex = Math.max(0, Math.min(data.length - 4, i + r_offset));
          const bIndex = Math.max(0, Math.min(data.length - 4, i + b_offset));

          data[i] = data[rIndex] || data[i];
          data[i + 2] = data[bIndex + 2] || data[i + 2];
        }
      }

      /**
       * 切片偏移特效
       * @param {HTMLCanvasElement} canvas - 画布元素
       * @param {number} intensity - 特效强度
       */
      function applySlicing(canvas, intensity) {
        const sliceCount = glitchConfig.slicing.count;
        const maxOffset = intensity * glitchConfig.slicing.offsetBase;

        for (let i = 0; i < sliceCount; i++) {
          const startY = getRandomInt(0, canvas.height);
          const sliceHeight = getRandomInt(
            glitchConfig.slicing.minHeight,
            glitchConfig.slicing.maxHeight
          );
          const offsetX = getRandomInt(-maxOffset, maxOffset);

          ctx.save();
          ctx.drawImage(
            canvas,
            0,
            startY,
            canvas.width,
            sliceHeight,
            offsetX,
            startY,
            canvas.width,
            sliceHeight
          );
          ctx.restore();
        }
      }

      /**
       * 区块打乱特效
       * @param {HTMLCanvasElement} canvas - 画布元素
       */
      function applyBlockScramble(canvas) {
        const count = glitchConfig.blockScramble.count;

        for (let i = 0; i < count; i++) {
          const sx = getRandomInt(0, canvas.width - 50);
          const sy = getRandomInt(0, canvas.height - 50);
          const sw = getRandomInt(
            glitchConfig.blockScramble.minWidth,
            glitchConfig.blockScramble.maxWidth
          );
          const sh = getRandomInt(
            glitchConfig.blockScramble.minHeight,
            glitchConfig.blockScramble.maxHeight
          );
          const dx = getRandomInt(0, canvas.width - 50);
          const dy = getRandomInt(0, canvas.height - 50);

          ctx.save();
          ctx.drawImage(canvas, sx, sy, sw, sh, dx, dy, sw, sh);
          ctx.restore();
        }
      }

      /**
       * 扫描线特效
       * @param {HTMLCanvasElement} canvas - 画布元素
       */
      function applyScanLines(canvas) {
        ctx.fillStyle = `rgba(0, 0, 0, ${glitchConfig.scanLine.opacity})`;
        for (let i = 0; i < canvas.height; i += glitchConfig.scanLine.spacing) {
          ctx.fillRect(0, i, canvas.width, 1);
        }
      }

      // ===================== 切换动画 =====================
      function startGlitchTransition(fromImage, toImage) {
        let startTime = Date.now();

        function glitchLoop() {
          const elapsedTime = Date.now() - startTime;
          const progress =
            elapsedTime / glitchConfig.carousel.transitionDuration;

          if (progress >= 1) {
            ctx.drawImage(toImage, 0, 0, canvas.width, canvas.height);
            isAnimating = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            return;
          }

          const baseImage =
            progress > 0.5 && Math.random() > 0.5 ? toImage : fromImage;
          ctx.drawImage(baseImage, 0, 0, canvas.width, canvas.height);

          if (Math.random() > glitchConfig.rgbSplit.triggerProbability) {
            const imageData = ctx.getImageData(
              0,
              0,
              canvas.width,
              canvas.height
            );
            const intensity = Math.sin(progress * Math.PI);

            applyRGBSplit(imageData, intensity);
            ctx.putImageData(imageData, 0, 0);
          }

          if (Math.random() > glitchConfig.slicing.triggerProbability) {
            const intensity = Math.sin(progress * Math.PI);
            applySlicing(canvas, intensity);
          }

          if (Math.random() > glitchConfig.blockScramble.triggerProbability) {
            applyBlockScramble(canvas);
          }

          applyScanLines(canvas);

          requestAnimationFrame(glitchLoop);
        }

        glitchLoop();
      }

      // ===================== 轮播控制 =====================
      function goToSlide(newIndex) {
        if (isAnimating || currentIndex === newIndex) return;

        isAnimating = true;
        prevBtn.disabled = true;
        nextBtn.disabled = true;

        const currentImage = loadedImages[currentIndex];
        const nextImage = loadedImages[newIndex];

        currentIndex = newIndex;

        startGlitchTransition(currentImage, nextImage);

        if (glitchConfig.carousel.isAutoplay) {
          resetAutoplay();
        }
      }

      function startAutoplay() {
        if (autoplayInterval) clearInterval(autoplayInterval);

        autoplayInterval = setInterval(() => {
          if (!isAnimating && document.visibilityState === "visible") {
            goToSlide((currentIndex + 1) % glitchConfig.images.length);
          }
        }, glitchConfig.carousel.autoplayDelay);

        autoplayControl.textContent = "暂停自动轮播";
        glitchConfig.carousel.isAutoplay = true;
      }

      function stopAutoplay() {
        clearInterval(autoplayInterval);
        autoplayInterval = null;
        autoplayControl.textContent = "开启自动轮播";
        glitchConfig.carousel.isAutoplay = false;
      }

      function resetAutoplay() {
        if (glitchConfig.carousel.isAutoplay) {
          stopAutoplay();
          startAutoplay();
        }
      }

      function handleVisibilityChange() {
        if (document.hidden) {
          if (glitchConfig.carousel.isAutoplay && autoplayInterval) {
            clearInterval(autoplayInterval);
          }
        } else {
          if (glitchConfig.carousel.isAutoplay) {
            startAutoplay();
          }
        }
      }

      // ===================== 事件绑定 =====================
      function bindEvents() {
        // 下一张/上一张按钮
        nextBtn.addEventListener("click", () =>
          goToSlide((currentIndex + 1) % glitchConfig.images.length)
        );

        prevBtn.addEventListener("click", () =>
          goToSlide(
            (currentIndex - 1 + glitchConfig.images.length) %
              glitchConfig.images.length
          )
        );

        // 自动轮播控制
        autoplayControl.addEventListener("click", () => {
          if (glitchConfig.carousel.isAutoplay) {
            stopAutoplay();
          } else {
            startAutoplay();
          }
        });

        // 键盘方向键控制
        document.addEventListener("keydown", (e) => {
          if (e.key === "ArrowRight") {
            nextBtn.click();
          } else if (e.key === "ArrowLeft") {
            prevBtn.click();
          }
        });

        // 窗口大小调整
        window.addEventListener("resize", () => {
          if (!isAnimating) {
            init();
          }
        });

        // 鼠标悬停暂停/恢复轮播
        container.addEventListener("mouseenter", () => {
          if (glitchConfig.carousel.isAutoplay) {
            clearInterval(autoplayInterval);
          }
        });

        container.addEventListener("mouseleave", () => {
          if (glitchConfig.carousel.isAutoplay) {
            startAutoplay();
          }
        });
      }

      // ===================== 初始化执行 =====================
      bindEvents();
      preloadImages();
    </script>
  </body>
</html>
