<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>可以拨动的果冻菜单</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #292823;
        --muted: #8a877d;
        --accent: #e8623e;
        --paper: #f5f3eb;
        font-family:
          "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      body {
        margin: 0;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible {
        outline: 3px solid #e8623e;
        outline-offset: 5px;
      }
      button {
        color: inherit;
      }
      .scene {
        position: relative;
        width: 100%;
        height: 100svh;
        min-height: 400px;
        overflow: hidden;
      }
      .eyebrow {
        position: absolute;
        top: 28px;
        left: 32px;
        font-size: 10px;
        letter-spacing: 3px;
        z-index: 5;
        pointer-events: none;
        opacity: 0.55;
      }
      .hint {
        position: absolute;
        bottom: 24px;
        left: 24px;
        right: 24px;
        text-align: center;
        font-size: 12px;
        letter-spacing: 1px;
        line-height: 1.8;
        z-index: 8;
        pointer-events: none;
        opacity: 0.65;
      }
      .pill {
        border: 1px solid #29282322;
        border-radius: 30px;
        padding: 10px 18px;
        background: #ffffffa8;
        backdrop-filter: blur(12px);
        font-size: 12px;
      }
      .status {
        position: absolute;
        right: 26px;
        top: 24px;
        font-size: 11px;
        z-index: 5;
        opacity: 0.6;
      }
      .paused *,
      .paused *::before,
      .paused *::after {
        animation-play-state: paused !important;
      }
      .face {
        display: flex;
        gap: 13px;
        align-items: center;
        justify-content: center;
      }
      .face i {
        display: block;
        width: 5px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .face:after {
        content: "";
        width: 9px;
        height: 5px;
        border-bottom: 2px solid currentColor;
        border-radius: 50%;
        position: absolute;
        transform: translateY(11px);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      @media (max-width: 600px) {
        .eyebrow {
          left: 20px;
          top: 20px;
          font-size: 9px;
        }
        .hint {
          font-size: 11px;
          bottom: 18px;
        }
        .status {
          right: 18px;
          top: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <style>
      .scene {
        background: #f0e6df;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .heading {
        position: absolute;
        top: 17%;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
      }
      .heading h1 {
        font:
          500 40px "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        letter-spacing: 3px;
        color: #a68d7e5c;
        margin: 0;
      }
      .heading p {
        font-size: 10px;
        letter-spacing: 3px;
        color: #b8a193;
      }
      .tray {
        display: flex;
        gap: 8px;
        width: min(640px, 94%);
        justify-content: center;
        position: relative;
        margin-top: 30px;
      }
      .tray:after {
        content: "";
        position: absolute;
        left: 2%;
        right: 2%;
        height: 1px;
        background: #bda99755;
        top: 177px;
      }
      .jelly {
        padding: 0;
        position: relative;
        flex: 1;
        min-width: 0;
        max-width: 145px;
        height: 235px;
        border: 0;
        background: none;
        touch-action: none;
        user-select: none;
        cursor: grab;
        overflow: visible;
      }
      .jelly:active {
        cursor: grabbing;
      }
      .jelly svg {
        width: 100%;
        height: 200px;
        overflow: visible;
        display: block;
      }
      .jelly .label {
        position: absolute;
        top: 210px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: #8d7768;
        letter-spacing: 3px;
      }
      .jelly[aria-pressed="true"] .label {
        color: #bc6145;
      }
      .selected {
        position: absolute;
        bottom: 78px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #ae9482;
        font:
          12px "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        letter-spacing: 1px;
      }
      .hint {
        color: #8f7769;
      }
      @media (max-width: 500px) {
        .tray {
          gap: 0;
          width: 96%;
        }
        .heading h1 {
          font-size: 26px;
          letter-spacing: 1px;
        }
        .jelly .label {
          font-size: 10px;
          letter-spacing: 1px;
        }
        .jelly {
          height: 230px;
        }
        .tray:after {
          top: 158px;
        }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <span class="eyebrow">果冻小食光</span
      ><span class="status">软乎乎，刚刚好</span>
      <div class="heading">
        <h1>拨一拨，快乐晃起来</h1>
        <p>轻轻一拨，快乐就会传递</p>
      </div>
      <div class="tray" aria-label="果冻导航菜单"></div>
      <div class="selected" id="selected" aria-live="polite">
        选一种口味，尝尝今天的心情。
      </div>
      <div class="hint">
        拖动果冻再放手 · 弹性会传给邻居 · 聚焦后按方向键也能拨动
      </div>
    </main>
    <script>
      /* 内嵌动画时钟，无需外部依赖。 */
      window.Lab = (() => {
        const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
        let paused = false,
          last = 0;
        const loops = [];
        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function tick(t) {
          const dt = Math.min((t - last) / 1000 || 0.016, 0.04);
          last = t;
          if (!paused && !document.hidden)
            loops.forEach((fn) => fn(dt, t / 1000));
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        addEventListener("message", (e) => {
          if (e.source !== parent || !e.data || e.data.type !== "lab-pause")
            return;
          paused = !!e.data.value;
          document.documentElement.classList.toggle("paused", paused);
        });
        function canvas(el) {
          const ctx = el.getContext("2d");
          let w = 0,
            h = 0;
          const resize = () => {
            const b = el.getBoundingClientRect();
            w = b.width;
            h = b.height;
            const d = Math.min(devicePixelRatio || 1, 2);
            el.width = w * d;
            el.height = h * d;
            ctx.setTransform(d, 0, 0, d, 0, 0);
          };
          new ResizeObserver(resize).observe(el);
          resize();
          return {
            ctx,
            get w() {
              return w;
            },
            get h() {
              return h;
            },
          };
        }
        function point(e, el) {
          const r = el.getBoundingClientRect();
          return { x: e.clientX - r.left, y: e.clientY - r.top };
        }
        return { clamp, reduced, loop: (fn) => loops.push(fn), canvas, point };
      })();
    </script>
    <script>
      const flavors = [
        ["杏桃", "#e5a47f", "#b97455"],
        ["抹茶", "#b1bf93", "#7d9163"],
        ["莓果", "#c7a1ad", "#9a6e83"],
        ["奶油", "#ead49c", "#b8a16b"],
      ];
      const jellies = flavors.map(([name, color, edge], i) => {
        const el = document.createElement("button");
        el.className = "jelly";
        el.setAttribute("aria-label", name + "果冻，拖动或按方向键");
        el.setAttribute("aria-pressed", "false");
        el.innerHTML = `<svg viewBox="0 0 140 200" aria-hidden="true"><defs><linearGradient id="g${i}" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="${color}" stop-opacity=".65"/><stop offset="1" stop-color="${color}"/></linearGradient></defs><ellipse cx="70" cy="176" rx="43" ry="7" fill="${edge}" opacity=".12"/><path class="blob" fill="url(#g${i})" stroke="${edge}" stroke-opacity=".35"/><g class="features"><path d="M-25 -25Q-18 -35 -9 -33" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"/><ellipse cx="-10" cy="0" rx="2.4" ry="3.6" fill="${edge}"/><ellipse cx="10" cy="0" rx="2.4" ry="3.6" fill="${edge}"/><path d="M-4 9Q0 13 4 9" stroke="${edge}" fill="none" stroke-width="1.5"/><ellipse cx="-19" cy="8" rx="5" ry="2.5" fill="${edge}" opacity=".2"/><ellipse cx="19" cy="8" rx="5" ry="2.5" fill="${edge}" opacity=".2"/></g></svg><span class="label">${name}</span>`;
        document.querySelector(".tray").append(el);
        return {
          el,
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          drag: false,
          start: null,
          moved: 0,
        };
      });
      function select(i) {
        jellies.forEach((j, n) => j.el.setAttribute("aria-pressed", n === i));
        document.querySelector("#selected").textContent =
          flavors[i][0] +
          "口味 · " +
          [
            "今天的快乐，是杏桃味的。",
            "慢一点，喝一口抹茶。",
            "一点酸，一点甜，刚刚好。",
            "软软的心情，值得被接住。",
          ][i];
      }
      jellies.forEach((j, i) => {
        j.el.onpointerdown = (e) => {
          j.drag = true;
          j.start = { x: e.clientX, y: e.clientY };
          j.moved = 0;
          j.el.setPointerCapture(e.pointerId);
        };
        j.el.onpointermove = (e) => {
          if (!j.drag) return;
          const scale = 140 / j.el.clientWidth;
          j.x = Lab.clamp((e.clientX - j.start.x) * scale, -75, 75);
          j.y = Lab.clamp((e.clientY - j.start.y) * scale, -85, 35);
          j.moved = Math.hypot(j.x, j.y);
        };
        function release() {
          if (!j.drag) return;
          j.drag = false;
          j.vy = 80;
          jellies.forEach((n, k) => {
            if (k !== i) {
              const distance = Math.abs(k - i);
              n.vx += (j.x * 6) / distance;
              n.vy -= (Math.abs(j.y) * 3) / distance;
            }
          });
          select(i);
        }
        j.el.onpointerup = release;
        j.el.onpointercancel = release;
        j.el.onpointerenter = () => {
          if (!j.drag) j.vy = -65;
        };
        j.el.onclick = () => {
          if (j.moved < 5) {
            j.vy = -160;
            select(i);
          }
        };
        j.el.onkeydown = (e) => {
          if (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)
          ) {
            e.preventDefault();
            j.vx +=
              e.key === "ArrowLeft" ? -260 : e.key === "ArrowRight" ? 260 : 0;
            j.vy +=
              e.key === "ArrowUp" ? -300 : e.key === "ArrowDown" ? 200 : 0;
            jellies.forEach((n, k) => {
              if (Math.abs(k - i) === 1) n.vy = -140;
            });
            select(i);
          }
        };
      });
      Lab.loop((dt) => {
        jellies.forEach((j) => {
          if (!j.drag) {
            j.vx += -j.x * 90 * dt;
            j.vy += -j.y * 100 * dt;
            j.vx *= Math.exp(-dt * 5.3);
            j.vy *= Math.exp(-dt * 5.6);
            j.x += j.vx * dt;
            j.y += j.vy * dt;
          }
          const x = 70 + j.x,
            y = 105 + j.y;
          const widen = Lab.clamp(1 + j.y * 0.005, 0.75, 1.18),
            r = 43 * widen;
          j.el
            .querySelector(".blob")
            .setAttribute(
              "d",
              `M27 164 C10 148 ${x - r - 7} ${y - 32} ${x - r + 12} ${y - 39} Q${x} ${y - 61} ${x + r - 12} ${y - 39} C${x + r + 7} ${y - 32} 130 148 113 164 Q70 184 27 164 Z`,
            );
          j.el
            .querySelector(".features")
            .setAttribute(
              "transform",
              `translate(${x} ${y - 4}) rotate(${j.x * 0.13})`,
            );
        });
      });
    </script>
  </body>
</html>
