      }

      function drawLandShape(polygon, fillStyle, strokeWidth = 2.6) {
        const path = buildPolygonPath(polygon);
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 22;
        ctx.shadowOffsetY = 12;
        ctx.fillStyle = fillStyle;
        ctx.fill(path);

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(236, 247, 222, 0.95)";
        ctx.lineWidth = strokeWidth + 3.8;
        ctx.stroke(path);
        ctx.strokeStyle = "#5f9676";
        ctx.lineWidth = strokeWidth;
        ctx.stroke(path);
        ctx.strokeStyle = "rgba(14, 73, 65, 0.32)";
        ctx.lineWidth = 0.9;
        ctx.stroke(path);
        ctx.restore();
        return path;
      }

      function combinePaths(paths) {
        const combined = new Path2D();
        paths.forEach((path) => combined.addPath(path));
        return combined;
      }

      function drawLandTexture(paths) {
        ctx.save();
        ctx.clip(combinePaths(paths));

        ctx.strokeStyle = "rgba(93, 137, 102, 0.11)";
        ctx.lineWidth = 1;
        for (let i = -160; i < WORLD.width + 220; i += 34) {
          ctx.beginPath();
          ctx.moveTo(i, WORLD.height + 40);
          ctx.bezierCurveTo(i + 80, WORLD.height * 0.58, i - 30, WORLD.height * 0.34, i + 120, -30);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(255, 248, 228, 0.14)";
        ctx.lineWidth = 1.2;
        [
          [
            [77, 35.4],
            [85, 37.2],
            [94, 36.4],
            [103, 34.7],
            [112, 33.6],
            [121, 34.8],
          ],
          [
            [82, 28.6],
            [91, 30.1],
            [100, 29.8],
            [109, 28.3],
            [118, 28.7],
          ],
          [
            [101, 23.2],
            [109, 24.1],
            [116, 25.6],
          ],
        ].forEach((line) => {
          ctx.beginPath();
          line.forEach(([lon, lat], index) => {
            const p = project(lon, lat);
            if (index === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });
        ctx.restore();
      }

      function clipPolygonToHalfPlane(polygon, a, b, c) {
        const clipped = [];
        const epsilon = 0.000001;
        for (let i = 0; i < polygon.length; i++) {
          const current = polygon[i];
          const previous = polygon[(i + polygon.length - 1) % polygon.length];
          const currentValue = a * current.x + b * current.y - c;
          const previousValue = a * previous.x + b * previous.y - c;
          const currentInside = currentValue <= epsilon;
          const previousInside = previousValue <= epsilon;

          if (currentInside !== previousInside) {
            const dx = current.x - previous.x;
            const dy = current.y - previous.y;
            const denominator = a * dx + b * dy;
            if (Math.abs(denominator) > epsilon) {
              const t = (c - a * previous.x - b * previous.y) / denominator;
              clipped.push({
                x: previous.x + dx * t,
                y: previous.y + dy * t,
              });
            }
          }

          if (currentInside) clipped.push(current);
        }
        return clipped;
      }

      function buildCityBoundaryPath() {
        const padding = 28;
        const bounds = {
          x: MAP_BOX.x - padding,
          y: MAP_BOX.y - padding,
          width: MAP_BOX.width + padding * 2,
          height: MAP_BOX.height + padding * 2,
        };
        const seeds = cityLookup.map((city) => {
          const p = project(city.lon, city.lat);
          return { ...city, x: p.x, y: p.y };
        });
        const path = new Path2D();
        cityBoundaryCells = new Map();

        seeds.forEach((seed) => {
          let cell = [
            { x: bounds.x, y: bounds.y },
            { x: bounds.x + bounds.width, y: bounds.y },
            { x: bounds.x + bounds.width, y: bounds.y + bounds.height },
            { x: bounds.x, y: bounds.y + bounds.height },
          ];

          for (const other of seeds) {
            if (other === seed) continue;
            const a = 2 * (other.x - seed.x);
            const b = 2 * (other.y - seed.y);
            const c = other.x * other.x + other.y * other.y - seed.x * seed.x - seed.y * seed.y;
            cell = clipPolygonToHalfPlane(cell, a, b, c);
            if (cell.length === 0) break;
          }

          if (cell.length > 1) {
            const cellPath = new Path2D();
            cellPath.moveTo(cell[0].x, cell[0].y);
            path.moveTo(cell[0].x, cell[0].y);
            for (let i = 1; i < cell.length; i++) {
              cellPath.lineTo(cell[i].x, cell[i].y);
              path.lineTo(cell[i].x, cell[i].y);
            }
            cellPath.closePath();
            path.closePath();
            cityBoundaryCells.set(seed.name, cellPath);
          }
        });

        return path;
      }

      function drawCityBoundaryLayer(paths) {
        if (!cityBoundaryPath) cityBoundaryPath = buildCityBoundaryPath();
        ctx.save();
        ctx.clip(combinePaths(paths));
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(255, 248, 228, 0.3)";
        ctx.lineWidth = 1.7;
        ctx.stroke(cityBoundaryPath);
        ctx.strokeStyle = "rgba(38, 85, 67, 0.48)";
        ctx.lineWidth = 0.8;
        ctx.stroke(cityBoundaryPath);
        ctx.restore();
      }

      function drawHoveredCityHighlight(paths) {
        if (!hoverState.active || animation.playing || animation.recording) return;
        if (!cityBoundaryPath) cityBoundaryPath = buildCityBoundaryPath();
        const cellPath = cityBoundaryCells.get(hoverState.name);
        if (!cellPath) return;

        ctx.save();
        ctx.clip(combinePaths(paths));
        ctx.shadowColor = "rgba(216, 155, 36, 0.35)";
        ctx.shadowBlur = 14;
        ctx.fillStyle = "rgba(216, 155, 36, 0.24)";
        ctx.fill(cellPath);

        ctx.shadowBlur = 0;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(198, 64, 36, 0.72)";
        ctx.lineWidth = 2.1;
        ctx.stroke(cellPath);
        ctx.strokeStyle = "rgba(255, 248, 228, 0.72)";
        ctx.lineWidth = 0.9;
        ctx.stroke(cellPath);
        ctx.restore();

        const city = findCityByName(hoverState.name);
        if (city) {
          const p = project(city.lon, city.lat);
          ctx.save();
          ctx.shadowColor = "rgba(216, 155, 36, 0.55)";
          ctx.shadowBlur = 12;
          ctx.strokeStyle = "rgba(216, 155, 36, 0.95)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 8.5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = "#c64024";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function roundedRectPath(x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + width - r, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + r);
        ctx.lineTo(x + width, y + height - r);
        ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        ctx.lineTo(x + r, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function drawPointLabel(text, x, y) {
        ctx.save();
        ctx.font = "800 13px Avenir Next, PingFang SC, sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        const paddingX = 10;
        const width = Math.ceil(ctx.measureText(text).width) + paddingX * 2;
        const height = 26;
        let labelX = x + 17;
        let labelY = y - height - 7;

        if (labelX + width > WORLD.width - 16) labelX = x - width - 17;
        if (labelY < 16) labelY = y + 17;

        ctx.shadowColor = "rgba(8, 21, 24, 0.28)";
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;
        roundedRectPath(labelX, labelY, width, height, 8);
        ctx.fillStyle = "rgba(255, 248, 228, 0.95)";
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = "rgba(198, 64, 36, 0.4)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = "#15251f";
        ctx.fillText(text, labelX + paddingX, labelY + height / 2 + 0.5);
        ctx.restore();
      }

      function drawAttractionMarker(x, y, important) {
        const radius = important ? 4.6 : 2.35;
        ctx.save();
        ctx.shadowColor = "rgba(84, 55, 16, 0.24)";
        ctx.shadowBlur = important ? 8 : 3.5;
        ctx.shadowOffsetY = 1.5;
        ctx.fillStyle = important ? "#d99522" : "rgba(217, 154, 36, 0.78)";
        ctx.strokeStyle = "rgba(255, 248, 228, 0.9)";
        ctx.lineWidth = important ? 1.5 : 1.2;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillStyle = "rgba(255, 248, 228, 0.95)";
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const angle = -Math.PI / 2 + (i * Math.PI) / 5;
          const starRadius = i % 2 === 0 ? radius * 0.52 : radius * 0.24;
          const sx = x + Math.cos(angle) * starRadius;
          const sy = y + Math.sin(angle) * starRadius;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawMap() {
        ctx.save();
        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        drawSeaBackground();

        const landGradient = ctx.createLinearGradient(MAP_BOX.x, MAP_BOX.y, MAP_BOX.x + MAP_BOX.width, MAP_BOX.y + MAP_BOX.height);
        landGradient.addColorStop(0, "#edf6df");
        landGradient.addColorStop(0.45, "#dbeccf");
        landGradient.addColorStop(1, "#c7dfbd");

        const mainlandPath = drawLandShape(mainland, landGradient, 2.7);
        const islandGradient = ctx.createLinearGradient(MAP_BOX.x, MAP_BOX.y + MAP_BOX.height * 0.5, MAP_BOX.x + MAP_BOX.width, MAP_BOX.y + MAP_BOX.height);
        islandGradient.addColorStop(0, "#e8f4dc");
        islandGradient.addColorStop(1, "#c8dfbd");
        const islandPaths = [hainan, taiwan].map((island) => drawLandShape(island, islandGradient, 2));
        drawLandTexture([mainlandPath, ...islandPaths]);
        drawCityBoundaryLayer([mainlandPath, ...islandPaths]);
        drawHoveredCityHighlight([mainlandPath, ...islandPaths]);

        ctx.strokeStyle = "rgba(42, 82, 64, 0.48)";
        ctx.lineWidth = 1.2;
        ctx.setLineDash([6, 6]);
        provinceLines.forEach((line) => {
          ctx.beginPath();
          line.forEach(([lon, lat], index) => {
            const p = project(lon, lat);
            if (index === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
        });
        ctx.setLineDash([]);

        attractionMarks.forEach((mark, index) => {
          const p = project(mark.lon, mark.lat);
          const important = mark.tier === "core";
          const showLabel = important || mapCamera.zoom >= 3 || (mapCamera.zoom >= 2.1 && index % 7 === 0);
          drawAttractionMarker(p.x, p.y, important);

          if (showLabel) {
            const labelX = p.x + (mark.dx ?? 8);
            const labelY = p.y + (mark.dy ?? -12);
            ctx.save();
            ctx.font = `${important ? "800" : "700"} 11.5px Avenir Next, PingFang SC, sans-serif`;
            ctx.textBaseline = "middle";
            ctx.lineWidth = important ? 4 : 3.4;
            ctx.strokeStyle = important ? "rgba(255, 248, 228, 0.9)" : "rgba(255, 248, 228, 0.76)";
            ctx.strokeText(mark.name, labelX, labelY);
            ctx.fillStyle = important ? "rgba(94, 57, 14, 0.96)" : "rgba(94, 57, 14, 0.82)";
            ctx.fillText(mark.name, labelX, labelY);
            ctx.restore();
          }
        });

        ctx.fillStyle = "rgba(245, 239, 217, 0.42)";
        [
          [112.0, 16.5],
          [114.8, 13.8],
          [117.3, 11.5],
          [110.4, 12.7],
          [120.3, 18.7],
        ].forEach(([lon, lat]) => {
          const p = project(lon, lat);
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      function buildRoute() {
        routeSamples = [];
        routeLength = 0;
        if (points.length < 2) return;

        points.forEach((point, index) => {
          if (index === points.length - 1) return;
          const next = points[index + 1];
          const dx = next.x - point.x;
          const dy = next.y - point.y;
          const segmentLength = Math.hypot(dx, dy);
          const normal = segmentLength ? { x: -dy / segmentLength, y: dx / segmentLength } : { x: 0, y: 0 };
          const bend = Math.min(72, segmentLength * 0.22) * (index % 2 === 0 ? 1 : -1);
          const control = {
            x: (point.x + next.x) / 2 + normal.x * bend,
            y: (point.y + next.y) / 2 + normal.y * bend,
          };
          const steps = Math.max(28, Math.ceil(segmentLength / 6));

          for (let i = 0; i <= steps; i++) {
            if (index > 0 && i === 0) continue;
            const t = i / steps;
            const mt = 1 - t;
            const sample = {
              x: mt * mt * point.x + 2 * mt * t * control.x + t * t * next.x,
              y: mt * mt * point.y + 2 * mt * t * control.y + t * t * next.y,
              angle: 0,
              distance: 0,
            };
            const previous = routeSamples[routeSamples.length - 1];
            if (previous) {
              const dist = Math.hypot(sample.x - previous.x, sample.y - previous.y);
              routeLength += dist;
              sample.distance = routeLength;
              sample.angle = Math.atan2(sample.y - previous.y, sample.x - previous.x);
            }
            routeSamples.push(sample);
          }
        });

        for (let i = 0; i < routeSamples.length - 1; i++) {
          const current = routeSamples[i];
          const next = routeSamples[i + 1];
          current.angle = Math.atan2(next.y - current.y, next.x - current.x);
        }
      }

      function drawRoute() {
        if (routeSamples.length < 2) return;

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.strokeStyle = "rgba(8, 40, 42, 0.24)";
        ctx.lineWidth = 10;
        ctx.setLineDash([1, 14]);
        ctx.beginPath();
        routeSamples.forEach((sample, index) => {
          if (index === 0) ctx.moveTo(sample.x, sample.y);
          else ctx.lineTo(sample.x, sample.y);
        });
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.shadowColor = "rgba(8, 21, 24, 0.18)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;
        ctx.strokeStyle = "rgba(255, 248, 228, 0.9)";
        ctx.lineWidth = 6.4;
        ctx.beginPath();
        routeSamples.forEach((sample, index) => {
          if (index === 0) ctx.moveTo(sample.x, sample.y);
          else ctx.lineTo(sample.x, sample.y);
        });
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.strokeStyle = "#c64024";
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        routeSamples.forEach((sample, index) => {
          if (index === 0) ctx.moveTo(sample.x, sample.y);
          else ctx.lineTo(sample.x, sample.y);
        });
        ctx.stroke();

        if (animation.playing) {
          drawActiveRoute(routeLength * animation.progress);
        }

        ctx.restore();
      }

      function drawActiveRoute(distance) {
        if (!routeSamples.length) return;
        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.shadowColor = "rgba(216, 155, 36, 0.5)";
        ctx.shadowBlur = 18;
        ctx.strokeStyle = "rgba(216, 155, 36, 0.96)";
        ctx.lineWidth = 7.5;
        ctx.beginPath();
        routeSamples.forEach((sample, index) => {
          if (sample.distance > distance) return;
          if (index === 0) ctx.moveTo(sample.x, sample.y);
          else ctx.lineTo(sample.x, sample.y);
        });
        const current = getRoutePoint(distance);
        ctx.lineTo(current.x, current.y);
        ctx.stroke();
        ctx.restore();
      }

      function drawPoints() {
        points.forEach((point, index) => {
          const isStart = index === 0;
          const isEnd = index === points.length - 1 && points.length > 1;
          ctx.save();
          ctx.shadowColor = "rgba(11, 31, 33, 0.26)";
          ctx.shadowBlur = 10;
          ctx.fillStyle = isStart ? "#08766f" : isEnd ? "#2a83a2" : "#c64024";
          ctx.strokeStyle = "#fff8e4";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(point.x, point.y, 11, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.fillStyle = "#fff8e4";
          ctx.font = "800 12px Avenir Next, PingFang SC, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(index + 1), point.x, point.y + 0.5);

          drawPointLabel(point.name, point.x, point.y);
          ctx.restore();
        });
      }

      function drawArrow() {
        if (!animation.playing || routeSamples.length < 2) return;
        const current = getRoutePoint(routeLength * animation.progress);
        const screen = worldToScreen(current);
        ctx.save();
        ctx.translate(screen.x, screen.y);
        ctx.rotate(current.angle);
        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 5;

        if (arrowImage && arrowImageLoaded) {
          ctx.drawImage(arrowImage, -20, -20, 40, 40);
        } else {
          ctx.fillStyle = "#d89b24";
          ctx.strokeStyle = "#fff8e4";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(20, 0);
          ctx.lineTo(-15, -15);
          ctx.lineTo(-7, 0);
          ctx.lineTo(-15, 15);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#c64024";
          ctx.beginPath();
          ctx.arc(-2, 0, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawFrame() {
        ctx.save();
        ctx.strokeStyle = "rgba(245, 239, 217, 0.22)";
        ctx.lineWidth = 2;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
        ctx.restore();
      }

      function drawHoverCityOnCanvas() {
        if (!hoverState.active || animation.playing || animation.recording) return;

        const rect = canvas.getBoundingClientRect();
        const dpr = canvas.width / rect.width || 1;
        const offset = 16 * dpr;
        const paddingX = 12 * dpr;
        const paddingY = 8 * dpr;
        const label = hoverState.name;

        ctx.save();
        ctx.font = `800 ${15 * dpr}px Avenir Next, PingFang SC, sans-serif`;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        const labelWidth = Math.ceil(ctx.measureText(label).width);
        const width = Math.max(116 * dpr, labelWidth + paddingX * 2);
        const height = 42 * dpr;
        let x = hoverState.canvasX + offset;
        let y = hoverState.canvasY + offset;

        if (x + width > canvas.width - 12 * dpr) x = hoverState.canvasX - width - offset;
        if (y + height > canvas.height - 12 * dpr) y = hoverState.canvasY - height - offset;
        x = Math.max(12 * dpr, x);
        y = Math.max(12 * dpr, y);

        ctx.shadowColor = "rgba(0, 0, 0, 0.28)";
        ctx.shadowBlur = 16 * dpr;
        ctx.shadowOffsetY = 5 * dpr;
        roundedRectPath(x, y, width, height, 8 * dpr);
        ctx.fillStyle = "rgba(255, 248, 228, 0.97)";
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        ctx.lineWidth = 1.5 * dpr;
        ctx.strokeStyle = "rgba(198, 64, 36, 0.48)";
        ctx.stroke();

        ctx.font = `800 ${11 * dpr}px Avenir Next, PingFang SC, sans-serif`;
        ctx.fillStyle = "rgba(114, 107, 88, 0.86)";
        ctx.fillText("当前城市", x + paddingX, y + paddingY + 4 * dpr);

        ctx.font = `800 ${15 * dpr}px Avenir Next, PingFang SC, sans-serif`;
        ctx.fillStyle = "#15251f";
        ctx.fillText(label, x + paddingX, y + height - paddingY - 5 * dpr);
        ctx.restore();
      }

      function render() {
        currentView = getView();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.setTransform(currentView.scale, 0, 0, currentView.scale, currentView.offsetX, currentView.offsetY);
        drawMap();
        drawRoute();
        drawPoints();
        ctx.restore();
        drawArrow();
        drawFrame();
        drawHoverCityOnCanvas();
      }

      function getRoutePoint(distance) {
        if (!routeSamples.length) return points[0] || { x: WORLD.width / 2, y: WORLD.height / 2, angle: 0 };
        const clamped = Math.max(0, Math.min(routeLength, distance));
        for (let i = 1; i < routeSamples.length; i++) {
          const previous = routeSamples[i - 1];
          const current = routeSamples[i];
          if (current.distance >= clamped) {
            const span = current.distance - previous.distance || 1;
            const t = (clamped - previous.distance) / span;
            return {
              x: previous.x + (current.x - previous.x) * t,
              y: previous.y + (current.y - previous.y) * t,
              angle: Math.atan2(current.y - previous.y, current.x - previous.x),
            };
          }
        }
        return routeSamples[routeSamples.length - 1];
      }

      function createPointId() {
        return window.crypto?.randomUUID ? window.crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      }

      function addPoint(worldPoint) {
        if (!isInsideChina(worldPoint)) {
          showToast("请在中国地图轮廓内打点。");
          return;
        }
        const geo = unproject(worldPoint.x, worldPoint.y);
        let pointWorld = worldPoint;
        let pointGeo = geo;
        let city = recognizeCity(pointGeo.lon, pointGeo.lat, pointWorld);
        let attractionCandidates = rankAttractions(pointGeo.lon, pointGeo.lat, pointWorld).slice(0, 12);
        const nearestAttraction = attractionCandidates[0];
        const useAttraction =
          nearestAttraction && (nearestAttraction.distanceKm <= 35 || nearestAttraction.mapDistance <= 8);

        if (useAttraction) {
          pointGeo = { lon: nearestAttraction.lon, lat: nearestAttraction.lat };
          pointWorld = project(nearestAttraction.lon, nearestAttraction.lat);
          city = recognizeCity(pointGeo.lon, pointGeo.lat, pointWorld);
          attractionCandidates = rankAttractions(pointGeo.lon, pointGeo.lat, pointWorld).slice(0, 12);
        }

        const selectedAttraction = useAttraction ? attractionCandidates[0] : null;
        const placeKind = selectedAttraction ? "attraction" : "city";
        const point = {
          id: createPointId(),
          x: pointWorld.x,
          y: pointWorld.y,
          lon: pointGeo.lon,
          lat: pointGeo.lat,
          name: selectedAttraction ? selectedAttraction.name : city.name,
          placeKind,
          city: city.name,
          cityDistanceKm: city.distanceKm,
          cityCandidates: city.candidates,
          attraction: selectedAttraction ? selectedAttraction.name : "",
          attractionDistanceKm: selectedAttraction ? selectedAttraction.distanceKm : nearestAttraction?.distanceKm,
          attractionCandidates,
        };
        points.push(point);
        buildRoute();
        renderList();
        requestRender();
        const placeText = placeKind === "attraction" ? `已添加景点 ${point.name}` : `已添加 ${point.name}`;
        setStatus(`${placeText}，所在城市 ${point.city}。右侧可改选附近景点或城市。`);
      }

      function addManualPoint(event) {
        event.preventDefault();
        if (animation.playing || animation.recording) {
          showToast("播放或导出过程中暂不支持添加点位。");
          return;
        }

        const name = manualNameInput.value.trim();
        const lon = Number(manualLonInput.value);
        const lat = Number(manualLatInput.value);
        if (!name) {
          showToast("请输入地点名称。");
          manualNameInput.focus();
          return;
        }
        if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
          showToast("请输入有效的经纬度。");
          return;
        }
        if (lon < GEO.minLon || lon > GEO.maxLon || lat < GEO.minLat || lat > GEO.maxLat) {
          showToast("经纬度超出当前中国地图范围。");
          return;
        }

        const worldPoint = project(lon, lat);
        if (!isOnChinaMap(worldPoint)) {
          showToast("该经纬度不在中国地图轮廓内。");
          return;
        }

        const city = recognizeCity(lon, lat, worldPoint);
        const attractionCandidates = rankAttractions(lon, lat, worldPoint).slice(0, 12);
        const nearestAttraction = attractionCandidates[0];
        const selectedSpot = isCurrentManualAttractionSelection() ? manualSelectedAttraction : null;
        const point = {
          id: createPointId(),
          x: worldPoint.x,
          y: worldPoint.y,
          lon,
          lat,
          name: selectedSpot ? selectedSpot.name : name,
          placeKind: selectedSpot ? "attraction" : "custom",
          city: city.name,
          cityDistanceKm: city.distanceKm,
          cityCandidates: city.candidates,
          attraction: selectedSpot ? selectedSpot.name : "",
          attractionDistanceKm: selectedSpot ? 0 : nearestAttraction?.distanceKm,
          attractionCandidates,
          ...(selectedSpot
            ? {}
            : {
                manualName: name,
                manualLon: lon,
                manualLat: lat,
                manualX: worldPoint.x,
                manualY: worldPoint.y,
              }),
        };
        points.push(point);
        buildRoute();
        renderList();
        requestRender();
        manualAddForm.reset();
        clearManualAttractionSelection();
        hideAttractionSuggestions();
        setStatus(
          selectedSpot
            ? `已添加景点 ${selectedSpot.name}，所在城市 ${city.name}。`
            : `已手动添加 ${name}，所在城市 ${city.name}。`,
        );
      }

      function renderList() {
        pointCount.textContent = `${points.length} 点`;
        emptyList.style.display = points.length ? "none" : "block";
        pointList.innerHTML = "";

        points.forEach((point, index) => {
          const item = document.createElement("li");
          item.className = "point-card";
          item.draggable = true;
          item.dataset.id = point.id;
          item.innerHTML = `
            <span class="drag-handle" title="拖动调整顺序"></span>
            <div>
              <div class="point-title">
                <span class="point-index">${index + 1}</span>
                <span class="point-name">${escapeHtml(point.name)}</span>
              </div>
              <div class="point-meta">
                <span class="place-kind ${
                  point.placeKind === "attraction" ? "attraction" : point.placeKind === "custom" ? "custom" : "city"
                }">${placeKindText(point)}</span>
                <span class="city-pill">所在 ${escapeHtml(point.city || point.name)}</span>
                <span>${formatLonLat(point.lon, point.lat)}</span>
                <span class="distance-text">${pointDistanceText(point)}</span>
                <select class="city-select" data-place-for="${point.id}" draggable="false" title="选择点位名称（景点/城市）">
                  ${candidateOptionsHtml(point)}
                </select>
              </div>
            </div>
            <button class="icon-button" type="button" title="删除该点" data-remove="${point.id}">×</button>
          `;
          item.addEventListener("dragstart", handleDragStart);
          item.addEventListener("dragover", handleDragOver);
          item.addEventListener("dragleave", clearDropStyles);
          item.addEventListener("drop", handleDrop);
          item.addEventListener("dragend", handleDragEnd);
          pointList.appendChild(item);
        });

        updateButtons();
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, (char) => {
          const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
          };
          return map[char];
        });
      }

      function handleDragStart(event) {
        draggedId = event.currentTarget.dataset.id;
        event.currentTarget.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", draggedId);
      }

      function handleDragOver(event) {
        event.preventDefault();
        const target = event.currentTarget;
        if (target.dataset.id === draggedId) return;
        clearDropStyles();
        const rect = target.getBoundingClientRect();
        dropPosition = event.clientY < rect.top + rect.height / 2 ? "before" : "after";
        target.classList.add(dropPosition === "before" ? "drop-before" : "drop-after");
      }

      function handleDrop(event) {
        event.preventDefault();
        const targetId = event.currentTarget.dataset.id;
        if (!draggedId || draggedId === targetId) return;
        const from = points.findIndex((point) => point.id === draggedId);
        const to = points.findIndex((point) => point.id === targetId);
        if (from < 0 || to < 0) return;
        const [moved] = points.splice(from, 1);
        const adjustedTo = points.findIndex((point) => point.id === targetId);
        points.splice(dropPosition === "before" ? adjustedTo : adjustedTo + 1, 0, moved);
        buildRoute();
        renderList();
        requestRender();
        setStatus("点位顺序已更新，路线会按新顺序穿行。");
      }

      function handleDragEnd() {
        draggedId = null;
        clearDropStyles();
      }

      function clearDropStyles() {
        document.querySelectorAll(".point-card").forEach((item) => {
          item.classList.remove("dragging", "drop-before", "drop-after");
        });
      }

      function removePoint(id) {
        points = points.filter((point) => point.id !== id);
        buildRoute();
        renderList();
        requestRender();
        setStatus(points.length ? "点位已删除。" : "点位已清空，点击地图重新添加。");
      }

      function updatePointPlace(id, optionValue) {
        const point = points.find((item) => item.id === id);
        if (!point) return;
        const { kind, name } = parsePlaceOptionValue(optionValue);

        if (kind === "attraction") {
          const spot = findAttractionByName(name);
          if (!spot) return;
          const spotWorld = project(spot.lon, spot.lat);
          const city = recognizeCity(spot.lon, spot.lat, spotWorld);
          const attractionCandidates = rankAttractions(spot.lon, spot.lat, spotWorld).slice(0, 12);

          point.x = spotWorld.x;
          point.y = spotWorld.y;
          point.lon = spot.lon;
          point.lat = spot.lat;
          point.name = spot.name;
          point.placeKind = "attraction";
          point.attraction = spot.name;
          point.attractionDistanceKm = 0;
          point.attractionCandidates = attractionCandidates;
          point.city = city.name;
          point.cityDistanceKm = city.distanceKm;
          point.cityCandidates = city.candidates;

          buildRoute();
          renderList();
          requestRender();
          setStatus(`已选择景点 ${spot.name}，点位已定位到该景点。`);
          return;
        }

        if (kind === "custom") {
          if (!point.manualName || !Number.isFinite(point.manualLon) || !Number.isFinite(point.manualLat)) return;

          const manualWorld = project(point.manualLon, point.manualLat);
          const city = recognizeCity(point.manualLon, point.manualLat, manualWorld);
          const attractionCandidates = rankAttractions(point.manualLon, point.manualLat, manualWorld).slice(0, 12);

          point.x = manualWorld.x;
          point.y = manualWorld.y;
          point.lon = point.manualLon;
          point.lat = point.manualLat;
          point.name = point.manualName;
          point.placeKind = "custom";
          point.city = city.name;
          point.cityDistanceKm = city.distanceKm;
          point.cityCandidates = city.candidates;
          point.attraction = "";
          point.attractionDistanceKm = attractionCandidates[0]?.distanceKm;
          point.attractionCandidates = attractionCandidates;

          buildRoute();
          renderList();
          requestRender();
          setStatus(`已切回手动地点 ${point.manualName}。`);
          return;
        }

        const city = findCityByName(name);
        if (!city) return;

        const distance = distanceKm(point.lon, point.lat, city.lon, city.lat);
        const ranked = rankCities(point.lon, point.lat, point);
        const candidates = ranked.slice(0, 10);
        if (!candidates.some((candidate) => candidate.name === city.name)) {
          candidates.unshift({
            name: city.name,
            lon: city.lon,
            lat: city.lat,
            mapDistance: 0,
            distanceKm: distance,
            score: -1,
          });
        }

        point.name = city.name;
        point.placeKind = "city";
        point.city = city.name;
        point.cityDistanceKm = distance;
        point.cityCandidates = candidates;
        point.attraction = "";
        renderList();
        requestRender();
        setStatus(`已将该点名称切换为城市 ${city.name}，${cityDistanceText(distance)}。`);
      }

      function updateButtons() {
        const enough = points.length >= 2;
        playBtn.disabled = !enough || animation.recording;
        exportBtn.disabled = !enough || animation.recording;
        clearBtn.disabled = !points.length || animation.recording;
        stopBtn.disabled = !animation.playing || animation.recording;
        updateMapZoomUI();
      }

      function setStatus(message) {
        statusLine.textContent = message;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function playRoute(options = {}) {
        if (points.length < 2) {
          showToast("至少需要 2 个点才能播放路线。");
          return Promise.resolve();
        }

        hideHoverCity();
        stopAnimation(false);
        buildRoute();
        mapStage.classList.add("playing");
        animation.playing = true;
        animation.recording = Boolean(options.recording);
        animation.progress = 0;
        animation.startTime = performance.now();
        recordState.textContent = animation.recording ? "录制中" : "播放中";
        setStatus(animation.recording ? "正在录制动画，请稍等。" : "镜头已放大并跟随箭头移动。");
        updateButtons();

        return new Promise((resolve) => {
          animation.resolve = resolve;
          animation.rafId = requestAnimationFrame(tick);
        });
      }

      function tick(now) {
        const duration = Number(durationRange.value) * 1000;
        animation.progress = Math.min(1, (now - animation.startTime) / duration);
        render();

        if (animation.progress < 1) {
          animation.rafId = requestAnimationFrame(tick);
          return;
        }

        const resolve = animation.resolve;
        animation.playing = false;
        mapStage.classList.remove("playing");
        recordState.textContent = animation.recording ? "录制完成" : "播放完成";
        setStatus(animation.recording ? "动画录制完成，正在生成文件。" : "路线播放完成。");
        updateButtons();
        if (resolve) resolve();
      }

      function stopAnimation(resetView = true) {
        cancelAnimationFrame(animation.rafId);
        animation.playing = false;
        animation.progress = 0;
        animation.resolve = null;
        mapStage.classList.remove("playing");
        if (!animation.recording) {
          recordState.textContent = points.length ? "待播放" : "待编辑";
        }
        updateButtons();
        if (resetView) render();
      }

      async function exportAnimation() {
        if (points.length < 2) {
          showToast("至少需要 2 个点才能导出动画。");
          return;
        }
        if (!canvas.captureStream || typeof MediaRecorder === "undefined") {
          showToast("当前浏览器不支持 Canvas 录制，请换用 Chrome 或 Edge。");
          return;
        }

        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? "video/webm;codecs=vp9"
          : "video/webm";
        exportChunks = [];
        const stream = canvas.captureStream(60);
        recorder = new MediaRecorder(stream, { mimeType });
        recorder.ondataavailable = (event) => {
          if (event.data && event.data.size) exportChunks.push(event.data);
        };
        recorder.onstop = () => {
          const blob = new Blob(exportChunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `china-route-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.webm`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          animation.recording = false;
          recordState.textContent = "已导出";
          setStatus("WebM 动画已导出。");
          updateButtons();
        };

        recorder.start();
        render();
        await playRoute({ recording: true });
        await new Promise((resolve) => window.setTimeout(resolve, 260));
        recorder.stop();
      }

      function loadDemoRoute() {
        stopAnimation();
        points = demoRoute.map(([name, lon, lat], index) => {
          const p = project(lon, lat);
          const city = recognizeCity(lon, lat, p);
          const spot = findAttractionByName(name);
          const attractionCandidates = rankAttractions(lon, lat, p).slice(0, 12);
          return {
            id: `demo-${index}-${Date.now()}`,
            x: p.x,
            y: p.y,
            lon,
            lat,
            name: spot ? spot.name : city.name || name,
            placeKind: spot ? "attraction" : "city",
            city: city.name || name,
            cityDistanceKm: city.distanceKm,
            cityCandidates: city.candidates,
            attraction: spot ? spot.name : "",
            attractionDistanceKm: spot ? 0 : attractionCandidates[0]?.distanceKm,
            attractionCandidates,
          };
        });
        buildRoute();
        renderList();
        requestRender();
        setStatus("已载入示例路线，可以直接播放、拖动排序或继续打点。");
      }

      function clearPoints() {
        stopAnimation();
        points = [];
        routeSamples = [];
        routeLength = 0;
        renderList();
        requestRender();
        setStatus("点位已清空，点击地图添加新的路线。");
      }

      canvas.addEventListener("click", (event) => {
        if (suppressNextClick) {
          suppressNextClick = false;
          return;
        }
        if (animation.playing || animation.recording) {
          showToast("播放或导出过程中暂不支持打点。");
          return;
        }
        const { worldPoint } = canvasEventToWorld(event);
        addPoint(worldPoint);
      });

      canvas.addEventListener("wheel", handleMapWheel, { passive: false });
      canvas.addEventListener("pointerdown", startMapPan);
      canvas.addEventListener("pointermove", moveMapPan);
      canvas.addEventListener("pointerup", endMapPan);
      canvas.addEventListener("pointercancel", endMapPan);
      canvas.addEventListener("pointermove", showHoverCity);
      canvas.addEventListener("pointerleave", hideHoverCity);
      canvas.addEventListener("mousemove", showHoverCity);
      canvas.addEventListener("mouseleave", hideHoverCity);
      manualAddForm.addEventListener("submit", addManualPoint);
      manualNameInput.addEventListener("input", () => {
        if (manualSelectedAttraction?.name !== manualNameInput.value.trim()) clearManualAttractionSelection();
        renderAttractionSuggestions();
      });
      manualNameInput.addEventListener("focus", renderAttractionSuggestions);
      manualNameInput.addEventListener("keydown", (event) => {
        if (event.key === "Escape") hideAttractionSuggestions();
      });
      manualLonInput.addEventListener("input", clearManualAttractionSelection);
      manualLatInput.addEventListener("input", clearManualAttractionSelection);
      attractionSuggestions.addEventListener("mousedown", (event) => {
        event.preventDefault();
      });
      attractionSuggestions.addEventListener("click", (event) => {
        const option = event.target.closest("[data-attraction-name]");
        if (option) chooseManualAttraction(option.dataset.attractionName);
      });
      document.addEventListener("click", (event) => {
        if (!manualAddForm.contains(event.target)) hideAttractionSuggestions();
      });

      pointList.addEventListener("click", (event) => {
        const removeId = event.target.dataset.remove;
        if (removeId) removePoint(removeId);
      });

      pointList.addEventListener("change", (event) => {
        const placePointId = event.target.dataset.placeFor;
        if (placePointId) updatePointPlace(placePointId, event.target.value);
      });

      pointList.addEventListener("mousedown", (event) => {
        if (event.target.classList.contains("city-select")) {
          event.stopPropagation();
        }
      });

      playBtn.addEventListener("click", () => playRoute());
      stopBtn.addEventListener("click", () => {
        animation.recording = false;
        stopAnimation();
        setStatus("播放已停止，镜头回到全图。");
      });
      exportBtn.addEventListener("click", exportAnimation);
      demoBtn.addEventListener("click", loadDemoRoute);
      clearBtn.addEventListener("click", clearPoints);
      resetViewBtn.addEventListener("click", () => {
        stopAnimation();
        resetMapCamera();
        setStatus("视图已回到全图。");
      });
      mapZoomInBtn.addEventListener("click", () => zoomMapBy(1.22));
      mapZoomOutBtn.addEventListener("click", () => zoomMapBy(1 / 1.22));
      mapZoomResetBtn.addEventListener("click", resetMapCamera);

      imageInput.addEventListener("change", (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            arrowImage = img;
            arrowImageLoaded = true;
            imageLabel.textContent = file.name;
            setStatus("移动箭头贴图已更新，播放时会以 40 × 40 显示。");
            requestRender();
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      durationRange.addEventListener("input", () => {
        durationValue.textContent = `${durationRange.value}s`;
      });

      zoomRange.addEventListener("input", () => {
        zoomValue.textContent = `${Number(zoomRange.value).toFixed(1)}x`;
        requestRender();
      });

      window.addEventListener("resize", resizeCanvas);

      computeDefaultView();
      resizeCanvas();
      renderList();
      render();
    </script>
  </body>
</html>
