<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中国地图轨迹路线图</title>
    <style>
      :root {
        --ink: #132322;
        --deep: #0e2024;
        --sea: #173940;
        --map: #dff0df;
        --map-edge: #6fa083;
        --paper: #f5efd9;
        --paper-2: #fbf8eb;
        --line: #d8cba7;
        --muted: #726b58;
        --text: #1c261f;
        --jade: #08766f;
        --red: #c64024;
        --amber: #d89b24;
        --blue: #2a83a2;
        --white: #ffffff;
        --shadow: rgba(7, 22, 24, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        color: var(--text);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(0deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(135deg, #10282c 0%, #0d191d 100%);
        background-size:
          36px 36px,
          36px 36px,
          auto;
        font-family:
          "Avenir Next", "Gill Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 376px;
        height: 100vh;
      }

      .map-stage {
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }

      .map-stage.playing canvas {
        cursor: default;
      }

      .map-stage.zoomed canvas {
        cursor: grab;
      }

      .map-stage.panning canvas {
        cursor: grabbing;
      }

      .brand-strip {
        position: absolute;
        top: 22px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid rgba(223, 240, 223, 0.2);
        border-radius: 8px;
        color: rgba(248, 246, 232, 0.94);
        background: rgba(12, 29, 31, 0.72);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
        backdrop-filter: blur(14px);
        pointer-events: none;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border: 1px solid rgba(232, 192, 92, 0.7);
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--amber);
        font-size: 18px;
      }

      .brand-strip strong {
        display: block;
        margin-bottom: 2px;
        font-family: "Songti SC", "STSong", serif;
        font-size: 18px;
        font-weight: 700;
      }

      .brand-strip span {
        display: block;
        color: rgba(248, 246, 232, 0.68);
        font-size: 12px;
      }

      .toast {
        position: absolute;
        left: 24px;
        bottom: 22px;
        max-width: min(520px, calc(100% - 48px));
        padding: 10px 14px;
        border: 1px solid rgba(245, 239, 217, 0.16);
        border-radius: 8px;
        color: var(--paper-2);
        background: rgba(8, 21, 24, 0.78);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        pointer-events: none;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .hover-city {
        position: absolute;
        z-index: 6;
        min-width: 112px;
        padding: 9px 11px;
        border: 1px solid rgba(198, 64, 36, 0.36);
        border-radius: 8px;
        color: #15251f;
        background: rgba(255, 248, 228, 0.96);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.24);
        opacity: 0;
        transform: translate(-9999px, -9999px);
        transition: opacity 90ms ease;
        pointer-events: none;
      }

      .hover-city.show {
        opacity: 1;
      }

      .hover-city span {
        display: block;
        margin-bottom: 2px;
        color: rgba(114, 107, 88, 0.86);
        font-size: 11px;
        font-weight: 800;
      }

      .hover-city strong {
        display: block;
        color: #15251f;
        font-size: 15px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .map-zoom-controls {
        position: absolute;
        left: 24px;
        bottom: 22px;
        z-index: 5;
        display: grid;
        grid-template-columns: 38px 38px 38px;
        gap: 7px;
        padding: 8px;
        border: 1px solid rgba(245, 239, 217, 0.16);
        border-radius: 8px;
        background: rgba(8, 21, 24, 0.76);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(14px);
      }

      .map-zoom-controls button {
        width: 38px;
        height: 38px;
        min-height: 38px;
        padding: 0;
        border-color: rgba(245, 239, 217, 0.16);
        color: var(--paper-2);
        background: rgba(255, 255, 255, 0.08);
        font-size: 18px;
        font-weight: 900;
      }

      .map-zoom-controls button:hover {
        border-color: rgba(216, 155, 36, 0.72);
        background: rgba(216, 155, 36, 0.18);
      }

      .map-zoom-value {
        grid-column: 1 / -1;
        color: rgba(245, 239, 217, 0.76);
        font-size: 11px;
        font-weight: 800;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .side-panel {
        min-width: 0;
        border-left: 1px solid rgba(255, 255, 255, 0.14);
        background:
          linear-gradient(90deg, rgba(198, 64, 36, 0.08), transparent 72px),
          var(--paper);
        box-shadow: -18px 0 42px rgba(0, 0, 0, 0.28);
        overflow: auto;
      }

      .panel-inner {
        min-height: 100%;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-family: "Songti SC", "STSong", serif;
        font-size: 28px;
        line-height: 1.12;
        color: #18241d;
      }

      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .badge {
        flex: none;
        padding: 7px 9px;
        border-radius: 999px;
        border: 1px solid rgba(8, 118, 111, 0.28);
        color: var(--jade);
        background: rgba(8, 118, 111, 0.08);
        font-size: 12px;
        font-weight: 700;
      }

      .tool-block {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.45);
        overflow: hidden;
      }

      .tool-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 11px 12px;
        border-bottom: 1px solid rgba(216, 203, 167, 0.75);
        color: #354136;
        font-size: 13px;
        font-weight: 800;
      }

      .tool-body {
        padding: 12px;
      }

      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .button-row {
        display: flex;
        gap: 8px;
      }

      button,
      .file-button {
        min-height: 38px;
        border: 1px solid rgba(33, 47, 39, 0.18);
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 12px;
        color: #203027;
        background: rgba(255, 255, 255, 0.62);
        cursor: pointer;
        transition:
          transform 140ms ease,
          box-shadow 140ms ease,
          border-color 140ms ease,
          background 140ms ease;
      }

      button:hover,
      .file-button:hover {
        border-color: rgba(8, 118, 111, 0.5);
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 8px 18px rgba(35, 55, 47, 0.1);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
        transform: none;
        box-shadow: none;
      }

      .primary {
        border-color: rgba(8, 118, 111, 0.72);
        color: #fffaf0;
        background: linear-gradient(180deg, #0b897f, #08716b);
      }

      .primary:hover {
        background: linear-gradient(180deg, #0b958a, #086a65);
      }

      .danger {
        color: #fffaf0;
        border-color: rgba(198, 64, 36, 0.72);
        background: linear-gradient(180deg, #d84b2a, #bd381d);
      }

      .quiet {
        min-width: 38px;
        padding: 0 10px;
      }

      .file-button {
        width: 100%;
        font-size: 13px;
      }

      input[type="file"] {
        display: none;
      }

      .control-grid {
        display: grid;
        gap: 12px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #3e493f;
        font-size: 12px;
        font-weight: 800;
      }

      .field output {
        color: var(--red);
        font-variant-numeric: tabular-nums;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--jade);
      }

      .status-line {
        min-height: 20px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .point-list {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: min(43vh, 420px);
        overflow: auto;
      }

      .manual-add {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.9fr) minmax(0, 0.9fr) auto;
        gap: 7px;
        margin-bottom: 10px;
        padding: 9px;
        border: 1px solid rgba(87, 75, 45, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);
      }

      .manual-name-field {
        position: relative;
        min-width: 0;
      }

      .manual-add input {
        width: 100%;
        min-width: 0;
        min-height: 34px;
        border: 1px solid rgba(33, 47, 39, 0.16);
        border-radius: 8px;
        padding: 0 9px;
        color: #25342b;
        background: rgba(255, 255, 255, 0.82);
        outline: none;
        font-size: 12px;
      }

      .manual-add input:focus {
        border-color: rgba(8, 118, 111, 0.66);
        box-shadow: 0 0 0 3px rgba(8, 118, 111, 0.1);
      }

      .manual-add > button {
        min-width: 50px;
        min-height: 34px;
        padding: 0 10px;
        font-size: 12px;
        font-weight: 900;
      }

      .attraction-suggestions {
        position: absolute;
        top: calc(100% + 7px);
        left: 0;
        z-index: 40;
        display: none;
        width: min(292px, calc(100vw - 40px));
        max-height: 238px;
        overflow: auto;
        padding: 5px;
        border: 1px solid rgba(33, 47, 39, 0.14);
        border-radius: 8px;
        background: rgba(255, 253, 244, 0.98);
        box-shadow: 0 18px 42px rgba(25, 40, 35, 0.18);
      }

      .attraction-suggestions.show {
        display: grid;
        gap: 4px;
      }

      .attraction-suggestion {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
        width: 100%;
        min-height: 38px;
        border: 0;
        border-radius: 7px;
        padding: 6px 7px;
        color: #213027;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .attraction-suggestion:hover,
      .attraction-suggestion:focus-visible {
        background: rgba(216, 155, 36, 0.14);
        outline: none;
      }

      .suggestion-name {
        overflow: hidden;
        font-size: 12px;
        font-weight: 900;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestion-meta {
        color: var(--muted);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .point-card {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) 34px;
        align-items: center;
        gap: 9px;
        min-height: 62px;
        border: 1px solid rgba(87, 75, 45, 0.16);
        border-radius: 8px;
        padding: 8px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 8px 18px rgba(88, 75, 45, 0.06);
      }

      .point-card.dragging {
        opacity: 0.42;
      }

      .point-card.drop-before {
        border-top-color: var(--red);
        box-shadow: inset 0 3px 0 var(--red);
      }

      .point-card.drop-after {
        border-bottom-color: var(--red);
        box-shadow: inset 0 -3px 0 var(--red);
      }

      .drag-handle {
        width: 32px;
        height: 42px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: rgba(28, 38, 31, 0.62);
        background:
          radial-gradient(circle, currentColor 1.4px, transparent 1.6px) 7px 9px / 8px
            8px;
        cursor: grab;
      }

      .point-card:active .drag-handle {
        cursor: grabbing;
      }

      .point-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .point-index {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--red);
        font-size: 12px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .point-name {
        min-width: 0;
        color: #1c261f;
        font-size: 14px;
        font-weight: 800;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .point-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 7px;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .city-pill {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 0 7px;
        border: 1px solid rgba(8, 118, 111, 0.26);
        border-radius: 999px;
        color: var(--jade);
        background: rgba(8, 118, 111, 0.08);
        font-weight: 800;
      }

      .place-kind {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 0 7px;
        border: 1px solid rgba(216, 155, 36, 0.36);
        border-radius: 999px;
        color: #8a4f12;
        background: rgba(216, 155, 36, 0.12);
        font-weight: 900;
      }

      .place-kind.city {
        border-color: rgba(8, 118, 111, 0.22);
        color: var(--jade);
        background: rgba(8, 118, 111, 0.08);
      }

      .place-kind.custom {
        border-color: rgba(198, 64, 36, 0.26);
        color: var(--red);
        background: rgba(198, 64, 36, 0.08);
      }

      .distance-text {
        color: rgba(114, 107, 88, 0.82);
      }

      .city-select {
        grid-column: 1 / -1;
        width: 100%;
        min-height: 32px;
        border: 1px solid rgba(33, 47, 39, 0.16);
        border-radius: 8px;
        padding: 0 8px;
        color: #25342b;
        background: rgba(255, 255, 255, 0.78);
        outline: none;
        cursor: pointer;
      }

      .city-select:focus {
        border-color: rgba(8, 118, 111, 0.66);
        box-shadow: 0 0 0 3px rgba(8, 118, 111, 0.1);
      }

      .icon-button {
        width: 34px;
        height: 34px;
        min-height: 34px;
        padding: 0;
        color: #6e2d20;
      }

      .empty-list {
        border: 1px dashed rgba(87, 75, 45, 0.28);
        border-radius: 8px;
        padding: 18px 12px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.44);
        text-align: center;
        font-size: 13px;
        line-height: 1.7;
      }

      .legend {
        display: grid;
        gap: 9px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .swatch {
        width: 28px;
        height: 3px;
        border-radius: 999px;
        background: var(--red);
      }

      .swatch.map {
        height: 12px;
        border: 1px solid var(--map-edge);
        background: var(--map);
      }

      .swatch.arrow {
        width: 16px;
        height: 16px;
        clip-path: polygon(0 20%, 100% 50%, 0 80%, 28% 50%);
        background: var(--amber);
      }

      .swatch.attraction {
        position: relative;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(92, 55, 16, 0.34);
        border-radius: 50%;
        background: #d99a24;
        box-shadow: inset 0 0 0 2px rgba(255, 248, 228, 0.82);
      }

      .swatch.attraction::after {
        content: "";
        position: absolute;
        inset: 4px;
        clip-path: polygon(50% 0, 62% 36%, 100% 36%, 69% 58%, 82% 96%, 50% 72%, 18% 96%, 31% 58%, 0 36%, 38% 36%);
        background: #fff7db;
      }

      @media (max-width: 920px) {
        body {
          overflow: auto;
        }

        .app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(420px, 58vh) auto;
          height: auto;
          min-height: 100vh;
        }

        .side-panel {
          border-left: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.14);
        }

        .panel-inner {
          min-height: 0;
        }

        .manual-add {
          grid-template-columns: 1fr 1fr;
        }

        .brand-strip {
          top: 12px;
          left: 12px;
        }

        .point-list {
          max-height: none;
        }
      }

      @media (max-width: 560px) {
        .panel-inner {
          padding: 16px;
        }

        .button-grid {
          grid-template-columns: 1fr;
        }

        .title-row {
          display: block;
        }

        .badge {
          display: inline-flex;
          margin-top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="map-stage" id="mapStage">
        <canvas id="mapCanvas" aria-label="中国地图轨迹编辑画布"></canvas>
        <div class="brand-strip" aria-hidden="true">
          <div class="brand-mark">⌖</div>
          <div>
            <strong>Route Atlas</strong>
            <span>点击地图打点，播放镜头跟随轨迹</span>
          </div>
        </div>
        <div class="hover-city" id="hoverCity" aria-hidden="true">
          <span>当前城市</span>
          <strong id="hoverCityName">--</strong>
        </div>
        <div class="map-zoom-controls" aria-label="地图缩放控件">
          <button id="mapZoomOutBtn" type="button" title="缩小地图">−</button>
          <button id="mapZoomResetBtn" type="button" title="回到全图">⌂</button>
          <button id="mapZoomInBtn" type="button" title="放大地图">+</button>
          <span class="map-zoom-value" id="mapZoomValue">100%</span>
        </div>
        <div class="toast" id="toast"></div>
      </main>

      <aside class="side-panel">
        <div class="panel-inner">
          <div class="title-row">
            <div>
              <h1>中国地图轨迹路线图</h1>
              <p class="subtitle">在地图上依次打点，系统会识别最近城市，右侧可拖动调整路线顺序。</p>
            </div>
            <span class="badge" id="pointCount">0 点</span>
          </div>

          <section class="tool-block">
            <div class="tool-head">
              <span>播放与导出</span>
              <span id="recordState">待编辑</span>
            </div>
            <div class="tool-body">
              <div class="button-grid">
                <button class="primary" id="playBtn" title="播放路线动画">
                  <span>▶</span>
                  <span>播放路线</span>
                </button>
                <button id="stopBtn" title="停止并回到全图">
                  <span>■</span>
                  <span>停止</span>
                </button>
                <button class="danger" id="exportBtn" title="录制并导出 WebM 动画">
                  <span>⇣</span>
                  <span>一键导出</span>
                </button>
                <button id="demoBtn" title="载入一条示例路线">
                  <span>⌁</span>
                  <span>示例路线</span>
                </button>
              </div>
              <div class="status-line" id="statusLine">点击中国地图区域添加第一个点。</div>
            </div>
          </section>

          <section class="tool-block">
            <div class="tool-head">
              <span>移动箭头</span>
              <span>40 × 40</span>
            </div>
            <div class="tool-body">
              <label class="file-button" for="imageInput" title="上传移动箭头贴图">
                <span>⬆</span>
                <span id="imageLabel">上传贴图替换箭头</span>
              </label>
              <input id="imageInput" type="file" accept="image/*" />
            </div>
          </section>

          <section class="tool-block">
            <div class="tool-head">
              <span>动画参数</span>
              <button class="quiet" id="resetViewBtn" title="回到全图">↺</button>
            </div>
            <div class="tool-body control-grid">
              <div class="field">
                <label for="durationRange">
                  <span>行程时长</span>
                  <output id="durationValue">10s</output>
                </label>
                <input id="durationRange" type="range" min="5" max="24" value="10" step="1" />
              </div>
              <div class="field">
                <label for="zoomRange">
                  <span>跟随镜头放大</span>
                  <output id="zoomValue">1.8x</output>
                </label>

            <div class="tool-body">

                <div class="manual-name-field">
                  <input

                </div>

    <script src="./map-data.js"></script>
    <script>
      const canvas = document.getElementById("mapCanvas");
      const ctx = canvas.getContext("2d");
      const mapStage = document.getElementById("mapStage");
      const pointList = document.getElementById("pointList");
      const emptyList = document.getElementById("emptyList");
      const manualAddForm = document.getElementById("manualAddForm");
      const manualNameInput = document.getElementById("manualNameInput");
      const manualLonInput = document.getElementById("manualLonInput");
      const manualLatInput = document.getElementById("manualLatInput");
      const attractionSuggestions = document.getElementById("attractionSuggestions");
      const pointCount = document.getElementById("pointCount");
      const statusLine = document.getElementById("statusLine");
      const recordState = document.getElementById("recordState");
      const toast = document.getElementById("toast");
      const hoverCity = document.getElementById("hoverCity");
      const hoverCityName = document.getElementById("hoverCityName");
      const mapZoomInBtn = document.getElementById("mapZoomInBtn");
      const mapZoomOutBtn = document.getElementById("mapZoomOutBtn");
      const mapZoomResetBtn = document.getElementById("mapZoomResetBtn");
      const mapZoomValue = document.getElementById("mapZoomValue");
      const playBtn = document.getElementById("playBtn");
      const stopBtn = document.getElementById("stopBtn");
      const exportBtn = document.getElementById("exportBtn");
      const demoBtn = document.getElementById("demoBtn");
      const clearBtn = document.getElementById("clearBtn");
      const resetViewBtn = document.getElementById("resetViewBtn");
      const imageInput = document.getElementById("imageInput");
      const imageLabel = document.getElementById("imageLabel");
      const durationRange = document.getElementById("durationRange");
      const durationValue = document.getElementById("durationValue");
      const zoomRange = document.getElementById("zoomRange");
      const zoomValue = document.getElementById("zoomValue");

      const WORLD = { width: 1000, height: 680 };
      const GEO = {
        minLon: 73,
        maxLon: 135,
        minLat: 17,
        maxLat: 54,
      };
      const MAP_BOX = { x: 58, y: 58, width: 884, height: 560 };

      const mapRouteData = window.mapRouteData;
      if (!mapRouteData) {
        throw new Error("地图数据文件 map-data.js 未加载");
      }
      const {
        mainland,
        hainan,
        taiwan,
        provinceLines,
        attractionMarks,
        cityLookup,
        demoRoute,
      } = mapRouteData;

      let points = [];
      let routeSamples = [];
      let routeLength = 0;
      let currentView = { scale: 1, offsetX: 0, offsetY: 0 };
      let defaultView = { scale: 1, offsetX: 0, offsetY: 0 };
      let mapCamera = { zoom: 1, panX: 0, panY: 0 };
      let panState = {
        active: false,
        moved: false,
        startX: 0,
        startY: 0,
        panX: 0,
        panY: 0,
      };
      let suppressNextClick = false;
      let toastTimer = 0;
      let draggedId = null;
      let dropPosition = "after";
      let arrowImage = null;
      let arrowImageLoaded = false;
      let recorder = null;
      let exportChunks = [];
      let cityBoundaryPath = null;
      let cityBoundaryCells = new Map();
      let manualSelectedAttraction = null;
      let hoverState = {
        active: false,
        name: "",
        canvasX: 0,
        canvasY: 0,
      };

      const animation = {
        playing: false,
        recording: false,
        startTime: 0,
        progress: 0,
        rafId: 0,
        resolve: null,
      };

      function project(lon, lat) {
        return {
          x: MAP_BOX.x + ((lon - GEO.minLon) / (GEO.maxLon - GEO.minLon)) * MAP_BOX.width,
          y: MAP_BOX.y + ((GEO.maxLat - lat) / (GEO.maxLat - GEO.minLat)) * MAP_BOX.height,
          lon,
          lat,
        };
      }

      function unproject(x, y) {
        return {
          lon: GEO.minLon + ((x - MAP_BOX.x) / MAP_BOX.width) * (GEO.maxLon - GEO.minLon),
          lat: GEO.maxLat - ((y - MAP_BOX.y) / MAP_BOX.height) * (GEO.maxLat - GEO.minLat),
        };
      }

      function pointsFromGeo(list) {
        return list.map(([lon, lat]) => project(lon, lat));
      }

      function makePath(list) {
        const path = new Path2D();
        list.forEach(([lon, lat], index) => {
          const p = project(lon, lat);
          if (index === 0) {
            path.moveTo(p.x, p.y);
          } else {
            path.lineTo(p.x, p.y);
          }
        });
        path.closePath();
        return path;
      }

      function pointInPolygon(point, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const pi = project(polygon[i][0], polygon[i][1]);
          const pj = project(polygon[j][0], polygon[j][1]);
          const intersects =
            pi.y > point.y !== pj.y > point.y &&
            point.x < ((pj.x - pi.x) * (point.y - pi.y)) / (pj.y - pi.y) + pi.x;
          if (intersects) inside = !inside;
        }
        return inside;
      }

      function distanceToSegment(point, start, end) {
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const lengthSquared = dx * dx + dy * dy;
        if (!lengthSquared) return Math.hypot(point.x - start.x, point.y - start.y);
        const t = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSquared));
        return Math.hypot(point.x - (start.x + dx * t), point.y - (start.y + dy * t));
      }

      function distanceToPolygonEdge(point, polygon) {
        let minDistance = Infinity;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const start = project(polygon[j][0], polygon[j][1]);
          const end = project(polygon[i][0], polygon[i][1]);
          minDistance = Math.min(minDistance, distanceToSegment(point, start, end));
        }
        return minDistance;
      }

      function isInsideChina(point) {
        if (pointInPolygon(point, mainland)) return true;
        if (pointInPolygon(point, hainan)) return true;
        if (pointInPolygon(point, taiwan)) return true;
        return false;
      }

      function isOnChinaMap(point) {
        if (isInsideChina(point)) return true;
        const edgeTolerance = 9;
        return [mainland, hainan, taiwan].some((polygon) => distanceToPolygonEdge(point, polygon) <= edgeTolerance);
      }

      function formatLonLat(lon, lat) {
        const lonText = `${Math.abs(lon).toFixed(2)}°${lon >= 0 ? "E" : "W"}`;
        const latText = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? "N" : "S"}`;
        return `${lonText} / ${latText}`;
      }

      function distanceKm(lonA, latA, lonB, latB) {
        const earthRadius = 6371;
        const toRad = (value) => (value * Math.PI) / 180;
        const dLat = toRad(latB - latA);
        const dLon = toRad(lonB - lonA);
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(latA)) * Math.cos(toRad(latB)) * Math.sin(dLon / 2) ** 2;
        return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function rankCities(lon, lat, worldPoint) {
        const referencePoint = worldPoint || project(lon, lat);
        return cityLookup
          .map((city) => {
            const cityPoint = project(city.lon, city.lat);
            const mapDistance = Math.hypot(cityPoint.x - referencePoint.x, cityPoint.y - referencePoint.y);
            const realDistanceKm = distanceKm(lon, lat, city.lon, city.lat);
            return {
              name: city.name,
              lon: city.lon,
              lat: city.lat,
              mapDistance,
              distanceKm: realDistanceKm,
              score: mapDistance + realDistanceKm / 8,
            };
          })
          .sort((a, b) => a.score - b.score);
      }

      function rankAttractions(lon, lat, worldPoint) {
        const referencePoint = worldPoint || project(lon, lat);
        return attractionMarks
          .map((spot) => {
            const spotPoint = project(spot.lon, spot.lat);
            const mapDistance = Math.hypot(spotPoint.x - referencePoint.x, spotPoint.y - referencePoint.y);
            const realDistanceKm = distanceKm(lon, lat, spot.lon, spot.lat);
            return {
              ...spot,
              mapDistance,
              distanceKm: realDistanceKm,
              score: mapDistance + realDistanceKm / 8,
            };
          })
          .sort((a, b) => a.score - b.score);
      }

      function recognizeCity(lon, lat, worldPoint) {
        const ranked = rankCities(lon, lat, worldPoint);
        const best = ranked[0];
        return {
          name: best ? best.name : `站点 ${String(points.length + 1).padStart(2, "0")}`,
          distanceKm: best ? best.distanceKm : Infinity,
          candidates: ranked.slice(0, 10),
        };
      }

      function findCityByName(name) {
        return cityLookup.find((city) => city.name === name);
      }

      function findAttractionByName(name) {
        return attractionMarks.find((spot) => spot.name === name || (spot.aliases || []).includes(name));
      }

      function normalizeSearchText(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, "");
      }

      function isSubsequence(needle, haystack) {
        let index = 0;
        for (const char of haystack) {
          if (char === needle[index]) index++;
          if (index >= needle.length) return true;
        }
        return false;
      }

      function attractionSearchScore(spot, query) {
        const name = normalizeSearchText(spot.name);
        const province = normalizeSearchText(spot.province || "");
        const aliases = (spot.aliases || []).map(normalizeSearchText).filter(Boolean);
        const terms = [name, `${province}${name}`, ...aliases, ...aliases.map((alias) => `${province}${alias}`)];
        if (!query) return Infinity;
        return terms.reduce((bestScore, term, index) => {
          const aliasPenalty = index >= 2 ? 0.35 : 0;
          let score = Infinity;
          if (term === query) score = aliasPenalty;
          else if (term.startsWith(query)) score = 1 + aliasPenalty;
          else if (term.includes(query)) score = 2 + aliasPenalty + term.indexOf(query) / 100;
          else if (isSubsequence(query, term)) score = 5 + aliasPenalty + term.length / 100;
          return Math.min(bestScore, score);
        }, Infinity);
      }

      function fuzzyFindAttractions(value, limit = 8) {
        const query = normalizeSearchText(value);
        if (!query) return [];
        return attractionMarks
          .map((spot) => ({ spot, score: attractionSearchScore(spot, query) }))
          .filter((item) => Number.isFinite(item.score))
          .sort((a, b) => a.score - b.score || a.spot.name.length - b.spot.name.length)
          .slice(0, limit)
          .map((item) => item.spot);
      }

      function coordinateInputValue(value) {
        return Number(value).toFixed(6).replace(/\.?0+$/, "");
      }

      function clearManualAttractionSelection() {
        manualSelectedAttraction = null;
      }

      function hideAttractionSuggestions() {
        attractionSuggestions.classList.remove("show");
        attractionSuggestions.innerHTML = "";
        manualNameInput.setAttribute("aria-expanded", "false");
      }

      function renderAttractionSuggestions() {
        const matches = fuzzyFindAttractions(manualNameInput.value, 8);
        if (!matches.length) {
          hideAttractionSuggestions();
          return;
        }

        attractionSuggestions.innerHTML = matches
          .map((spot) => {
            const lonLat = formatLonLat(spot.lon, spot.lat);
            return `
              <button class="attraction-suggestion" type="button" role="option" data-attraction-name="${escapeHtml(spot.name)}">
                <span class="suggestion-name">${escapeHtml(spot.name)}</span>
                <span class="suggestion-meta">${escapeHtml(spot.province || "")} · ${lonLat}</span>
              </button>
            `;
          })
          .join("");
        attractionSuggestions.classList.add("show");
        manualNameInput.setAttribute("aria-expanded", "true");
      }

      function chooseManualAttraction(name) {
        const spot = findAttractionByName(name);
        if (!spot) return;
        manualSelectedAttraction = spot;
        manualNameInput.value = spot.name;
        manualLonInput.value = coordinateInputValue(spot.lon);
        manualLatInput.value = coordinateInputValue(spot.lat);
        hideAttractionSuggestions();
        setStatus(`已选择景点 ${spot.name}，经纬度已自动填入。`);
      }

      function isCurrentManualAttractionSelection() {
        if (!manualSelectedAttraction) return false;
        const lon = Number(manualLonInput.value);
        const lat = Number(manualLatInput.value);
        return (
          manualNameInput.value.trim() === manualSelectedAttraction.name &&
          Math.abs(lon - manualSelectedAttraction.lon) < 0.000001 &&
          Math.abs(lat - manualSelectedAttraction.lat) < 0.000001
        );
      }

      function cityDistanceText(distance) {
        if (!Number.isFinite(distance)) return "城市识别仅供参考";
        const rounded = Math.max(1, Math.round(distance));
        return `距中心约 ${rounded}km`;
      }

      function attractionDistanceText(distance) {
        if (!Number.isFinite(distance)) return "距景点未知";
        if (distance < 1) return "已定位景点";
        const rounded = Math.max(1, Math.round(distance));
        return `距景点约 ${rounded}km`;
      }

      function placeOptionValue(kind, name) {
        return `${kind}::${name}`;
      }

      function parsePlaceOptionValue(value) {
        const separatorIndex = value.indexOf("::");
        if (separatorIndex < 0) return { kind: "city", name: value };
        return {
          kind: value.slice(0, separatorIndex),
          name: value.slice(separatorIndex + 2),
        };
      }

      function optionHtml(kind, name, label, selectedValue) {
        const value = placeOptionValue(kind, name);
        const selected = value === selectedValue ? " selected" : "";
        return `<option value="${escapeHtml(value)}"${selected}>${escapeHtml(label)}</option>`;
      }

      function candidateOptionsHtml(point) {
        const selectedValue = placeOptionValue(point.placeKind || "city", point.name);
        const customOptions = point.manualName
          ? [optionHtml("custom", point.manualName, `手动 · ${point.manualName}`, selectedValue)]
          : [];
        const nearbyAttractionNames = new Set();
        const nearbyAttractions = (point.attractionCandidates || []).slice(0, 12).map((spot, index) => {
          nearbyAttractionNames.add(spot.name);
          const label = `附近景点 ${index + 1} · ${spot.name} · ${spot.province} · ${attractionDistanceText(spot.distanceKm)}`;
          return optionHtml("attraction", spot.name, label, selectedValue);
        });

        const allAttractions = attractionMarks
          .filter((spot) => !nearbyAttractionNames.has(spot.name))
          .map((spot) => optionHtml("attraction", spot.name, `${spot.province} · ${spot.name}`, selectedValue));

        const nearbyCityNames = new Set();
        const nearbyCities = (point.cityCandidates || []).slice(0, 10).map((city, index) => {
          nearbyCityNames.add(city.name);
          const label = `附近城市 ${index + 1} · ${city.name} · ${cityDistanceText(city.distanceKm)}`;
          return optionHtml("city", city.name, label, selectedValue);
        });

        const allCities = cityLookup
          .filter((city) => !nearbyCityNames.has(city.name))
          .map((city) => optionHtml("city", city.name, city.name, selectedValue));

        return [
          customOptions.length ? `<optgroup label="手动输入">${customOptions.join("")}</optgroup>` : "",
          `<optgroup label="附近景点">${nearbyAttractions.join("")}</optgroup>`,
          `<optgroup label="全部景点">${allAttractions.join("")}</optgroup>`,
          `<optgroup label="附近城市">${nearbyCities.join("")}</optgroup>`,
          `<optgroup label="完整城市库">${allCities.join("")}</optgroup>`,
        ].join("");
      }

      function placeKindText(point) {
        if (point.placeKind === "attraction") return "景点";
        if (point.placeKind === "custom") return "手动";
        return "城市";
      }

      function pointDistanceText(point) {
        if (point.placeKind === "attraction") return attractionDistanceText(point.attractionDistanceKm);
        if (point.placeKind === "custom") return "手动经纬度";
        return cityDistanceText(point.cityDistanceKm);
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const width = Math.max(320, Math.floor(rect.width * dpr));
        const height = Math.max(320, Math.floor(rect.height * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        computeDefaultView();
        clampMapCamera();
        updateMapZoomUI();
        requestRender();
      }

      function computeDefaultView() {
        const padding = 54;
        const scale = Math.min(
          (canvas.width - padding * 2) / WORLD.width,
          (canvas.height - padding * 2) / WORLD.height,
        );
        defaultView = {
          scale,
          offsetX: (canvas.width - WORLD.width * scale) / 2,
          offsetY: (canvas.height - WORLD.height * scale) / 2,
        };
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function clampMapCamera() {
        mapCamera.zoom = clamp(mapCamera.zoom, 1, 4.2);
        if (mapCamera.zoom <= 1.0001) {
          mapCamera.zoom = 1;
          mapCamera.panX = 0;
          mapCamera.panY = 0;
          return;
        }

        const scale = defaultView.scale * mapCamera.zoom;
        const margin = 86;
        const mapWidth = WORLD.width * scale;
        const mapHeight = WORLD.height * scale;
        const offsetX = defaultView.offsetX + mapCamera.panX;
        const offsetY = defaultView.offsetY + mapCamera.panY;
        const minOffsetX = canvas.width - mapWidth - margin;
        const maxOffsetX = margin;
        const minOffsetY = canvas.height - mapHeight - margin;
        const maxOffsetY = margin;

        mapCamera.panX = clamp(offsetX, minOffsetX, maxOffsetX) - defaultView.offsetX;
        mapCamera.panY = clamp(offsetY, minOffsetY, maxOffsetY) - defaultView.offsetY;
      }

      function getManualView() {
        clampMapCamera();
        return {
          scale: defaultView.scale * mapCamera.zoom,
          offsetX: defaultView.offsetX + mapCamera.panX,
          offsetY: defaultView.offsetY + mapCamera.panY,
        };
      }

      function updateMapZoomUI() {
        mapZoomValue.textContent = `${Math.round(mapCamera.zoom * 100)}%`;
        mapStage.classList.toggle("zoomed", mapCamera.zoom > 1.0001 && !animation.playing && !animation.recording);
        mapZoomOutBtn.disabled = mapCamera.zoom <= 1.0001 || animation.playing || animation.recording;
        mapZoomInBtn.disabled = mapCamera.zoom >= 4.19 || animation.playing || animation.recording;
        mapZoomResetBtn.disabled =
          (mapCamera.zoom <= 1.0001 && Math.abs(mapCamera.panX) < 1 && Math.abs(mapCamera.panY) < 1) ||
          animation.playing ||
          animation.recording;
      }

      function resetMapCamera() {
        mapCamera.zoom = 1;
        mapCamera.panX = 0;
        mapCamera.panY = 0;
        hideHoverCity();
        updateMapZoomUI();
        render();
      }

      function getView() {
        if (!animation.playing || routeSamples.length === 0) return getManualView();
        const focus = getRoutePoint(routeLength * animation.progress);
        const targetZoom = Number(zoomRange.value);
        const easeIn = Math.min(1, animation.progress * 7);
        const easeOut = Math.min(1, (1 - animation.progress) * 7);
        const zoomBlend = easeIn * easeOut;
        const zoom = 1 + (targetZoom - 1) * Math.max(0.56, zoomBlend);
        const scale = defaultView.scale * zoom;
        return {
          scale,
          offsetX: canvas.width / 2 - focus.x * scale,
          offsetY: canvas.height / 2 - focus.y * scale,
        };
      }

      function worldToScreen(point) {
        return {
          x: point.x * currentView.scale + currentView.offsetX,
          y: point.y * currentView.scale + currentView.offsetY,
        };
      }

      function screenToWorld(x, y) {
        return {
          x: (x - currentView.offsetX) / currentView.scale,
          y: (y - currentView.offsetY) / currentView.scale,
        };
      }

      function canvasEventToWorld(event) {
        const rect = canvas.getBoundingClientRect();
        const dprX = canvas.width / rect.width;
        const dprY = canvas.height / rect.height;
        const canvasX = (event.clientX - rect.left) * dprX;
        const canvasY = (event.clientY - rect.top) * dprY;
        return {
          worldPoint: screenToWorld(canvasX, canvasY),
          canvasX,
          canvasY,
          stageX: event.clientX - mapStage.getBoundingClientRect().left,
          stageY: event.clientY - mapStage.getBoundingClientRect().top,
        };
      }

      function screenToWorldWithView(x, y, view) {
        return {
          x: (x - view.offsetX) / view.scale,
          y: (y - view.offsetY) / view.scale,
        };
      }

      function zoomMapAt(canvasX, canvasY, nextZoom) {
        if (animation.playing || animation.recording) return;
        const beforeView = getManualView();
        const anchor = screenToWorldWithView(canvasX, canvasY, beforeView);
        mapCamera.zoom = clamp(nextZoom, 1, 4.2);
        const nextScale = defaultView.scale * mapCamera.zoom;
        mapCamera.panX = canvasX - anchor.x * nextScale - defaultView.offsetX;
        mapCamera.panY = canvasY - anchor.y * nextScale - defaultView.offsetY;
        clampMapCamera();
        hideHoverCity();
        updateMapZoomUI();
        render();
      }

      function zoomMapBy(step) {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        zoomMapAt(centerX, centerY, mapCamera.zoom * step);
      }

      function handleMapWheel(event) {
        if (animation.playing || animation.recording) return;
        event.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const canvasX = (event.clientX - rect.left) * (canvas.width / rect.width);
        const canvasY = (event.clientY - rect.top) * (canvas.height / rect.height);
        const factor = event.deltaY < 0 ? 1.14 : 1 / 1.14;
        zoomMapAt(canvasX, canvasY, mapCamera.zoom * factor);
      }

      function startMapPan(event) {
        if (animation.playing || animation.recording || mapCamera.zoom <= 1.0001) return;
        panState = {
          active: true,
          moved: false,
          startX: event.clientX,
          startY: event.clientY,
          panX: mapCamera.panX,
          panY: mapCamera.panY,
        };
        mapStage.classList.add("panning");
        canvas.setPointerCapture?.(event.pointerId);
      }

      function moveMapPan(event) {
        if (!panState.active) return;
        const dx = event.clientX - panState.startX;
        const dy = event.clientY - panState.startY;
        if (Math.hypot(dx, dy) > 3) panState.moved = true;
        if (!panState.moved) return;
        const rect = canvas.getBoundingClientRect();
        mapCamera.panX = panState.panX + dx * (canvas.width / rect.width);
        mapCamera.panY = panState.panY + dy * (canvas.height / rect.height);
        clampMapCamera();
        hideHoverCity();
        updateMapZoomUI();
        render();
      }

      function endMapPan(event) {
        if (!panState.active) return;
        suppressNextClick = panState.moved;
        panState.active = false;
        mapStage.classList.remove("panning");
        canvas.releasePointerCapture?.(event.pointerId);
      }

      function hideHoverCity() {
        const wasActive = hoverState.active;
        hoverState.active = false;
        hoverCity.classList.remove("show");
        hoverCity.setAttribute("aria-hidden", "true");
        if (wasActive && !animation.playing) render();
      }

      function showHoverCity(event) {
        if (animation.playing || animation.recording || panState.active) {
          hideHoverCity();
          return;
        }

        const { worldPoint, canvasX, canvasY, stageX, stageY } = canvasEventToWorld(event);
        if (!isOnChinaMap(worldPoint)) {
          hideHoverCity();
          return;
        }

        const geo = unproject(worldPoint.x, worldPoint.y);
        const city = recognizeCity(geo.lon, geo.lat, worldPoint);
        const stageRect = mapStage.getBoundingClientRect();
        const offset = 14;
        hoverCityName.textContent = city.name;
        hoverCity.classList.add("show");
        hoverCity.setAttribute("aria-hidden", "false");

        const tooltipWidth = hoverCity.offsetWidth || 112;
        const tooltipHeight = hoverCity.offsetHeight || 48;
        const left = Math.min(Math.max(10, stageX + offset), stageRect.width - tooltipWidth - 10);
        const top = Math.min(Math.max(10, stageY + offset), stageRect.height - tooltipHeight - 10);
        hoverCity.style.transform = `translate(${left}px, ${top}px)`;

        hoverState = {
          active: true,
          name: city.name,
          canvasX,
          canvasY,
        };
        render();
      }

      function requestRender() {
        if (!animation.playing) render();
      }

      function drawPolyline(list, close = false) {
        list.forEach(([lon, lat], index) => {
          const p = project(lon, lat);
          if (index === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        if (close) ctx.closePath();
      }

      function buildPolygonPath(polygon) {
        const path = new Path2D();
        polygon.forEach(([lon, lat], index) => {
          const p = project(lon, lat);
          if (index === 0) path.moveTo(p.x, p.y);
          else path.lineTo(p.x, p.y);
        });
        path.closePath();
        return path;
      }

      function drawSeaBackground() {

        ctx.fillStyle = glow;
        ctx.fillRect(-80, -80, WORLD.width + 160, WORLD.height + 160);

        for (let lon = 75; lon <= 135; lon += 5) {

          const b = project(lon, GEO.maxLat);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);

        }
        for (let lat = 20; lat <= 50; lat += 2.5) {

          ctx.lineTo(b.x, b.y);
