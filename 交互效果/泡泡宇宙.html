<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际漫游</title>
<style>
  :root {
    --bg-deep: #87CEEB;
    --accent-purple: #a78bfa;
    --accent-pink: #f472b6;
    --accent-blue: #60a5fa;
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-blur: 20px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    color: #fff;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  #mainCanvas {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ── 顶部标题 ── */

  /* ── 悬浮标签 ── */
  .hover-tag {
    position: fixed;
    z-index: 20;
    padding: 7px 16px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    font-size: 0.78rem;
    color: rgba(0, 40, 80, 0.85);
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%) translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,80,160,0.12);
  }
  .hover-tag.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }


  /* ── 弹出层 ── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(135, 206, 235, 0);
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    pointer-events: none;
    transition: background 0.5s ease, backdrop-filter 0.5s ease, -webkit-backdrop-filter 0.5s ease;
  }
  .overlay.active {
    background: rgba(135, 206, 235, 0.45);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    pointer-events: auto;
  }

  .photo-card {
    width: 360px;
    border-radius: 24px;
    overflow: hidden;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.92), rgba(240, 248, 255, 0.96));
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow:
      0 30px 80px rgba(0, 80, 160, 0.15),
      0 0 0 1px rgba(255, 255, 255, 0.5) inset,
      0 0 80px rgba(135, 206, 235, 0.12);
    transform: scale(0.6) translateY(50px);
    opacity: 0;
    transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
  }
  .overlay.active .photo-card {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .photo-card .img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    overflow: hidden;
  }
  .photo-card .img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-card .img-wrap .shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.03) 45%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.03) 55%, transparent 60%);
    background-size: 200% 100%;
    animation: shimmer 3.5s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .photo-card .img-wrap .loc-tag {
    position: absolute;
    bottom: 12px;
    left: 12px;
    padding: 6px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.8);
    font-size: 0.75rem;
    color: rgba(0,40,80,0.8);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .photo-card .info {
    padding: 20px 22px 22px;
  }
  .photo-card .info .title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .photo-card .info .title-row .emoji {
    font-size: 1.6rem;
    line-height: 1;
  }
  .photo-card .info h3 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: rgba(0, 40, 80, 0.85);
  }
  .photo-card .info .meta {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.8rem;
    color: rgba(0, 40, 80, 0.5);
  }
  .photo-card .info .meta span {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .close-btn {
    position: absolute;
    top: 12px; right: 12px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 5;
  }
  .close-btn:hover {
    background: rgba(239, 68, 68, 0.65);
    border-color: rgba(239, 68, 68, 0.4);
    transform: scale(1.1);
  }
  .close-btn svg {
    width: 12px; height: 12px;
    stroke: rgba(0, 40, 80, 0.6);
    stroke-width: 2.2;
    stroke-linecap: round;
    fill: none;
  }

cing:2px;color:#9eadae}.gallery-nav button{background:transparent;border:1px solid #b4b9ac44;color:#decba6;width:34px;height:34px;cursor:pointer;border-radius:50%;font-size:18px}.gallery-nav button:hover{background:#c4ad7f22}.close-btn{position:fixed;top:14px;right:14px;background:#c7d3d8cc}.photo-card .loc-tag{border-radius:3px}.photo-card .shimmer{display:none}

</style>

var canvas = document.getElementById('mainCanvas');

function resize() {
  W = canvas.width = window.innerWidth;

var imgCache = {};
function loadImg(src) {
  return new Promise(function(resolve) {
    if (imgCache[src]) return resolve(imgCache[src]);
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { imgCache[src] = img; resolve(img); };
    img.onerror = function() { resolve(null); };
    img.src = src;
  });
}
photos.forEach(function(p) { loadImg(p.url); });

// ══════════════════════════════════════
//  背景星尘粒子
// ══════════════════════════════════════
function initStars() {
  stars.length = 0;
  for (var i = 0; i < 160; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + 0.2,
      speed: Math.random() * 0.12 + 0.02,
      phase: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.018 + 0.004,
      color: Math.random() > 0.7 ? 'rgba(255,255,255,0.9)' : Math.random() > 0.5 ? 'rgba(255,255,255,0.7)' : 'rgba(255,240,250,0.8)',
    });
  }
}

function drawStars(t) {
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    s.y -= s.speed;
    s.x += Math.sin(t * 0.0003 + s.phase) * 0.06;
    if (s.y < -5) { s.y = H + 5; s.x = Math.random() * W; }
    var alpha = 0.15 + Math.sin(t * s.twinkleSpeed + s.phase) * 0.12;
    ctx.globalAlpha = Math.max(0.04, alpha);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBubbleLinks(t) {
  var linkDist = 280;
  for (var i = 0; i < bubbles.length; i++) {
    var a = bubbles[i];
    if (!a.alive || (drag && drag.b===a)) continue;
    for (var j = i + 1; j < bubbles.length; j++) {
      var b = bubbles[j];
      if (!b.alive) continue;
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < linkDist) {
        var alpha = (1 - dist / linkDist) * 0.2;
        var hue = (t * 0.012 + (a.hueOffset + b.hueOffset) * 0.5) % 360;

        // 光丝主线
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = 'hsla(' + hue + ', 45%, 55%, 1)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        // 微弯曲线
        var mx = (a.x + b.x) / 2 + Math.sin(t * 0.001 + i + j) * 15;
        var my = (a.y + b.y) / 2 + Math.cos(t * 0.0012 + i * j) * 15;
        ctx.quadraticCurveTo(mx, my, b.x, b.y);
        ctx.stroke();

        // 光丝上的流光点
        var flowPos = (t * 0.0008 + i * 0.3) % 1;
        var ft = flowPos;
        var fx = (1 - ft) * (1 - ft) * a.x + 2 * (1 - ft) * ft * mx + ft * ft * b.x;
        var fy = (1 - ft) * (1 - ft) * a.y + 2 * (1 - ft) * ft * my + ft * ft * b.y;
        ctx.globalAlpha = alpha * 2.5;
        var dotGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 4);
        dotGrad.addColorStop(0, 'hsla(' + hue + ', 70%, 65%, 1)');
        dotGrad.addColorStop(1, 'hsla(' + hue + ', 50%, 55%, 0)');
        ctx.fillStyle = dotGrad;
        ctx.beginPath(); ctx.arc(fx, fy, 4, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
      }
    }
  }
}

// ══════════════════════════════════════
//  戳破粒子系统
// ══════════════════════════════════════
function spawnPop(x, y, r) {
  var count = 24 + Math.floor(r * 0.35);
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 2 + Math.random() * 5;
    popParticles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      r: 1.2 + Math.random() * 3, life: 1,
      decay: 0.012 + Math.random() * 0.012,
      hue: Math.random() * 360, type: 'dot',
    });
  }
  for (var j = 0; j < 6; j++) {
    var aAngle = Math.random() * Math.PI * 2;
    var aSpeed = 1.5 + Math.random() * 3;
    popParticles.push({
      x: x + Math.cos(aAngle) * r * 0.5, y: y + Math.sin(aAngle) * r * 0.5,
      vx: Math.cos(aAngle) * aSpeed, vy: Math.sin(aAngle) * aSpeed,
      arcStart: Math.random() * Math.PI * 2, arcLen: 0.4 + Math.random() * 0.8,
      arcR: 8 + Math.random() * 15, life: 1,
      decay: 0.018 + Math.random() * 0.01, hue: Math.random() * 360,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.15,
      type: 'arc',
    });
  }
  popParticles.push({
    x: x, y: y, vx: 0, vy: 0, r: r * 0.3,
    life: 1, decay: 0.035, hue: 270, type: 'ring', maxR: r * 2,
  });
  for (var k = 0; k < 3; k++) {
    var bAngle = Math.random() * Math.PI * 2;
    var bSpeed = 0.8 + Math.random() * 1.5;
    popParticles.push({
      x: x + Math.cos(bAngle) * r * 0.3, y: y + Math.sin(bAngle) * r * 0.3,
      vx: Math.cos(bAngle) * bSpeed, vy: Math.sin(bAngle) * bSpeed - 0.5,
      r: 4 + Math.random() * 8, life: 1,
      decay: 0.008 + Math.random() * 0.006, hue: Math.random() * 360,
      type: 'mini',
    });
  }
}

function updatePopParticles(t) {
  for (var i = popParticles.length - 1; i >= 0; i--) {
    var p = popParticles[i];
    p.life -= p.decay;
    if (p.life <= 0) { popParticles.splice(i, 1); continue; }

    if (p.type === 'ring') {
      p.r += (p.maxR - p.r) * 0.1;
      ctx.globalAlpha = p.life * 0.25;
      ctx.strokeStyle = 'hsla(' + p.hue + ', 70%, 78%, ' + (p.life * 0.5) + ')';
      ctx.lineWidth = 1.5 * p.life;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
    } else if (p.type === 'arc') {
      p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.vx *= 0.98; p.vy *= 0.98; p.rot += p.rotSpeed;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = p.life * 0.5;
      ctx.strokeStyle = 'hsla(' + p.hue + ', 65%, 75%, ' + (p.life * 0.6) + ')';
      ctx.lineWidth = 2 * p.life;
      ctx.beginPath(); ctx.arc(0, 0, p.arcR, p.arcStart, p.arcStart + p.arcLen); ctx.stroke();
      ctx.restore();
    } else if (p.type === 'mini') {
      p.x += p.vx; p.y += p.vy; p.vy -= 0.01; p.vx *= 0.995; p.vy *= 0.995;
      var mr = p.r * p.life;
      ctx.globalAlpha = p.life * 0.4;
      var mg = ctx.createRadialGradient(p.x, p.y, mr * 0.3, p.x, p.y, mr);
      mg.addColorStop(0, 'rgba(255,255,255,0)');
      mg.addColorStop(0.7, 'hsla(' + p.hue + ', 50%, 80%, 0.15)');
      mg.addColorStop(1, 'hsla(' + ((p.hue + 60) % 360) + ', 50%, 85%, 0.1)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(p.x, p.y, mr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'hsla(' + p.hue + ', 40%, 85%, ' + (p.life * 0.3) + ')';
      ctx.lineWidth = 0.8; ctx.stroke();
      ctx.globalAlpha = p.life * 0.5;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(p.x - mr * 0.25, p.y - mr * 0.3, mr * 0.18, 0, Math.PI * 2); ctx.fill();
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.98; p.vy *= 0.98;
      ctx.globalAlpha = p.life * 0.65;
      ctx.fillStyle = 'hsla(' + p.hue + ', 80%, 72%, ' + p.life + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ══════════════════════════════════════
//  泡泡
// ══════════════════════════════════════
function createBubble(index, fromBottom) {
  var r = 50 + Math.random() * 35;
  var margin = r + 30;
  return {
    index: index,
    x: margin + Math.random() * (W - margin * 2),
    y: fromBottom ? H + r + Math.random() * 150 : margin + Math.random() * (H - margin * 2),
    r: r,
    vx: (Math.random() - 0.5) * 0.3,
    vy: -(0.12 + Math.random() * 0.2),
    phase: Math.random() * Math.PI * 2,
    hueOffset: Math.random() * 360,
    img: null,
    alive: true,
    scale: fromBottom ? 0.15 : 1,
    highlightAngle: -0.6 + Math.random() * 0.3,
  };
}

function initBubbles() {
  bubbles.length = 0;
  photos.forEach(function(p, i) {
    var b = createBubble(i, false);
    loadImg(p.url).then(function(img) { b.img = img; });
    b.x=W*.5+Math.cos(i*Math.PI/4-.6)*W*.32;b.y=H*.52+Math.sin(i*Math.PI/4-.6)*H*.30;
    bubbles.push(b);
  });
}

function respawnBubble(b) {
  b.alive = true;
  b.scale = 0.1;
  b.x = b.r + 50 + Math.random() * (W - b.r * 2 - 100);
  b.y = H + b.r + 50;
  b.vx = (Math.random() - 0.5) * 0.3;
  b.vy = -(0.12 + Math.random() * 0.2);

}

// ══════════════════════════════════════
//  泡泡绘制（核心视觉）
// ══════════════════════════════════════
function drawBubble(b,t){
 if(!b.alive)return;var r=b.r*b.scale;if(r<2)return;var hover=b===hoveredBubble;r*=hover?1.08:1;
 ctx.save();ctx.translate(b.x,b.y);
 var glow=ctx.createRadialGradient(0,0,r*.85,0,0,r*1.45);glow.addColorStop(0,'rgba(97,172,236,.18)');glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,r*1.45,0,Math.PI*2);ctx.fill();
 if(b.index===4||b.index===0){ctx.save();ctx.rotate(-.35);ctx.strokeStyle=b.index===4?'#9fcce077':'#d8b37d66';ctx.lineWidth=r*.13;ctx.beginPath();ctx.ellipse(0,0,r*1.48,r*.37,0,Math.PI,Math.PI*2);ctx.stroke();ctx.restore();}
 ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.clip();
 if(b.img)ctx.drawImage(b.img,-r,-r,r*2,r*2);
 var shade=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.15);shade.addColorStop(0,'rgba(225,244,255,.18)');shade.addColorStop(.45,'rgba(10,20,40,0)');shade.addColorStop(.8,'rgba(2,8,25,.24)');shade.addColorStop(1,'rgba(0,3,12,.7)');ctx.fillStyle=shade;ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();
 ctx.strokeStyle='rgba(155,208,242,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
 if(b.index===4||b.index===0){ctx.save();ctx.rotate(-.35);ctx.strokeStyle=b.index===4?'#b6e2ef99':'#ebca9899';ctx.lineWidth=r*.12;ctx.beginPath();ctx.ellipse(0,0,r*1.48,r*.37,0,0,Math.PI);ctx.stroke();ctx.restore();}
 ctx.save();ctx.textAlign='center';ctx.fillStyle=hover?'#ecdfc5':'#9bb0bf99';ctx.font=(hover?'12px':'10px')+' sans-serif';ctx.fillText(String(b.index+1).padStart(2,'0')+' / '+photos[b.index].title,0,r+27);ctx.restore();
 if(hover){ctx.strokeStyle='#acd9f7';ctx.lineWidth=1;ctx.setLineDash([3,7]);ctx.beginPath();ctx.arc(0,0,r*1.25,0,Math.PI*2);ctx.stroke();}
 ctx.restore();
}
function updateBubbles(t) {
  for (var i = 0; i < bubbles.length; i++) {
    var b = bubbles[i];
    if (!b.alive) continue;
    if(drag && drag.b===b)continue;

    if (b.scale < 1) {
      b.scale += (1 - b.scale) * 0.028;
      if (b.scale > 0.995) b.scale = 1;
    }

    var wobble = Math.sin(t * 0.0007 + b.phase) * 0.2;
    var wobble2 = Math.sin(t * 0.0012 + b.phase * 1.7) * 0.08;
    b.x += b.vx + wobble + wobble2;
    b.y += b.vy / (b.r / 60);

    var margin = b.r + 10;
    if (b.x < margin) { b.x = margin; b.vx = Math.abs(b.vx) * 0.4; }
    if (b.x > W - margin) { b.x = W - margin; b.vx = -Math.abs(b.vx) * 0.4; }
    if (b.y < b.r+95) { b.y = b.r+95; b.vy = Math.abs(b.vy) * 0.4; }
    if (b.y > H - b.r-85) { b.y = H - b.r-85; b.vy = -Math.abs(b.vy) * 0.4; }

    var dx = b.x - mouse.x, dy = b.y - mouse.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    // hover 中的泡泡：轻微减速，方便用户点击
    if (b === hoveredBubble) {
      b.vx *= 0.92;
      b.vy *= 0.92;
    } else {
      var repulseR = b.r + 110;
      if (dist < repulseR && dist > 0) {
        var force = (repulseR - dist) / repulseR * 0.5;
        b.vx += (dx / dist) * force;
        b.vy += (dy / dist) * force;
      }
    }

    b.vx *= 0.983;
    b.vy = b.vy * 0.992 + (-(0.12 + Math.random() * 0.04)) * 0.01;
  }

  // 碰撞
  for (var i = 0; i < bubbles.length; i++) {
    var a = bubbles[i];
    if (!a.alive || (drag && drag.b===a)) continue;
    for (var j = i + 1; j < bubbles.length; j++) {
      var bb = bubbles[j];
      if (!bb.alive || (drag && drag.b===bb)) continue;
      var dx = bb.x - a.x, dy = bb.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var minDist = (a.r * a.scale + bb.r * bb.scale) * 1.08;
      if (dist < minDist && dist > 0) {
        var nx = dx / dist, ny = dy / dist, overlap = (minDist - dist) / 2;
        a.x -= nx * overlap; a.y -= ny * overlap;
        bb.x += nx * overlap; bb.y += ny * overlap;
        var dvx = a.vx - bb.vx, dvy = a.vy - bb.vy, dot = dvx * nx + dvy * ny;
        if (dot > 0) {
          a.vx -= dot * nx * 0.25; a.vy -= dot * ny * 0.25;
          bb.vx += dot * nx * 0.25; bb.vy += dot * ny * 0.25;
        }
      }
    }
  }
}

// ══════════════════════════════════════
//  UI 交互
// ══════════════════════════════════════
var hoverTag = document.getElementById('hoverTag');
function updateHoverTag() {
  if (hoveredBubble && hoveredBubble.alive) {
    var p = photos[hoveredBubble.index];
    hoverTag.textContent = p.icon + '  ' + p.title + ' · ' + p.loc;
    hoverTag.style.left = hoveredBubble.x + 'px';
    hoverTag.style.top = Math.max(90,hoveredBubble.y - hoveredBubble.r * hoveredBubble.scale - 30) + 'px';
    hoverTag.classList.add('visible');
  } else {
    hoverTag.classList.remove('visible');
  }
}

function hitTest(mx, my) {
  for (var i = bubbles.length - 1; i >= 0; i--) {
    var b = bubbles[i];
    if (!b.alive) continue;
    var dx = mx - b.x, dy = my - b.y;
    if (Math.sqrt(dx * dx + dy * dy) < b.r * b.scale) return b;
  }
  return null;
}

var overlay = document.getElementById('overlay');
var cardImg = document.getElementById('cardImg');
var cardEmoji = document.getElementById('cardEmoji');
var cardTitle = document.getElementById('cardTitle');
var cardLoc = document.getElementById('cardLoc');
var cardLocInner = document.getElementById('cardLocInner');
var cardDate = document.getElementById('cardDate');
var closeBtn = document.getElementById('closeBtn');
var overlayActive = false;
var galleryNav=document.createElement('div');galleryNav.className='gallery-nav';galleryNav.innerHTML='<button type="button" aria-label="上一张照片">←</button><span id="galleryCount">01 / 08</span><button type="button" aria-label="下一张照片">→</button>';
document.querySelector('.photo-card .info').append(galleryNav);galleryNav.children[0].onclick=function(){browsePhoto(-1);};galleryNav.children[2].onclick=function(){browsePhoto(1);};
document.addEventListener('keydown',function(e){if(!overlayActive)return;if(e.key==='ArrowLeft'){e.preventDefault();browsePhoto(-1);}if(e.key==='ArrowRight'){e.preventDefault();browsePhoto(1);}});
closeBtn.setAttribute('role','button');closeBtn.setAttribute('aria-label','关闭照片');closeBtn.tabIndex=0;closeBtn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();closePhoto();}});


function showPhoto(b) {
  galleryIndex=b.index;document.getElementById("galleryCount").textContent=String(b.index+1).padStart(2,"0")+" / 08";
  var p = photos[b.index];
  cardImg.src = p.url;
  cardEmoji.textContent = p.icon;
  cardTitle.textContent = p.title;
  cardLoc.textContent = p.loc;
  cardLocInner.textContent = p.loc;
  cardDate.textContent = p.date;
  overlayActive = true;
  overlay.classList.add('active');
}

function closePhoto() {
  overlayActive = false;
  overlay.classList.remove('active');
}

closeBtn.addEventListener('click', function(e) { e.stopPropagation(); closePhoto(); });
overlay.addEventListener('click', function(e) { if (e.target === overlay) closePhoto(); });
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && overlayActive) closePhoto();
});


var drag=null,dragMoved=false,suppressClick=false,flightTrails=[],galleryIndex=0;
function beginDrag(x,y){var b=hitTest(x,y);if(!b||overlayActive)return;drag={b:b,x:x,y:y,startX:x,startY:y,vx:0,vy:0};dragMoved=false;canvas.style.cursor='grabbing';}
function moveDrag(x,y){if(!drag)return;drag.vx=(x-drag.x)*.75;drag.vy=(y-drag.y)*.75;dragMoved=dragMoved||Math.hypot(x-drag.startX,y-drag.startY)>5;drag.x=x;drag.y=y;drag.b.x=Math.max(drag.b.r,Math.min(W-drag.b.r,x));drag.b.y=Math.max(drag.b.r,Math.min(H-drag.b.r,y));drag.b.vx=drag.b.vy=0;flightTrails.push({x:drag.b.x,y:drag.b.y,life:1});}
function releaseDrag(){
 if(!drag)return;
 var b=drag.b;
 b.vx=Math.max(-12,Math.min(12,drag.vx));
 b.vy=Math.max(-12,Math.min(12,drag.vy));
 suppressClick=dragMoved;
 drag=null;
 hoveredBubble=null;
 canvas.style.cursor='grab';
}
canvas.style.touchAction='none';
canvas.addEventListener('pointerdown',function(e){suppressClick=false;beginDrag(e.clientX,e.clientY);if(drag&&e.isTrusted)canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;if(drag)moveDrag(e.clientX,e.clientY);else hoveredBubble=hitTest(e.clientX,e.clientY);});
canvas.addEventListener('pointerup',function(){releaseDrag();});
canvas.addEventListener('pointercancel',function(){if(drag){drag.vx=drag.vy=0;releaseDrag();}suppressClick=true;});
canvas.addEventListener('click',function(e){if(suppressClick){e.stopImmediatePropagation();suppressClick=false;}},true);
function drawFlight(){ctx.save();for(var i=flightTrails.length-1;i>=0;i--){var p=flightTrails[i];p.life-=.018;if(p.life<=0){flightTrails.splice(i,1);continue;}ctx.fillStyle='rgba(218,195,150,'+(p.life*.45)+')';ctx.beginPath();ctx.arc(p.x,p.y,1.5+p.life*2,0,Math.PI*2);ctx.fill();}ctx.restore();}
function browsePhoto(delta){galleryIndex=(galleryIndex+delta+photos.length)%photos.length;showPhoto({index:galleryIndex});}

canvas.addEventListener('mousemove', function(e) {
  mouse.x = e.clientX; mouse.y = e.clientY;
  var hit = hitTest(mouse.x, mouse.y);
  hoveredBubble = hit;
  canvas.style.cursor = hit ? 'pointer' : 'default';
});
canvas.addEventListener('mouseleave', function() {
  mouse.x = -9999; mouse.y = -9999; hoveredBubble = null;
});
canvas.addEventListener('click', function(e) {
  if (overlayActive) return;
  var b = hitTest(e.clientX, e.clientY);
  if (b && b.alive) {
    b.alive = false;
    spawnPop(b.x, b.y, b.r);
    hoveredBubble = null;
  
    setTimeout(function() { showPhoto(b); }, 220);
    setTimeout(function() { respawnBubble(b); }, 3800);
  }
});


// ══════════════════════════════════════
//  主循环
// ══════════════════════════════════════
// ══════════════════════════════════════
//  初始化 & 主循环
// ══════════════════════════════════════
resize();
initBubbles();

function animate(t) {
  ctx.clearRect(0, 0, W, H);
  drawBackground(t);
  drawStars(t);
  updateBubbles(t);
  drawBubbleLinks(t);
  drawFlight();
  var sorted = bubbles.slice().sort(function(a, b) { return a.r - b.r; });
  for (var i = 0; i < sorted.length; i++) drawBubble(sorted[i], t);
  updatePopParticles(t);
  updateHoverTag();
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
