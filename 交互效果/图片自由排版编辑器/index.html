<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片自由排版编辑器</title>
    <style>
      :root {
        --panel-bg: #ffffff;
        --border: #d8dee7;
        --bg: #f4f6fb;
        --text: #243041;
        --sub-text: #627186;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .app {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 100vh;
      }

      .panel {
        padding: 16px;
        border-right: 1px solid var(--border);
        background: var(--panel-bg);
        overflow: auto;
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      .hint {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--sub-text);
      }

      .block {
        margin-bottom: 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }

      .block h2 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      .row:last-child {
        margin-bottom: 0;
      }

      .row > * {
        flex: 1;
      }

      input[type="file"] {
        width: 100%;
      }

      input[type="number"],
      input[type="text"] {
        width: 100%;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 10px;
        outline: none;
        background: #fff;
      }

      input[type="number"]:focus,
      input[type="text"]:focus {
        border-color: var(--primary);
      }

      input[type="color"] {
        width: 100%;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2px 4px;
        background: #fff;
      }

      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--text);
      }

      .check-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      button {
        height: 34px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text);
      }

      button:hover {
        border-color: #aab8cc;
      }

      button.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      button.primary:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .layer-list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .layer-list li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid #edf1f6;
        cursor: pointer;
        font-size: 13px;
      }

      .layer-list li:last-child {
        border-bottom: 0;
      }

      .layer-list li.active {
        background: #e8f0ff;
      }

      .layer-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .layer-meta {
        color: var(--sub-text);
        flex: none;
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--sub-text);
        min-height: 18px;
      }

      .workspace {
        padding: 18px;
        overflow: hidden;
      }

      .stage-wrap {
        height: calc(100vh - 36px);
        border: 1px dashed #c7d2e4;
        border-radius: 12px;
        background: #e7ecf5;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
      }

      .stage-shell {
        position: relative;
      }

      .stage {
        position: relative;
        width: 960px;
        height: 540px;
        background-color: transparent;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;
        box-shadow: 0 12px 36px rgba(20, 33, 60, 0.2);
        /* overflow: hidden; */
        user-select: none;
        transform-origin: top left;
      }

      .layer {
        position: absolute;
        border: 1px solid transparent;
        cursor: move;
        transform-origin: center center;
        transition: transform 0.16s ease;
      }

      .layer img {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }

      .layer.selected {
        border-color: #2563eb;
      }

      .layer:hover {
        transform: scale(var(--layer-hover-scale, 1.3));
      }

      .stage.interacting .layer:hover {
        transform: none;
      }

      .resize-handle {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #fff;
        border: 1px solid #2563eb;
        display: none;
        z-index: 3;
      }

      .layer.selected .resize-handle {
        display: block;
      }

      .resize-handle.nw {
        left: -6px;
        top: -6px;
        cursor: nwse-resize;
      }

      .resize-handle.n {
        left: calc(50% - 5px);
        top: -6px;
        cursor: ns-resize;
      }

      .resize-handle.ne {
        right: -6px;
        top: -6px;
        cursor: nesw-resize;
      }

      .resize-handle.e {
        right: -6px;
        top: calc(50% - 5px);
        cursor: ew-resize;
      }

      .resize-handle.se {
        right: -6px;
        bottom: -6px;
        cursor: nwse-resize;
      }

      .resize-handle.s {
        left: calc(50% - 5px);
        bottom: -6px;
        cursor: ns-resize;
      }

      .resize-handle.sw {
        left: -6px;
        bottom: -6px;
        cursor: nesw-resize;
      }

      .resize-handle.w {
        left: -6px;
        top: calc(50% - 5px);
        cursor: ew-resize;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>图片自由排版编辑器</h1>
        <p class="hint">
          先上传背景图，再上传多个图层。可拖拽、缩放、调整层级，最后导出静态成品
          HTML。
        </p>

        <section class="block">
          <h2>画布设置</h2>
          <div class="row">
            <input
              id="stage-width"
              type="number"
              min="1"
              max="10000"
              value="960"
            />
            <input
              id="stage-height"
              type="number"
              min="1"
              max="10000"
              value="540"
            />
          </div>
          <div class="row">
            <button id="apply-stage-size">应用画布尺寸</button>
          </div>
        </section>

        <section class="block">
          <h2>画布底色</h2>
          <label class="check-row">
            <input id="canvas-transparent" type="checkbox" checked />
            <span>透明（默认）</span>
          </label>
          <div class="row">
            <input id="canvas-color" type="color" value="#ffffff" disabled />
          </div>
        </section>

        <section class="block">
          <h2>悬停放大</h2>
          <div class="row">
            <input
              id="hover-scale-range"
              type="range"
              min="1"
              max="3"
              step="0.05"
              value="1.3"
            />
          </div>
          <div class="row">
            <input
              id="hover-scale-number"
              type="number"
              min="1"
              max="3"
              step="0.05"
              value="1.3"
            />
          </div>
        </section>

        <section class="block">
          <h2>背景图</h2>
          <div class="row">
            <input id="bg-upload" type="file" accept="image/*" />
          </div>
          <div class="row">
            <button id="clear-bg">清除背景</button>
          </div>
        </section>

        <section class="block">
          <h2>图层上传</h2>
          <div class="row">
            <input id="layers-upload" type="file" accept="image/*" multiple />
          </div>
        </section>

        <section class="block">
          <h2>图层列表（上方在前）</h2>
          <ul id="layer-list" class="layer-list"></ul>
          <div class="row" style="margin-top: 8px">
            <button id="layer-up">上移</button>
            <button id="layer-down">下移</button>
          </div>
          <div class="row">
            <button id="layer-top">置顶</button>
            <button id="layer-bottom">置底</button>
          </div>
          <div class="row">
            <button id="remove-layer">删除当前图层</button>
          </div>
        </section>

        <section class="block">
          <h2>当前图层属性</h2>
          <div class="row">
            <input id="layer-x" type="number" placeholder="X" />
            <input id="layer-y" type="number" placeholder="Y" />
          </div>
          <div class="row">
            <input id="layer-w" type="number" placeholder="宽度" />
            <input id="layer-h" type="number" placeholder="高度" />
          </div>
          <div class="row">
            <button id="apply-layer-rect">应用属性</button>
          </div>
        </section>

        <section class="block">
          <h2>导出</h2>
          <div class="row">
            <button id="export-html" class="primary">导出成品 HTML</button>
          </div>
          <p class="status" id="status-text">准备就绪</p>
        </section>
      </aside>

      <main class="workspace">
        <div class="stage-wrap">
          <div id="stage-shell" class="stage-shell">
            <div id="stage" class="stage"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="./editor.js"></script>
  </body>
</html>
