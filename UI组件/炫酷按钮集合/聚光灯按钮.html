<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聚光灯按钮</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #050a01;
      background-image: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(163,230,53,0.05) 0%, transparent 65%);
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
    }

    .btn {
      color: #a3e635;
      border: 1px solid #4d7c0f;
      background: transparent;
      padding: 18px 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s, color 0.3s;
      /* background set by JS */
    }

    .btn:hover {
      border-color: #84cc16;
      color: #d9f99d;
    }

    /* Outer glow that pulses on hover */
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      border: 1px solid transparent;
      transition: box-shadow 0.3s;
      pointer-events: none;
    }
    .btn:hover::after {
      box-shadow: inset 0 0 40px rgba(163,230,53,0.08);
    }

    /* Page-level cursor spotlight */
    .page-light {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(163,230,53,0.04) 0%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: left 0.08s, top 0.08s;
      z-index: 0;
    }

    .hint {
      margin-top: 28px;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: rgba(163,230,53,0.18);
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .corner {
      position: fixed;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(163,230,53,0.13);
      text-transform: uppercase;
    }
    .corner-bl { bottom: 32px; left: 40px; }
    .corner-br { bottom: 32px; right: 40px; }
  </style>
</head>
<body>
  <div class="page-light" id="pageLight"></div>
  <button class="btn" id="btn">SPOTLIGHT</button>
  <div class="hint">— hover —</div>

  <div class="corner corner-bl">聚光灯</div>
  <div class="corner corner-br">08 / 08</div>

  <script>
    const btn       = document.getElementById('btn');
    const pageLight = document.getElementById('pageLight');

    // Button-level spotlight follows cursor inside button
    btn.addEventListener('mousemove', e => {
      const r = btn.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const pct = Math.round((x / r.width) * 100);
      btn.style.background = `
        radial-gradient(circle at ${x}px ${y}px,
          rgba(163,230,53,0.22) 0%,
          rgba(163,230,53,0.08) 35%,
          transparent 65%)
      `;
    });

    btn.addEventListener('mouseleave', () => {
      btn.style.background = 'transparent';
    });

    // Page-level ambient light follows cursor everywhere
    document.addEventListener('mousemove', e => {
      pageLight.style.left = e.clientX + 'px';
      pageLight.style.top  = e.clientY + 'px';
    });
  </script>
</body>
</html>
