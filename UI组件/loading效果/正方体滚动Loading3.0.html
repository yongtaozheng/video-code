<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正方体滚动Loading3.0</title>
    <style>
      :root {
        --bg: #e5e7eb;
        --line: rgba(60, 66, 78, 0.3);
        --face-hi: rgba(255, 255, 255, 0.72);
        --face-mid: rgba(138, 145, 158, 0.88);
        --face-deep: rgba(82, 90, 104, 0.96);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            70vw 70vw at 110% -10%,
            rgba(255, 255, 255, 0.55),
            transparent 58%
          ),
          radial-gradient(
            55vw 55vw at -15% -20%,
            rgba(255, 255, 255, 0.45),
            transparent 56%
          ),
          var(--bg);
        overflow: hidden;
      }

      .loader {
        position: relative;
        width: 360px;
        height: 236px;
        perspective: 740px;
        isolation: isolate;
      }

      .cube-orient {
        position: absolute;
        left: 50%;
        bottom: 66px;
        width: 72px;
        height: 72px;
        margin-left: -36px;
        transform: translateX(110px) translateY(0px) rotateZ(0deg);
        will-change: transform;
        z-index: 3;
      }

      .cube {
        position: relative;
        width: 72px;
        height: 72px;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .face {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(68, 76, 90, 0.52);
        backface-visibility: hidden;
        overflow: hidden;
      }

      .face::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px);
        background-size: 6px 6px;
        opacity: 0.12;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .face::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          138deg,
          rgba(255, 255, 255, 0.32) 0%,
          rgba(255, 255, 255, 0.1) 28%,
          transparent 52%
        );
        opacity: 0.34;
        pointer-events: none;
      }

      .front {
        transform: translateZ(36px);
        background: linear-gradient(
          152deg,
          var(--face-hi) 0%,
          rgba(201, 206, 216, 0.95) 34%,
          var(--face-mid) 68%,
          var(--face-deep) 100%
        );
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.24),
          inset 0 11px 16px rgba(255, 255, 255, 0.34),
          inset 0 -14px 16px rgba(21, 26, 35, 0.26),
          inset -10px 0 12px rgba(32, 38, 48, 0.11);
      }

      .right {
        transform: rotateY(90deg) translateZ(36px);
        background: linear-gradient(
          168deg,
          rgba(162, 169, 182, 0.94) 0%,
          rgba(113, 121, 136, 0.96) 56%,
          rgba(74, 82, 97, 0.98) 100%
        );
        box-shadow:
          inset 8px 0 12px rgba(255, 255, 255, 0.14),
          inset -8px 0 14px rgba(19, 24, 34, 0.3);
      }

      .left {
        transform: rotateY(-90deg) translateZ(36px);
        background: linear-gradient(
          168deg,
          rgba(132, 140, 154, 0.9) 0%,
          rgba(86, 94, 109, 0.94) 56%,
          rgba(58, 66, 80, 0.98) 100%
        );
        box-shadow:
          inset 8px 0 12px rgba(255, 255, 255, 0.1),
          inset -8px 0 14px rgba(18, 23, 32, 0.34);
      }

      .top {
        transform: rotateX(90deg) translateZ(36px);
        background: linear-gradient(
          160deg,
          rgba(230, 233, 239, 0.98) 0%,
          rgba(182, 189, 202, 0.96) 52%,
          rgba(117, 126, 142, 0.95) 100%
        );
        box-shadow:
          inset 0 10px 12px rgba(255, 255, 255, 0.24),
          inset 0 -10px 14px rgba(24, 29, 39, 0.2);
      }

      .bottom {
        transform: rotateX(-90deg) translateZ(36px);
        background: linear-gradient(
          160deg,
          rgba(94, 102, 117, 0.95) 0%,
          rgba(67, 75, 89, 0.95) 52%,
          rgba(44, 52, 65, 0.96) 100%
        );
      }

      .back {
        transform: rotateY(180deg) translateZ(36px);
        background: linear-gradient(
          152deg,
          rgba(124, 132, 146, 0.95) 0%,
          rgba(91, 99, 114, 0.95) 56%,
          rgba(64, 72, 86, 0.98) 100%
        );
      }

      .shadow {
        position: absolute;
        left: 50%;
        bottom: 52px;
        width: 96px;
        height: 12px;
        margin-left: -48px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(39, 44, 54, 0.42),
          rgba(39, 44, 54, 0.02) 72%
        );
        filter: blur(0.8px);
        z-index: 2;
        will-change: transform, opacity;
      }

      .contact-shadow {
        position: absolute;
        left: 50%;
        bottom: 56px;
        width: 62px;
        height: 6px;
        margin-left: -31px;
        border-radius: 50%;
        background: radial-gradient(
          ellipse at center,
          rgba(28, 33, 42, 0.52),
          rgba(28, 33, 42, 0.02) 72%
        );
        filter: blur(0.4px);
        z-index: 2;
        will-change: transform, opacity;
      }

      .spec {
        position: absolute;
        width: 78px;
        height: 78px;
        border-radius: 14px;
        border: 1px solid rgba(84, 92, 108, 0.12);
        transform: rotate(45deg);
        opacity: 0.2;
        animation: spec-pulse 1.4s infinite cubic-bezier(0.58, 0.08, 0.45, 0.93);
        z-index: 1;
      }

      .progress-wrap {
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        width: 168px;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 8;
      }

      .progress-label {
        font-size: 10px;
        letter-spacing: 0.08em;
        color: rgba(57, 63, 74, 0.68);
        text-transform: uppercase;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .progress-rail {
        display: block;
        width: 118px;
        height: 4px;
        border-radius: 999px;
        border: 1px solid rgba(71, 78, 92, 0.28);
        background: rgba(63, 70, 84, 0.1);
        overflow: hidden;
      }

      .progress-fill {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgba(151, 158, 169, 0.88),
          rgba(97, 104, 117, 0.92)
        );
        transition: width 280ms ease;
      }

      .progress-fill::after {
        content: "";
        display: block;
        height: 160%;
        width: 34%;
        margin-left: auto;
        transform: translateY(-20%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.32),
          transparent
        );
        animation: progress-scan 1.4s infinite linear;
      }

      .progress-num {
        font-size: 10px;
        letter-spacing: 0.06em;
        color: rgba(53, 60, 71, 0.72);
        min-width: 28px;
        text-align: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @keyframes spec-pulse {
        0%,
        100% {
          opacity: 0.14;
          transform: rotate(45deg) scale(0.96);
        }
        25%,
        50%,
        75% {
          opacity: 0.24;
          transform: rotate(45deg) scale(1.01);
        }
      }

      @keyframes progress-scan {
        from {
          transform: translate(-165%, -20%);
        }
        to {
          transform: translate(165%, -20%);
        }
      }

      @media (max-width: 560px) {
        .loader {
          transform: scale(0.88);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader" aria-label="正方体滚动Loading3.0">
      <span class="shadow" aria-hidden="true"></span>
      <span class="contact-shadow" aria-hidden="true"></span>
      <span class="spec" aria-hidden="true"></span>

      <div class="cube-orient" aria-hidden="true">
        <div class="cube">
          <span class="face front"></span>
          <span class="face right"></span>
          <span class="face left"></span>
          <span class="face top"></span>
          <span class="face bottom"></span>
          <span class="face back"></span>
        </div>
      </div>

      <div class="progress-wrap" aria-hidden="true">
        <span class="progress-label">Loading</span>
        <span class="progress-rail"
          ><span class="progress-fill" id="progress-fill"></span
        ></span>
        <span class="progress-num" id="progress-num">0%</span>
      </div>
    </div>

    <script>
      (() => {
        const fill = document.getElementById("progress-fill");
        const num = document.getElementById("progress-num");
        const cubeOrient = document.querySelector(".cube-orient");
        const cube = document.querySelector(".cube");
        const shadow = document.querySelector(".shadow");
        const contactShadow = document.querySelector(".contact-shadow");

        const FAST_TARGET = 80;
        const FAST_DURATION_MS = 12000;
        const SLOW_STEP_MS = 2000;
        const RESET_DELAY_MS = 1000;

        const LOOP_MS = 3600;
        const A = 132;
        const B = 24;
        const SIDE = 72;
        const TWO_PI = Math.PI * 2;
        const BASE_OMEGA = TWO_PI / LOOP_MS;
        const SPEED_BIAS = 0.28;
        const DEPTH_TO_SCREEN_Y = 0.45;
        const ORBIT_CENTER_Y = 40;
        const BOUNCE_HEIGHT = 14;

        let value = 0;
        let slowTimer = null;
        let progressRaf = null;
        let motionLast = performance.now();
        let phase = 0;
        let motionS = 0;
        let motionRaf = null;

        const renderProgress = (v) => {
          const clamped = Math.max(0, Math.min(100, v));
          fill.style.width = clamped + "%";
          num.textContent = clamped + "%";
        };

        const clearProgressTimers = () => {
          if (progressRaf) cancelAnimationFrame(progressRaf);
          if (slowTimer) clearInterval(slowTimer);
          progressRaf = null;
          slowTimer = null;
        };

        const startSlowPhase = () => {
          slowTimer = setInterval(() => {
            value += 1;
            renderProgress(value);
            if (value >= 100) {
              clearInterval(slowTimer);
              slowTimer = null;
              setTimeout(startProgressCycle, RESET_DELAY_MS);
            }
          }, SLOW_STEP_MS);
        };

        const startFastPhase = () => {
          const start = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - start) / FAST_DURATION_MS);
            value = Math.floor(t * FAST_TARGET);
            renderProgress(value);
            if (t < 1) {
              progressRaf = requestAnimationFrame(tick);
            } else {
              value = FAST_TARGET;
              renderProgress(value);
              startSlowPhase();
            }
          };
          progressRaf = requestAnimationFrame(tick);
        };

        function startProgressCycle() {
          clearProgressTimers();
          value = 0;
          renderProgress(value);
          startFastPhase();
        }

        const updateMotion = (now) => {
          const dt = Math.max(0, now - motionLast);
          motionLast = now;

          const phaseMod = 1 + SPEED_BIAS * Math.cos(2 * phase);
          phase = (phase + BASE_OMEGA * dt * phaseMod) % TWO_PI;
          const t = phase;

          const x = A * Math.cos(t);
          const zDepth = B * Math.sin(t);
          const orbitY = zDepth * DEPTH_TO_SCREEN_Y;

          const dx = -A * Math.sin(t);
          const vx = dx * BASE_OMEGA * phaseMod;
          motionS += vx * dt;

          const rollDeg = (motionS / SIDE) * 90;
          const rawRoll = motionS / SIDE;
          const rollFrac = rawRoll - Math.floor(rawRoll);
          const bounce = Math.sin(rollFrac * Math.PI) * BOUNCE_HEIGHT;

          const yScreen = ORBIT_CENTER_Y + orbitY - bounce;
          const depthRatio = (zDepth + B) / (2 * B);
          const depthScale = 0.93 + depthRatio * 0.18;
          const depthZ = ((zDepth / B) * 12).toFixed(2);

          cubeOrient.style.transform =
            "translateX(" + x.toFixed(2) + "px) " +
            "translateY(" + yScreen.toFixed(2) + "px) " +
            "translateZ(" + depthZ + "px) " +
            "scale(" + depthScale.toFixed(3) + ")";

          if (zDepth > 2) {
            cubeOrient.style.zIndex = "5";
          } else if (zDepth < -2) {
            cubeOrient.style.zIndex = "3";
          }

          cube.style.transform =
            "rotateX(-8deg) rotateY(8deg) rotateZ(" +
            rollDeg.toFixed(2) + "deg)";

          const shadowScale = 0.8 + depthRatio * 0.26;
          const shadowOpacity = 0.28 + depthRatio * 0.24;
          const contactScale = 0.72 + depthRatio * 0.28;
          const contactOpacity = 0.2 + depthRatio * 0.42;
          const backHalfDrop = Math.max(0, -orbitY);
          const groundY = ORBIT_CENTER_Y + orbitY;
          const shadowY = groundY * 0.36 + 9 + backHalfDrop * 0.26 + ORBIT_CENTER_Y * 0.64;
          const contactY = groundY * 0.28 + 6 + backHalfDrop * 0.18 + ORBIT_CENTER_Y * 0.72;

          shadow.style.transform =
            "translateX(" + x.toFixed(2) + "px) " +
            "translateY(" + shadowY.toFixed(2) + "px) " +
            "scaleX(" + shadowScale.toFixed(3) + ")";
          shadow.style.opacity = shadowOpacity.toFixed(3);

          contactShadow.style.transform =
            "translateX(" + x.toFixed(2) + "px) " +
            "translateY(" + contactY.toFixed(2) + "px) " +
            "scaleX(" + contactScale.toFixed(3) + ")";
          contactShadow.style.opacity = contactOpacity.toFixed(3);

          motionRaf = requestAnimationFrame(updateMotion);
        };

        startProgressCycle();
        motionRaf = requestAnimationFrame(updateMotion);
      })();
    </script>
  </body>
</html>
