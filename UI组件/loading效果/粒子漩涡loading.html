<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粒子漩涡Loading动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #050510;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        .loading-label {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 12px;
            text-transform: uppercase;
        }

        .loading-label::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="loading-label">LOADING</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const centerX = width / 2;
        const centerY = height / 2;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 粒子类
        class Particle {
            constructor(layer) {
                this.layer = layer;
                this.reset();
            }

            reset() {
                // 根据层级决定粒子特性
                const configs = [
                    { minR: 30, maxR: 80, speed: 0.03, size: 2.5, hue: 200, trail: 0.4 },   // 内层 - 蓝色快速
                    { minR: 80, maxR: 140, speed: 0.018, size: 2, hue: 270, trail: 0.3 },     // 中层 - 紫色中速
                    { minR: 140, maxR: 220, speed: 0.01, size: 1.5, hue: 320, trail: 0.2 },   // 外层 - 粉色慢速
                ];

                const config = configs[this.layer];
                this.angle = Math.random() * Math.PI * 2;
                this.radius = config.minR + Math.random() * (config.maxR - config.minR);
                this.baseRadius = this.radius;
                this.speed = config.speed * (0.8 + Math.random() * 0.4);
                this.size = config.size * (0.5 + Math.random() * 1);
                this.hue = config.hue + Math.random() * 30 - 15;
                this.trail = config.trail;
                this.alpha = 0.6 + Math.random() * 0.4;
                this.pulseSpeed = 0.02 + Math.random() * 0.03;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.radiusOscillation = 5 + Math.random() * 15;
                this.orbitTilt = (Math.random() - 0.5) * 0.3; // 轨道倾斜
            }

            update(time) {
                this.angle += this.speed;
                // 半径呼吸效果
                this.radius = this.baseRadius + Math.sin(time * this.pulseSpeed + this.pulsePhase) * this.radiusOscillation;
                // 计算位置（带倾斜效果）
                this.x = centerX + Math.cos(this.angle) * this.radius;
                this.y = centerY + Math.sin(this.angle) * this.radius * (0.85 + this.orbitTilt);
                // 脉冲大小
                this.currentSize = this.size * (0.8 + Math.sin(time * 0.05 + this.pulsePhase) * 0.3);
            }

            draw() {
                // 粒子光晕
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.currentSize * 4
                );
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${this.alpha})`);
                gradient.addColorStop(0.4, `hsla(${this.hue}, 100%, 50%, ${this.alpha * 0.3})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentSize * 4, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // 粒子核心
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${this.alpha})`;
                ctx.fill();
            }
        }

        // 创建粒子
        const particles = [];
        const layerCounts = [25, 35, 45];

        layerCounts.forEach((count, layer) => {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(layer));
            }
        });

        // 中心光源
        function drawCenterGlow(time) {
            const pulse = Math.sin(time * 0.03) * 0.2 + 0.8;
            const gradient = ctx.createRadialGradient(
                centerX, centerY, 0,
                centerX, centerY, 60 * pulse
            );
            gradient.addColorStop(0, `rgba(255, 255, 255, ${0.15 * pulse})`);
            gradient.addColorStop(0.3, `rgba(100, 150, 255, ${0.08 * pulse})`);
            gradient.addColorStop(0.6, `rgba(150, 50, 255, ${0.04 * pulse})`);
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.beginPath();
            ctx.arc(centerX, centerY, 60 * pulse, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // 绘制连接线
        function drawConnections() {
            const maxDist = 60;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    if (particles[i].layer !== particles[j].layer) continue;
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.15;
                        const hue = (particles[i].hue + particles[j].hue) / 2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // 主循环
        let time = 0;
        function animate() {
            time++;

            // 半透明遮罩实现拖尾效果
            ctx.fillStyle = 'rgba(5, 5, 16, 0.15)';
            ctx.fillRect(0, 0, width, height);

            drawCenterGlow(time);
            drawConnections();

            particles.forEach(p => {
                p.update(time);
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
