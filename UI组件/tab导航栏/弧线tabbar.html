<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弧线跳跃 Tabbar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f8f4;
        font-family: "JetBrains Mono", monospace;
      }

      .wrap {
        width: min(560px, 92vw);
      }

      .tabs-area {
        position: relative;
        border-bottom: 1px solid #e0e0d8;
      }

      .tabs {
        display: flex;
      }

      .tab {
        flex: 1;
        padding: 16px 12px 14px;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #bbb;
        cursor: pointer;
        user-select: none;
        transition: color 0.25s;
      }
      .tab.active {
        color: #111;
      }
      .tab:hover:not(.active) {
        color: #777;
      }

      .arc-svg {
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 2px;
        overflow: visible;
        pointer-events: none;
      }

      #arcPath {
        fill: none;
        stroke: #111;
        stroke-width: 1.5;
        stroke-linecap: round;
      }

      #arcDot {
        fill: #111;
      }

      .content {
        margin-top: 64px;
        position: relative;
        min-height: 130px;
      }

      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
        pointer-events: none;
      }
      .panel.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .p-num {
        font-family: "Cormorant Garamond", serif;
        font-size: 72px;
        font-weight: 300;
        letter-spacing: -0.02em;
        line-height: 1;
        color: #111;
      }
      .p-line {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .p-rule {
        flex: 0 0 32px;
        height: 1px;
        background: #ddd;
      }
      .p-sub {
        font-size: 9px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="tabs-area">
        <div class="tabs" id="tabs">
          <div class="tab active" data-i="0">首页</div>
          <div class="tab" data-i="1">发现</div>
          <div class="tab" data-i="2">消息</div>
          <div class="tab" data-i="3">我的</div>
        </div>
        <svg class="arc-svg" id="arcSvg">
          <path id="arcPath" />
          <circle id="arcDot" r="2.5" />
        </svg>
      </div>

      <div class="content">
        <div class="panel show">
          <div class="p-num">01</div>
          <div class="p-line">
            <div class="p-rule"></div>
            <div class="p-sub">home · overview</div>
          </div>
        </div>
        <div class="panel">
          <div class="p-num">02</div>
          <div class="p-line">
            <div class="p-rule"></div>
            <div class="p-sub">discover · explore</div>
          </div>
        </div>
        <div class="panel">
          <div class="p-num">03</div>
          <div class="p-line">
            <div class="p-rule"></div>
            <div class="p-sub">messages · inbox</div>
          </div>
        </div>
        <div class="panel">
          <div class="p-num">04</div>
          <div class="p-line">
            <div class="p-rule"></div>
            <div class="p-sub">profile · settings</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tabEls = document.querySelectorAll(".tab");
      const panels = document.querySelectorAll(".panel");
      const arcPath = document.getElementById("arcPath");
      const arcDot = document.getElementById("arcDot");
      const tabsEl = document.getElementById("tabs");

      let current = 0;
      let curX = 0;
      let animRaf = null;
      const HW = 26;

      function tabCenterX(tab) {
        const base = tabsEl.getBoundingClientRect().left;
        const r = tab.getBoundingClientRect();
        return r.left - base + r.width / 2;
      }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      }

      function draw(cx, arcH, hw) {
        const x1 = cx - hw;
        const x2 = cx + hw;
        const cpx = cx;
        const cpy = -arcH;

        if (arcH < 0.5) {
          arcPath.setAttribute("d", `M${x1},0 L${x2},0`);
        } else {
          arcPath.setAttribute("d", `M${x1},0 Q${cpx},${cpy} ${x2},0`);
        }

        arcDot.setAttribute("cx", cx);
        arcDot.setAttribute("cy", -arcH * 0.08);
      }

      function jumpTo(targetX) {
        if (animRaf) cancelAnimationFrame(animRaf);

        const fromX = curX;
        const dist = Math.abs(targetX - fromX);
        const maxArc = Math.min(50, dist * 0.55);
        const dur = 320 + dist * 0.55;
        const t0 = performance.now();

        function step(now) {
          const t = Math.min(1, (now - t0) / dur);
          const ease = easeInOut(t);

          curX = fromX + (targetX - fromX) * ease;

          const arcH = maxArc * Math.sin(t * Math.PI);

          const hw = HW + arcH * 0.18;

          draw(curX, arcH, hw);

          if (t < 1) {
            animRaf = requestAnimationFrame(step);
          } else {
            curX = targetX;
            draw(curX, 0, HW);
            animRaf = null;
          }
        }

        animRaf = requestAnimationFrame(step);
      }

      function switchTo(i) {
        if (i === current) return;
        tabEls[current].classList.remove("active");
        panels[current].classList.remove("show");
        current = i;
        tabEls[current].classList.add("active");
        panels[current].classList.add("show");
        jumpTo(tabCenterX(tabEls[i]));
      }

      tabEls.forEach((tab, i) =>
        tab.addEventListener("click", () => switchTo(i)),
      );

      requestAnimationFrame(() => {
        curX = tabCenterX(tabEls[0]);
        draw(curX, 0, HW);
      });

      window.addEventListener("resize", () => {
        if (!animRaf) {
          curX = tabCenterX(tabEls[current]);
          draw(curX, 0, HW);
        }
      });
    </script>
  </body>
</html>
