<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 透视 Tabbar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
      background: #f0f2f8;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Stage ── */
    .stage {
      width: min(580px, 94vw);
    }

    /* The 3D tab bar: looks like a tilted shelf */
    .tab-shelf {
      perspective: 700px;
      margin-bottom: 0;
    }

    .tab-row {
      display: flex;
      transform-style: preserve-3d;
      transform: rotateX(28deg);
      transform-origin: bottom center;
      gap: 3px;
    }

    .tab {
      flex: 1;
      padding: 18px 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      position: relative;
      transform: translateZ(0px);
      transition:
        transform  0.42s cubic-bezier(0.34, 1.4, 0.64, 1),
        color      0.3s,
        background 0.3s,
        box-shadow 0.3s;
      color: #a8acb8;
      background: #e4e8f0;
      border-top: 1px solid #d0d4e0;
    }

    /* Active tab rises up in Z space */
    .tab.active {
      transform: translateZ(22px);
      color: #111118;
      background: #ffffff;
      border-top-color: rgba(0,0,0,0.1);
      box-shadow:
        0 -4px 16px rgba(0,0,0,0.1),
        0 0 0 0.5px rgba(0,0,0,0.06);
    }

    .tab:not(.active):hover {
      transform: translateZ(8px);
      color: #6a6e7a;
      background: #eaeef6;
    }

    /* Active tab top accent line with color per tab */
    .tab.active::before {
      content: '';
      position: absolute;
      top: -1px; left: 0; right: 0;
      height: 2px;
      transition: background 0.3s;
    }

    /* Content panel below the shelf */
    .content-area {
      background: #ffffff;
      border: 1px solid #d0d4e0;
      border-top: none;
      min-height: 220px;
      position: relative;
      overflow: hidden;
    }

    /* 3D flip panels */
    .panel-wrap {
      perspective: 900px;
      width: 100%; height: 100%;
    }

    .panel {
      position: absolute; inset: 0;
      padding: 44px 48px;
      transform-origin: top center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      display: flex; flex-direction: column;
      gap: 12px;
    }

    /* Entry state: panel flips down from above (rotateX) */
    .panel.hidden-above {
      transform: rotateX(-55deg);
      opacity: 0;
      pointer-events: none;
      transition: none;
    }
    .panel.hidden-below {
      transform: rotateX(55deg);
      opacity: 0;
      pointer-events: none;
      transition: none;
    }
    .panel.active {
      transform: rotateX(0deg);
      opacity: 1;
      pointer-events: auto;
      transition:
        transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
        opacity   0.4s ease;
    }
    .panel.leaving-above {
      transform: rotateX(-55deg);
      opacity: 0;
      pointer-events: none;
      transition:
        transform 0.38s cubic-bezier(0.55, 0, 0.45, 1),
        opacity   0.3s ease;
    }

    .panel-eyebrow {
      font-size: 9px; letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: color 0.4s;
    }

    .panel-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 48px; font-weight: 300;
      letter-spacing: -0.01em;
      color: #111118;
      line-height: 1;
    }

    .panel-divider {
      width: 28px; height: 1px;
      transition: background 0.4s;
      margin: 4px 0;
    }

    .panel-body {
      font-size: 10px; letter-spacing: 0.14em;
      color: #b0b4c4;
      text-transform: uppercase;
      line-height: 2;
    }

    /* Corner number */
    .panel-num {
      position: absolute;
      bottom: 28px; right: 36px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px; font-weight: 600;
      line-height: 1; letter-spacing: -0.04em;
      color: rgba(0,0,0,0.04);
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="tab-shelf">
      <div class="tab-row" id="tabRow">
        <div class="tab active" data-i="0">首页</div>
        <div class="tab" data-i="1">发现</div>
        <div class="tab" data-i="2">消息</div>
        <div class="tab" data-i="3">我的</div>
      </div>
    </div>

    <div class="content-area">
      <div class="panel-wrap">

        <div class="panel active" data-panel="0">
          <div class="panel-eyebrow" style="color:#818cf8">首页 · Home</div>
          <div class="panel-title">Dashboard</div>
          <div class="panel-divider" style="background:#818cf8"></div>
          <div class="panel-body">Daily overview<br>Recent activity</div>
          <div class="panel-num">01</div>
        </div>

        <div class="panel hidden-above" data-panel="1">
          <div class="panel-eyebrow" style="color:#34d399">发现 · Discover</div>
          <div class="panel-title">Explore</div>
          <div class="panel-divider" style="background:#34d399"></div>
          <div class="panel-body">New content<br>Trending now</div>
          <div class="panel-num">02</div>
        </div>

        <div class="panel hidden-above" data-panel="2">
          <div class="panel-eyebrow" style="color:#fb923c">消息 · Messages</div>
          <div class="panel-title">Inbox</div>
          <div class="panel-divider" style="background:#fb923c"></div>
          <div class="panel-body">Unread messages<br>Notifications</div>
          <div class="panel-num">03</div>
        </div>

        <div class="panel hidden-above" data-panel="3">
          <div class="panel-eyebrow" style="color:#f472b6">我的 · Profile</div>
          <div class="panel-title">Account</div>
          <div class="panel-divider" style="background:#f472b6"></div>
          <div class="panel-body">Personal space<br>Preferences</div>
          <div class="panel-num">04</div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const tabEls  = document.querySelectorAll('.tab');
    const panelEls = document.querySelectorAll('.panel');

    // Tab accent colors (for the top border)
    const colors = ['#818cf8','#34d399','#fb923c','#f472b6'];

    // Apply accent to active tab
    function applyAccent(i) {
      document.querySelectorAll('.tab.active::before').forEach(el => {
        el.style.background = colors[i];
      });
      // Use CSS var via inline style on the tab element
      tabEls[i].style.setProperty('--ac', colors[i]);
      // Inject accent via pseudo-element trick: override tab border-top color
      tabEls.forEach((t, j) => {
        t.style.borderTopColor = j === i
          ? colors[i]
          : (t.matches(':hover') ? 'rgba(255,255,255,0.06)' : '#1e1e28');
      });
    }

    let current  = 0;
    let switching = false;

    function switchTo(i) {
      if (i === current || switching) return;
      switching = true;

      const direction = i > current ? 1 : -1; // +1 = going forward, -1 = going back

      // Current panel: exits upward
      panelEls[current].classList.remove('active');
      panelEls[current].classList.add('leaving-above');

      const prev = current;
      current = i;

      // New panel: starts below, flies in
      panelEls[current].classList.remove('hidden-above', 'hidden-below');
      // Force from below
      panelEls[current].style.transition = 'none';
      panelEls[current].style.transform  = `rotateX(${55 * direction}deg)`;
      panelEls[current].style.opacity    = '0';
      panelEls[current].style.pointerEvents = 'none';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          panelEls[current].style.transition = '';
          panelEls[current].style.transform  = '';
          panelEls[current].style.opacity    = '';
          panelEls[current].classList.add('active');

          setTimeout(() => {
            panelEls[prev].classList.remove('leaving-above');
            panelEls[prev].classList.add('hidden-above');
            switching = false;
          }, 500);
        });
      });

      // Tab switching
      tabEls[prev].classList.remove('active');
      tabEls[current].classList.add('active');
      applyAccent(current);
    }

    tabEls.forEach((tab, i) => tab.addEventListener('click', () => switchTo(i)));

    // Init accent
    applyAccent(0);
  </script>
</body>
</html>
