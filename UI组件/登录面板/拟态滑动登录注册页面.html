<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 拟态背景 ── */
    body {
      min-height: 100vh;
      background: #e8edf4;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Sans SC', sans-serif;
      overflow: auto;
      padding: 20px 0;
    }

    /* ── 外壳：拟态容器 ── */
    .auth-box {
      width: min(880px, 96vw);
      height: clamp(400px, 80vh, 560px);
      border-radius: clamp(16px, 2.5vw, 28px);
      background: #e8edf4;
      border: none;
      box-shadow:
        18px 18px 40px rgba(155,172,205,0.78),
        -12px -12px 30px rgba(255,255,255,0.98),
        0 4px 16px rgba(140,158,198,0.3);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ── 液态背景层 - 隐藏 ── */
    .liquid-bg { display: none; }
    .liq-blob  {}

    /* ── 两个非对称面板：表单70% / 覆盖30% ── */
    .panel {
      position: absolute; top: 0;
      height: 100%;
      transition: left 0.72s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* 分割线跟随面板边界动画 */
    .auth-box::after {
      content: '';
      position: absolute; top: 0; bottom: 0; left: 60%;
      width: 1px;
      background: transparent;
      box-shadow: -1px 0 0 rgba(148,165,198,0.28), 1px 0 0 rgba(255,255,255,0.88);
      z-index: 10; pointer-events: none;
      transition: left 0.72s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .auth-box.signup-mode::after { left: 40%; }

    /* 面板A：表单面板 60%（层级低） */
    .pA {
      left: 0; width: 60%;
      background: rgba(255,255,255,0.07);
      box-shadow: inset -8px 0 24px rgba(140,158,198,0.08);
      z-index: 1;
    }
    .auth-box.signup-mode .pA { left: 40%; }

    /* 面板B：覆盖层 40%（层级高，滑过时遮住 pA） */
    .pB {
      left: 60%; width: 40%;
      background: #e8edf4;
      z-index: 3;
      overflow: hidden;
    }
    .auth-box.signup-mode .pB { left: 0; }

    /* ── 拟态装饰圆 ── */
    .d1 {
      position: absolute;
      width: 230px; height: 230px; border-radius: 50%;
      background: #e8edf4;
      box-shadow: 9px 9px 20px rgba(168,182,208,0.65), -7px -7px 16px rgba(255,255,255,0.92);
      top: -95px; right: -85px;
      pointer-events: none;
    }
    .d2 {
      position: absolute;
      width: 210px; height: 210px; border-radius: 50%;
      background: #e8edf4;
      box-shadow: 8px 8px 18px rgba(168,182,208,0.6), -6px -6px 14px rgba(255,255,255,0.9);
      bottom: -85px; left: -75px;
      pointer-events: none;
    }

    /* ── 面板内容 ── */
    .p-inner {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(20px, 4.5vh, 48px) clamp(18px, 4.5vw, 52px);
    }

    .pA-reg { display: none; }
    .pA.show-reg .pA-login { display: none; }
    .pA.show-reg .pA-reg   { display: flex; }

    .pB-hello, .pB-welcome {
      text-align: center;
      padding: clamp(20px, 4.5vh, 52px) clamp(14px, 3.5vw, 40px);
      transition: opacity 0.18s ease;
    }
    .pB-welcome { opacity: 0; pointer-events: none; }
    .pB.show-welcome .pB-hello   { opacity: 0; pointer-events: none; }
    .pB.show-welcome .pB-welcome { opacity: 1; pointer-events: auto; }

    /* ── 表单元素 ── */
    .fp-title {
      font-size: clamp(17px, 2.6vw, 26px); font-weight: 700;
      color: #1e2545; letter-spacing: 0.18em;
      margin-bottom: clamp(12px, 2.5vh, 22px); white-space: nowrap;
    }

    .social-row { display: flex; gap: clamp(8px, 1.2vw, 14px); margin-bottom: clamp(6px, 1vh, 10px); }
    .s-icon {
      width: clamp(34px, 4.2vw, 44px); height: clamp(34px, 4.2vw, 44px); border-radius: 50%;
      background: #e8edf4;
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 7px 7px 14px rgba(155,172,205,0.72), -6px -6px 12px rgba(255,255,255,0.96);
      transition: box-shadow 0.22s, transform 0.22s;
    }
    .s-icon svg { width: 20px; height: 20px; opacity: 0.4; transition: opacity 0.22s; }
    .s-icon:hover {
      box-shadow: 9px 9px 18px rgba(155,172,205,0.76), -7px -7px 15px rgba(255,255,255,0.98);
      transform: translateY(-2px);
    }
    .s-icon:hover svg { opacity: 0.7; }
    .s-icon.active {
      box-shadow: inset 5px 5px 10px rgba(155,172,205,0.68), inset -4px -4px 8px rgba(255,255,255,0.9);
    }
    .s-icon.active svg { opacity: 1; }

    .social-hint { font-size: 11px; color: #9ba4bb; letter-spacing: 0.05em; margin-bottom: clamp(10px, 2vh, 20px); }

    .field { width: 100%; margin-bottom: clamp(6px, 1.3vh, 12px); }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.88);
      border: 1.5px solid #dde3ed;
      border-radius: 10px;
      padding: clamp(9px, 1.8vh, 13px) 16px;
      font-family: 'Noto Sans SC', sans-serif; font-size: clamp(13px, 1.5vw, 14px); color: #2a3054;
      outline: none;
      box-shadow: inset 2px 2px 5px rgba(155,172,205,0.22), inset -1px -1px 4px rgba(255,255,255,0.7);
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .field input::placeholder { color: #b8c2d8; }
    .field input:focus {
      border-color: rgba(91,122,247,0.6);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(91,122,247,0.1), inset 2px 2px 5px rgba(91,122,247,0.08);
    }

    .forgot {
      font-size: 12px; color: #9ba4bb;
      text-decoration: underline; text-underline-offset: 3px;
      cursor: pointer; margin: 2px 0 clamp(12px, 2vh, 20px);
      align-self: center;
      transition: color 0.2s;
    }
    .forgot:hover { color: #5b7af7; }

    /* 拟态蓝色按钮 */
    .btn-blue {
      padding: clamp(10px, 1.8vh, 13px) clamp(22px, 3.5vw, 48px); border-radius: 100px;
      border: none;
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      background: #5b7af7;
      color: #fff;
      box-shadow: 0 6px 22px rgba(91,122,247,0.45);
      transition: box-shadow 0.25s, transform 0.2s, background 0.2s;
      position: relative; z-index: 1;
    }
    .btn-blue:hover {
      background: #4a6ae6;
      box-shadow: 0 10px 30px rgba(91,122,247,0.55);
      transform: translateY(-1px);
    }
    .btn-blue:active { transform: translateY(0); }
    .btn-full { width: 100%; text-align: center; }

    /* ── 覆盖层文字 ── */
    .o-title {
      font-size: clamp(17px, 2.6vw, 26px); font-weight: 700; color: #1e2545;
      letter-spacing: 0.02em; margin-bottom: clamp(10px, 1.5vh, 14px);
      position: relative; z-index: 1;
    }
    .o-sub {
      font-size: clamp(11px, 1.3vw, 13px); color: #9ba4bb;
      line-height: 1.85; margin-bottom: clamp(18px, 3.5vh, 36px);
      max-width: 210px; position: relative; z-index: 1;
    }

    /* ── 移动端 ── */
    .mobile-nav { display: none; }

    @media (max-width: 640px) {
      body { padding: 12px 0; }

      .auth-box {
        height: auto;
        border-radius: 20px;
        overflow: visible;
        width: 92vw;
      }

      .panel {
        position: relative; left: 0 !important; width: 100% !important; height: auto;
        transition: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      .p-inner { position: relative; inset: auto; padding: 32px 24px; }
      .pB-hello, .pB-welcome { position: relative; inset: auto; }

      .pB { display: none !important; }

      .auth-box:not(.signup-mode) .pA-reg { display: none !important; }
      .auth-box.signup-mode .pA-login     { display: none !important; }
      .auth-box.signup-mode .pA-reg       { display: flex !important; }

      /* 移动端顶部 Tab */
      .mobile-nav {
        display: flex;
        background: #e8edf4;
        border-radius: 20px 20px 0 0;
        overflow: hidden;
        border-bottom: 1px solid rgba(200,212,232,0.6);
      }
      .m-tab {
        flex: 1; padding: 14px; text-align: center;
        font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
        color: #9ba4bb; cursor: pointer;
        border-bottom: 2px solid transparent; margin-bottom: -1px;
        transition: color 0.2s, border-color 0.2s;
      }
      .auth-box:not(.signup-mode) .m-tab-si,
      .auth-box.signup-mode       .m-tab-su {
        color: #5b7af7; border-bottom-color: #5b7af7;
      }

      .fp-title { white-space: normal; text-align: center; }
    }
  </style>
</head>
<body>

<div class="auth-box" id="authBox">

  <!-- 液态光球背景层 -->
  <div class="liquid-bg">
    <div class="liq-blob lb1"></div>
    <div class="liq-blob lb2"></div>
    <div class="liq-blob lb3"></div>
    <div class="liq-blob lb4"></div>
  </div>

  <!-- 移动端 Tab -->
  <div class="mobile-nav">
    <div class="m-tab m-tab-si" id="mSi">登录</div>
    <div class="m-tab m-tab-su" id="mSu">注册</div>
  </div>

  <!-- ★ 面板A：磨砂白玻璃表单面板 ★ -->
  <div class="panel pA" id="pA">

    <!-- 登录表单 -->
    <div class="p-inner pA-login">
      <div class="fp-title">登 入 账 号</div>
      <div class="social-row">
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6878c0" stroke-width="1.8" stroke-linecap="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6878c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="s-icon active">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6878c0" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" rx="4"/>
            <path d="M8 12h4M10 10v4M15 12h.01M17 12h.01"/>
          </svg>
        </div>
      </div>
      <div class="social-hint">选择登录方式 或 电子邮箱登录</div>
      <div class="field"><input type="text"     placeholder="用户名 / 邮箱" autocomplete="off" /></div>
      <div class="field"><input type="password" placeholder="密码" /></div>
      <span class="forgot">忘记密码?</span>
      <button class="btn-blue btn-full">SIGN IN</button>
    </div>

    <!-- 注册表单 -->
    <div class="p-inner pA-reg">
      <div class="fp-title">创 建 账 号</div>
      <div class="social-row">
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6878c0" stroke-width="1.8" stroke-linecap="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6878c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6878c0" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" rx="4"/>
            <path d="M8 12h4M10 10v4M15 12h.01M17 12h.01"/>
          </svg>
        </div>
      </div>
      <div class="social-hint">选择注册方式 或 电子邮箱注册</div>
      <div class="field"><input type="text"     placeholder="用户名" autocomplete="off" /></div>
      <div class="field"><input type="email"    placeholder="电子邮箱" /></div>
      <div class="field"><input type="password" placeholder="密码" /></div>
      <button class="btn-blue btn-full" style="margin-top:6px">SIGN UP</button>
    </div>

  </div>

  <!-- ★ 面板B：拟态覆盖层 ★ -->
  <div class="panel pB" id="pB">
    <div class="d1"></div>
    <div class="d2"></div>

    <!-- Hello Friend（登录模式） -->
    <div class="p-inner pB-hello">
      <div class="o-title">Hello Friend！</div>
      <div class="o-sub">去注册一个账号，成为尊贵的粉丝会员，让我们踏入奇妙的旅途！</div>
      <button class="btn-blue" id="toSignup">SIGN UP</button>
    </div>

    <!-- Welcome Back（注册模式） -->
    <div class="p-inner pB-welcome">
      <div class="o-title">Welcome Back！</div>
      <div class="o-sub">已经有账号了嘛，去登入账号来进入奇妙世界吧！！！</div>
      <button class="btn-blue" id="toSignin">SIGN IN</button>
    </div>

  </div>

</div>

<script>
  const box = document.getElementById('authBox');
  const pA  = document.getElementById('pA');
  const pB  = document.getElementById('pB');

  const DURATION = 720;
  let busy = false, timer;

  function go(toSignup) {
    if (busy) return;
    busy = true;
    clearTimeout(timer);
    box.classList.toggle('signup-mode', toSignup);
    timer = setTimeout(() => {
      pA.classList.toggle('show-reg',     toSignup);
      pB.classList.toggle('show-welcome', toSignup);
    }, DURATION / 2);
    setTimeout(() => { busy = false; }, DURATION);
  }

  document.getElementById('toSignup').addEventListener('click', () => go(true));
  document.getElementById('toSignin').addEventListener('click', () => go(false));
  document.getElementById('mSi').addEventListener('click', () => go(false));
  document.getElementById('mSu').addEventListener('click', () => go(true));
</script>
</body>
</html>
