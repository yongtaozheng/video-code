<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── 浅色背景 ── */
    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(180,190,255,0.55) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 70%, rgba(200,170,255,0.45) 0%, transparent 55%),
        #d4daf0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Sans SC', sans-serif;
      overflow: hidden;
    }

    /* ── 外壳：浅色玻璃容器 ── */
    .auth-box {
      width: min(880px, 96vw);
      height: 560px;
      border-radius: 28px;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.75);
      box-shadow:
        8px 8px 32px rgba(100,120,210,0.2),
        -4px -4px 20px rgba(255,255,255,0.9),
        inset 0 1px 0 rgba(255,255,255,0.8);
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* 顶部反光线 */
    .auth-box::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.9) 40%, rgba(255,255,255,0.6) 65%, transparent 95%);
      z-index: 100; pointer-events: none;
    }

    /* ── 液态背景层 ── */
    .liquid-bg {
      position: absolute; inset: 0; z-index: 0;
    }

    .liq-blob {
      position: absolute;
      filter: blur(62px);
      will-change: transform, border-radius;
    }

    .lb1 {
      width: 420px; height: 370px;
      background: radial-gradient(circle at 40% 40%, rgba(150,165,255,0.7) 0%, rgba(110,130,240,0.4) 55%, transparent 80%);
      top: -110px; left: -90px; opacity: 1;
      animation: ld1 11s ease-in-out infinite alternate, liqMorph 17s ease-in-out infinite;
    }
    .lb2 {
      width: 360px; height: 400px;
      background: radial-gradient(circle at 50% 40%, rgba(200,160,255,0.65) 0%, rgba(170,120,240,0.38) 55%, transparent 80%);
      bottom: -130px; right: -70px; opacity: 1;
      animation: ld2 9s ease-in-out infinite alternate, liqMorph 14s ease-in-out infinite;
      animation-delay: -3s, -5s;
    }
    .lb3 {
      width: 300px; height: 320px;
      background: radial-gradient(circle at 50% 50%, rgba(120,210,240,0.55) 0%, rgba(80,180,230,0.3) 55%, transparent 80%);
      top: 38%; left: 18%; opacity: 1;
      animation: ld3 14s ease-in-out infinite alternate, liqMorph 21s ease-in-out infinite;
      animation-delay: -6s, -9s;
    }
    .lb4 {
      width: 250px; height: 230px;
      background: radial-gradient(circle at 50% 50%, rgba(255,170,210,0.55) 0%, rgba(240,130,190,0.3) 55%, transparent 80%);
      top: 12%; right: 6%; opacity: 1;
      animation: ld1 8s ease-in-out infinite alternate-reverse, liqMorph 12s ease-in-out infinite;
      animation-delay: -1s, -6s;
    }

    @keyframes ld1 {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(55px, 40px) scale(1.1); }
    }
    @keyframes ld2 {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(-45px, -55px) scale(1.08); }
    }
    @keyframes ld3 {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(65px, -35px) scale(1.13); }
    }
    @keyframes liqMorph {
      0%   { border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%; }
      20%  { border-radius: 45% 55% 40% 60% / 65% 35% 55% 45%; }
      40%  { border-radius: 55% 45% 65% 35% / 40% 55% 45% 60%; }
      60%  { border-radius: 40% 60% 45% 55% / 60% 40% 60% 40%; }
      80%  { border-radius: 65% 35% 50% 50% / 45% 65% 35% 55%; }
      100% { border-radius: 60% 40% 55% 45% / 50% 60% 40% 50%; }
    }

    /* ── 两个独立半宽面板 ── */
    .panel {
      position: absolute; top: 0;
      width: 50%; height: 100%;
      transition: transform 0.72s cubic-bezier(0.65, 0, 0.35, 1);
      will-change: transform;
    }

    /* 面板A：磨砂白玻璃（表单） */
    .pA {
      left: 0;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(28px) saturate(1.7);
      -webkit-backdrop-filter: blur(28px) saturate(1.7);
      border-right: 1px solid rgba(255,255,255,0.38);
      z-index: 1;
    }
    /* 面板A 内边高光 */
    .pA::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 10;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.65),
                  inset 1px 0 0 rgba(255,255,255,0.3);
    }
    .auth-box.signup-mode .pA {
      transform: translateX(100%);
    }

    /* 面板B：浅色磨砂玻璃（覆盖层）*/
    .pB {
      left: 50%;
      background: rgba(195,210,245,0.42);
      backdrop-filter: blur(40px) saturate(1.6);
      -webkit-backdrop-filter: blur(40px) saturate(1.6);
      border-left: 1px solid rgba(255,255,255,0.65);
      z-index: 2;
      overflow: hidden;
    }
    /* 面板B 玻璃折射光泽 */
    .pB::after {
      content: '';
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.35) 0%,
        rgba(255,255,255,0.1) 35%,
        transparent 65%,
        rgba(200,215,255,0.12) 100%
      );
    }
    .auth-box.signup-mode .pB {
      transform: translateX(-100%);
    }

    /* ── 面板内容 ── */
    .p-inner {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 48px 52px;
    }

    .pA-reg { display: none; }
    .pA.show-reg .pA-login { display: none; }
    .pA.show-reg .pA-reg   { display: flex; }

    .pB-hello, .pB-welcome {
      text-align: center; padding: 52px 40px;
      transition: opacity 0.18s ease;
    }
    .pB-welcome { opacity: 0; pointer-events: none; }
    .pB.show-welcome .pB-hello   { opacity: 0; pointer-events: none; }
    .pB.show-welcome .pB-welcome { opacity: 1; pointer-events: auto; }

    /* ── 表单元素 ── */
    .fp-title {
      font-size: 26px; font-weight: 700;
      color: #1a2050; letter-spacing: 0.18em;
      margin-bottom: 22px; white-space: nowrap;
    }

    .social-row { display: flex; gap: 14px; margin-bottom: 10px; }
    .s-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(100,120,220,0.14);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: background 0.22s, transform 0.22s, box-shadow 0.22s;
    }
    .s-icon svg { width: 20px; height: 20px; opacity: 0.45; transition: opacity 0.22s; }
    .s-icon:hover {
      background: rgba(255,255,255,0.9);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(80,100,220,0.18);
    }
    .s-icon:hover svg { opacity: 0.8; }
    .s-icon.active {
      background: rgba(238,242,255,0.85);
      box-shadow: 0 0 0 4px rgba(90,112,232,0.14);
    }
    .s-icon.active svg { opacity: 1; }

    .social-hint { font-size: 11px; color: #a0aec8; letter-spacing: 0.05em; margin-bottom: 20px; }

    .field { width: 100%; margin-bottom: 12px; }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.5);
      border: 1.5px solid rgba(100,120,220,0.18);
      border-radius: 12px;
      padding: 13px 18px;
      font-family: 'Noto Sans SC', sans-serif; font-size: 14px; color: #1a2050;
      outline: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .field input::placeholder { color: #a8b8d8; }
    .field input:focus {
      border-color: rgba(90,112,232,0.55);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 0 0 3px rgba(90,112,232,0.12);
    }

    .forgot {
      font-size: 12px; color: #7888b8;
      text-decoration: underline; text-underline-offset: 3px;
      cursor: pointer; margin: 2px 0 20px;
      align-self: flex-start;
      transition: color 0.2s;
    }
    .forgot:hover { color: #5a70e8; }

    /* 表单面板按钮：蓝色渐变玻璃 */
    .btn-blue {
      padding: 13px 48px; border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.28);
      cursor: pointer;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      background: linear-gradient(135deg, rgba(106,130,236,0.9), rgba(74,94,224,0.9));
      color: #fff;
      box-shadow: 0 6px 22px rgba(70,90,220,0.5), inset 0 1px 0 rgba(255,255,255,0.22);
      transition: box-shadow 0.25s, transform 0.2s;
      position: relative; z-index: 1;
    }
    .btn-blue:hover {
      box-shadow: 0 10px 32px rgba(70,90,220,0.65), inset 0 1px 0 rgba(255,255,255,0.28);
      transform: translateY(-1px);
    }
    .btn-blue:active { transform: translateY(0); }
    .btn-full { width: 100%; text-align: center; }

    /* ── 覆盖层文字 ── */
    .o-title {
      font-size: 26px; font-weight: 700; color: #1a2050;
      letter-spacing: 0.02em; margin-bottom: 14px;
      position: relative; z-index: 1;
    }
    .o-sub {
      font-size: 13px; color: #6a7aa8;
      line-height: 1.85; margin-bottom: 36px;
      max-width: 210px; position: relative; z-index: 1;
    }

    /* ── 移动端 ── */
    .mobile-nav { display: none; }

    @media (max-width: 600px) {
      .auth-box { height: auto; border-radius: 20px; overflow: visible; }
      .panel {
        position: relative; left: 0; width: 100%; height: auto;
        transform: none !important; transition: none !important;
      }
      .pB { display: none; left: 0; }
      .p-inner { position: relative; inset: auto; }
      .pB-hello, .pB-welcome { position: relative; inset: auto; }
      .auth-box:not(.signup-mode) .pA-reg { display: none !important; }
      .auth-box.signup-mode .pA-login     { display: none !important; }
      .auth-box.signup-mode .pA-reg       { display: flex !important; }
      .mobile-nav {
        display: flex;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px 20px 0 0; overflow: hidden;
      }
      .m-tab {
        flex: 1; padding: 15px; text-align: center;
        font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
        color: #b8c0d8; cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: color 0.2s, border-color 0.2s;
      }
      .auth-box:not(.signup-mode) .m-tab-si,
      .auth-box.signup-mode       .m-tab-su {
        color: #5a70e8; border-bottom-color: #5a70e8;
      }
    }
  </style>
</head>
<body>

<div class="auth-box" id="authBox">

  <!-- 液态光球背景层 -->
  <div class="liquid-bg">
    <div class="liq-blob lb1"></div>
    <div class="liq-blob lb2"></div>
    <div class="liq-blob lb3"></div>
    <div class="liq-blob lb4"></div>
  </div>

  <!-- 移动端 Tab -->
  <div class="mobile-nav">
    <div class="m-tab m-tab-si" id="mSi">登录</div>
    <div class="m-tab m-tab-su" id="mSu">注册</div>
  </div>

  <!-- ★ 面板A：磨砂白玻璃表单面板 ★ -->
  <div class="panel pA" id="pA">

    <!-- 登录表单 -->
    <div class="p-inner pA-login">
      <div class="fp-title">登 入 账 号</div>
      <div class="social-row">
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5a70e8" stroke-width="1.8" stroke-linecap="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5a70e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="s-icon active">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5a70e8" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" rx="4"/>
            <path d="M8 12h4M10 10v4M15 12h.01M17 12h.01"/>
          </svg>
        </div>
      </div>
      <div class="social-hint">选择登录方式 或 电子邮箱登录</div>
      <div class="field"><input type="text"     placeholder="用户名 / 邮箱" autocomplete="off" /></div>
      <div class="field"><input type="password" placeholder="密码" /></div>
      <span class="forgot">忘记密码?</span>
      <button class="btn-blue btn-full">SIGN IN</button>
    </div>

    <!-- 注册表单 -->
    <div class="p-inner pA-reg">
      <div class="fp-title">创 建 账 号</div>
      <div class="social-row">
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5a70e8" stroke-width="1.8" stroke-linecap="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5a70e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <div class="s-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5a70e8" stroke-width="1.8" stroke-linecap="round">
            <rect x="2" y="6" width="20" height="12" rx="4"/>
            <path d="M8 12h4M10 10v4M15 12h.01M17 12h.01"/>
          </svg>
        </div>
      </div>
      <div class="social-hint">选择注册方式 或 电子邮箱注册</div>
      <div class="field"><input type="text"     placeholder="Name" autocomplete="off" /></div>
      <div class="field"><input type="email"    placeholder="Email" /></div>
      <div class="field"><input type="password" placeholder="Password" /></div>
      <button class="btn-blue btn-full" style="margin-top:6px">SIGN UP</button>
    </div>

  </div>

  <!-- ★ 面板B：染色磨砂玻璃覆盖层 ★ -->
  <div class="panel pB" id="pB">

    <!-- Hello Friend（登录模式） -->
    <div class="p-inner pB-hello">
      <div class="o-title">Hello Friend！</div>
      <div class="o-sub">去注册一个账号，成为尊贵的粉丝会员，让我们踏入奇妙的旅途！</div>
      <button class="btn-blue" id="toSignup">SIGN UP</button>
    </div>

    <!-- Welcome Back（注册模式） -->
    <div class="p-inner pB-welcome">
      <div class="o-title">Welcome Back！</div>
      <div class="o-sub">已经有账号了嘛，去登入账号来进入奇妙世界吧！！！</div>
      <button class="btn-blue" id="toSignin">SIGN IN</button>
    </div>

  </div>

</div>

<script>
  const box = document.getElementById('authBox');
  const pA  = document.getElementById('pA');
  const pB  = document.getElementById('pB');

  const DURATION = 720;
  let busy = false, timer;

  function go(toSignup) {
    if (busy) return;
    busy = true;
    clearTimeout(timer);
    box.classList.toggle('signup-mode', toSignup);
    timer = setTimeout(() => {
      pA.classList.toggle('show-reg',     toSignup);
      pB.classList.toggle('show-welcome', toSignup);
    }, DURATION / 2);
    setTimeout(() => { busy = false; }, DURATION);
  }

  document.getElementById('toSignup').addEventListener('click', () => go(true));
  document.getElementById('toSignin').addEventListener('click', () => go(false));
  document.getElementById('mSi').addEventListener('click', () => go(false));
  document.getElementById('mSu').addEventListener('click', () => go(true));
</script>
</body>
</html>
