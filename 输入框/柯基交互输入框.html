<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>柯基交互输入框</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        background-color: #f0f8ff;
        overflow: hidden;
        perspective: 1000px;
      }
      .wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 320px;
      }
      .dog-container {
        position: relative;
        width: 140px;
        margin-bottom: -15px;
        z-index: 1;
        transition: transform 0.3s ease-out;
      }
      .dog-container svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .input-wrap {
        width: 100%;
        position: relative;
        z-index: 0;
      }
      .input-wrap input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px 18px;
        font-size: 16px;
        border: 2px solid #e8d5c4;
        border-radius: 16px;
        background: #fff;
        color: #333;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
        font-family: inherit;
      }
      .input-wrap input::placeholder {
        color: #aaa;
      }
      .input-wrap input:focus {
        border-color: #894101;
        box-shadow: 0 0 0 3px rgba(137, 65, 1, 0.15);
      }

      #eye-left-group {
        transform-origin: 93px 122px;
      }
      #eye-right-group {
        transform-origin: 172px 122px;
      }

      @keyframes wink-animation {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(0.2);
        }
      }

      .wink {
        animation: wink-animation 0.3s ease-in-out;
      }

      @keyframes bounce-typing {
        0%, 100% { transform: translateY(0) scale(1); }
        30% { transform: translateY(-6px) scale(1.05); }
        60% { transform: translateY(2px) scale(0.98); }
      }
      .dog-container.bounce {
        animation: bounce-typing 0.4s ease-out;
      }

      .thought-bubble {
        position: absolute;
        left: 50%;
        top: -8px;
        transform: translate(-50%, -100%);
        background: #fff;
        border: 2px solid #e8d5c4;
        border-radius: 12px;
        padding: 6px 12px;
        font-size: 13px;
        color: #894101;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        box-shadow: 0 2px 8px rgba(137, 65, 1, 0.12);
        z-index: 2;
      }
      .thought-bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        margin-left: -6px;
        border: 6px solid transparent;
        border-top-color: #fff;
        border-bottom: none;
      }
      .thought-bubble.show {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
      }
    </style>
  </head>

      <div class="input-wrap">
        <input type="text" placeholder="输入点什么吧～" />
      </div>
    </div>

    <script>
      const dogContainer = document.querySelector(".dog-container");
      const leftPupil = document.getElementById("pupil-left");
      const rightPupil = document.getElementById("pupil-right");
      const leftEyeGroup = document.getElementById("eye-left-group");
      const rightEyeGroup = document.getElementById("eye-right-group");
      const dogSvg = document.querySelector("svg");
      const inputEl = document.querySelector(".input-wrap input");
      const thoughtBubble = document.getElementById("thought-bubble");

      const leftEyeCenter = { x: 93, y: 122 };
      const rightEyeCenter = { x: 172, y: 122 };
      const lookAtInputPoint = { x: 128, y: 210 };

      const maxRadius = 6;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let lookAtInput = false;
      let currentPupilPos = {
        left: { x: leftEyeCenter.x, y: leftEyeCenter.y },
        right: { x: rightEyeCenter.x, y: rightEyeCenter.y },
      };
      const smoothingFactor = 0.08;
      let bubbleHideTimer = 0;
      let bounceDebounce = 0;

      window.addEventListener("mousemove", (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
      });

      inputEl.addEventListener("focus", () => {
        lookAtInput = true;
      });
      inputEl.addEventListener("blur", () => {
        lookAtInput = false;
        thoughtBubble.classList.remove("show");
        thoughtBubble.textContent = "";
      });
      inputEl.addEventListener("input", () => {
        const len = inputEl.value.length;
        if (len > 0) {
          thoughtBubble.textContent = len >= 10 ? "写了好多呀～" : len >= 5 ? "汪！写得好～" : "在写啥呢...";
          thoughtBubble.classList.add("show");
          clearTimeout(bubbleHideTimer);
          bubbleHideTimer = setTimeout(() => {
            thoughtBubble.classList.remove("show");
          }, 1800);
        } else {
          thoughtBubble.classList.remove("show");
        }
        clearTimeout(bounceDebounce);
        dogContainer.classList.add("bounce");
        bounceDebounce = setTimeout(() => {
          dogContainer.classList.remove("bounce");
        }, 420);
      });

      function animate() {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const rotateX = ((mouseY - centerY) / centerY) * -10;
        const rotateY = ((mouseX - centerX) / centerX) * 10;
        dogContainer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

        let pointInSvg;
        if (lookAtInput) {
          pointInSvg = lookAtInputPoint;
        } else {
          const svgPoint = dogSvg.createSVGPoint();
          svgPoint.x = mouseX;
          svgPoint.y = mouseY;
          pointInSvg = svgPoint.matrixTransform(
            dogSvg.getScreenCTM().inverse()
          );
        }

        const deltaLeftX = pointInSvg.x - leftEyeCenter.x;
        const deltaLeftY = pointInSvg.y - leftEyeCenter.y;
        const angleLeft = Math.atan2(deltaLeftY, deltaLeftX);
        const distanceLeft = Math.sqrt(deltaLeftX ** 2 + deltaLeftY ** 2);
        const targetLeftX =
          leftEyeCenter.x +
          Math.cos(angleLeft) * Math.min(distanceLeft, maxRadius);
        const targetLeftY =
          leftEyeCenter.y +
          Math.sin(angleLeft) * Math.min(distanceLeft, maxRadius);

        const deltaRightX = pointInSvg.x - rightEyeCenter.x;
        const deltaRightY = pointInSvg.y - rightEyeCenter.y;
        const angleRight = Math.atan2(deltaRightY, deltaRightX);
        const distanceRight = Math.sqrt(deltaRightX ** 2 + deltaRightY ** 2);
        const targetRightX =
          rightEyeCenter.x +
          Math.cos(angleRight) * Math.min(distanceRight, maxRadius);
        const targetRightY =
          rightEyeCenter.y +
          Math.sin(angleRight) * Math.min(distanceRight, maxRadius);

        currentPupilPos.left.x +=
          (targetLeftX - currentPupilPos.left.x) * smoothingFactor;
        currentPupilPos.left.y +=
          (targetLeftY - currentPupilPos.left.y) * smoothingFactor;
        currentPupilPos.right.x +=
          (targetRightX - currentPupilPos.right.x) * smoothingFactor;
        currentPupilPos.right.y +=
          (targetRightY - currentPupilPos.right.y) * smoothingFactor;

        leftPupil.setAttribute(
          "transform",
          `translate(${currentPupilPos.left.x}, ${currentPupilPos.left.y})`
        );
        rightPupil.setAttribute(
          "transform",
          `translate(${currentPupilPos.right.x}, ${currentPupilPos.right.y})`
        );

        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener("click", () => {
        if (leftEyeGroup.classList.contains("wink")) return;

        leftEyeGroup.classList.add("wink");
        rightEyeGroup.classList.add("wink");

        setTimeout(() => {
          leftEyeGroup.classList.remove("wink");
          rightEyeGroup.classList.remove("wink");
        }, 300);
      });
    </script>
