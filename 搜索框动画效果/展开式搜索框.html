<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>展开式搜索框</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: white;
        min-height: 100vh;
        font-family: "Arial", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        width: 100%;
      }

      .search-container {
        background: transparent;
        padding: 2rem;
      }

      /* 展开式搜索框 */
      .expand-search {
        position: relative;
        width: 100%;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .expand-search input {
        width: 60px;
        height: 60px;
        border: 3px solid #667eea;
        border-radius: 50%;
        background: white;
        padding: 0 25px;
        font-size: 18px;
        transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        outline: none;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        text-align: left;
        position: relative;
        overflow: hidden;
      }

      .expand-search input:focus {
        width: 100%;
        border-radius: 30px;
        text-align: left;
        box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        transform: scale(1.05);
      }

      .expand-search input.has-content {
        width: 100%;
        border-radius: 30px;
        text-align: left;
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        transform: none;
      }

      .expand-search input::placeholder {
        transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        opacity: 0.7;
        text-align: left;
      }

      .expand-search input:focus::placeholder {
        opacity: 1;
      }

      .expand-search .clear-btn {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        font-size: 18px;
        cursor: pointer;
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 15;
        background: none;
        border: none;
        padding: 5px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
      }

      .expand-search .clear-btn:hover {
        background: rgba(0, 0, 0, 0.1);
        color: #666;
      }

      .expand-search .clear-btn.show {
        opacity: 1;
      }

      .expand-search .search-icon {
        position: absolute;
        right: 50%;
        top: 50%;
        transform: translate(50%, -50%);
        color: #667eea;
        font-size: 24px;
        pointer-events: none;
        transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        z-index: 10;
      }

      .expand-search input:focus + .search-icon {
        right: 25px;
        transform: translateY(-50%) rotate(360deg);
        color: #764ba2;
      }

      /* 确保失焦时图标回到中心 */
      .expand-search input:not(:focus) + .search-icon {
        right: 50% !important;
        transform: translate(50%, -50%) !important;
        color: #667eea !important;
      }

      /* 响应式设计 */
      @media (max-width: 768px) {
        .search-container {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="search-container">
        <div class="expand-search">
          <input type="text" placeholder="搜索..." />
          <div class="search-icon">🔍</div>
          <button class="clear-btn" type="button">×</button>
        </div>
      </div>
    </div>

    <script>
      // 展开式搜索框交互效果
      document.addEventListener("DOMContentLoaded", function () {
        const expandSearch = document.querySelector(".expand-search input");
        const clearBtn = document.querySelector(".clear-btn");
        const searchIcon = document.querySelector(".search-icon");

        if (expandSearch && clearBtn && searchIcon) {
          // 更新清除按钮显示状态
          function updateClearButton() {
            if (expandSearch.value.trim() !== "") {
              clearBtn.classList.add("show");
              searchIcon.style.opacity = "0";
              expandSearch.classList.add("has-content");
              // 确保有内容时保持胶囊型
              expandSearch.style.width = "100%";
              expandSearch.style.borderRadius = "30px";
            } else {
              clearBtn.classList.remove("show");
              searchIcon.style.opacity = "1";
              expandSearch.classList.remove("has-content");
            }
          }

          // 聚焦事件
          expandSearch.addEventListener("focus", function () {
            this.style.width = "100%";
            this.style.borderRadius = "30px";
          });

          // 失焦事件
          expandSearch.addEventListener("blur", function () {
            // 只有当输入框为空时才收起
            if (this.value.trim() === "") {
              this.style.width = "60px";
              this.style.borderRadius = "50%";
            }
            // 有内容时保持胶囊型，不需要额外处理
          });

          // 输入事件
          expandSearch.addEventListener("input", function () {
            updateClearButton();
            if (this.value.length > 0) {
              this.style.borderColor = "#667eea";
            } else {
              this.style.borderColor = "#667eea";
            }
          });

          // 清除按钮点击事件
          clearBtn.addEventListener("click", function () {
            expandSearch.value = "";
            expandSearch.focus();
            updateClearButton();
          });

          // 添加键盘支持
          expandSearch.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              this.blur();
            }
          });

          // 初始化
          updateClearButton();
        }
      });
    </script>
  </body>
</html>
